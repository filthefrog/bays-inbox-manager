name: Test

# I test di listino, PDF ed endpoint girano a ogni modifica: un errore viene
# segnalato su GitHub prima di arrivare al sito.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAYS Inbox Manager</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
    }
    
    .container {
      max-width: 100%;
      background: white;
      min-height: 100vh;
      padding: 1rem;
    }
    
    .header {
      margin-bottom: 2rem;
      border-bottom: 1px solid #e5e5e5;
      padding-bottom: 1rem;
    }
    
    .title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    
    .subtitle {
      font-size: 13px;
      color: #666;
    }
    
    .section {
      margin-bottom: 1.5rem;
    }
    
    .label {
      font-size: 12px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }
    
    input, textarea {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      font-family: inherit;
      margin-bottom: 12px;
    }
    
    textarea {
      min-height: 80px;
      resize: vertical;
    }
    
    input:focus, textarea:focus {
      outline: none;
      border-color: #0084ff;
      box-shadow: 0 0 0 3px rgba(0, 132, 255, 0.1);
    }
    
    button {
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #0084ff;
      color: white;
      cursor: pointer;
      width: 100%;
      margin-bottom: 8px;
    }
    
    button:hover {
      background: #0066cc;
    }
    
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .secondary {
      background: white;
      color: #0084ff;
      border: 1px solid #0084ff;
    }
    
    .secondary:hover {
      background: #f0f7ff;
    }
    
    .approve {
      background: #31a24c;
    }
    
    .approve:hover {
      background: #2a8c41;
    }
    
    .reject {
      background: white;
      color: #dc3545;
      border: 1px solid #dc3545;
    }
    
    .reject:hover {
      background: #fff5f6;
    }
    
    .hidden {
      display: none;
    }
    
    .loader {
      text-align: center;
      padding: 2rem;
    }
    
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0084ff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .email-detail {
      background: #f9f9f9;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
    }
    
    .meta-row {
      font-size: 13px;
      margin-bottom: 8px;
    }
    
    .meta-label {
      font-weight: 600;
      color: #666;
    }
    
    .badge {
      display: inline-block;
      background: #e8f3ff;
      color: #0084ff;
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 4px;
      font-weight: 600;
      margin-right: 8px;
      margin-bottom: 8px;
    }
    
    .response-option {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 12px;
    }
    
    .response-label {
      font-size: 12px;
      color: #666;
      font-weight: 600;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    
    .response-text {
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
      background: #f9f9f9;
      padding: 12px;
      border-radius: 4px;
    }
    
    .button-group {
      display: flex;
      gap: 8px;
    }
    
    .button-group button {
      flex: 1;
      margin-bottom: 0;
    }
    
    .status-approved {
      background: #e8f5e9;
      color: #31a24c;
      padding: 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 12px;
    }
    
    .error {
      background: #ffebee;
      color: #c62828;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 13px;
    }
    
    .back-btn {
      background: white;
      color: #0084ff;
      border: 1px solid #0084ff;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">BAYS Inbox Manager</div>
      <div class="subtitle">Civitanova Marche • Via Papa Giovanni XXIII, 106</div>
    </div>
    
    <div id="app"></div>
  </div>

  <script>
    const KNOWLEDGE_BASE = {
      name: "BAYS",
      address: "Via Papa Giovanni XXIII, 106, Civitanova Marche (MC)",
      type: "Affittacamere",
      rooms: 2,
      beds: 4,
      bathrooms: 2,
      sqm: 75,
      priceHigh: "€150/notte",
      priceLow: "€80/notte",
      discount7nights: "-15%",
      discount30nights: "-30%",
      beach: "1,6 km",
      parking: "Garage privato incluso",
      wifi: "Fibra ottica 100 Mbps",
      checkin: "Qualsiasi ora (self check-in digitale)",
      checkout: "Entro le 11:00",
      cancellation: "Entro 14 giorni: rimborso totale. 7-14 giorni: 50%. Entro 7: nessun rimborso",
      noBreakfast: "No colazione (affittacamere autonomo)",
      contactEmail: "info@baysvilla.it",
      contactPhone: "+39 375 XXXXXX"
    };

    class BAYSManager {
      constructor() {
        this.view = 'setup';
        this.apiKey = null;
        this.currentEmail = null;
        this.category = null;
        this.tone = null;
        this.responses = [];
        this.approvedResponseIdx = null;
      }

      async callClaudeAPI(messages) {
        try {
          const response = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-api-key": this.apiKey,
              "anthropic-version": "2023-06-01"
            },
            body: JSON.stringify({
              model: "claude-3-5-sonnet-20241022",
              max_tokens: 2000,
              messages: messages
            })
          });

          if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error?.message || "Errore API");
          }

          const data = await response.json();
          return data.content[0].text;
        } catch (error) {
          throw new Error("Errore nella chiamata API: " + error.message);
        }
      }

      async analyzeEmail() {
        if (!this.currentEmail.from || !this.currentEmail.subject || !this.currentEmail.body) {
          alert("Compila tutti i campi!");
          return;
        }

        this.view = 'analyzing';
        this.render();

        try {
          // Categorizzazione
          const categoryPrompt = `Sei un assistente per il gestionale di un affittacamere (BAYS, Civitanova Marche).
          
Categorizza questa email in UNA sola categoria:
- Lamentela
- Prenotazione
- Problema tecnico
- Fatturazione
- Richiesta informazioni
- Complimento
- Cancellazione

Email:
From: ${this.currentEmail.from}
Subject: ${this.currentEmail.subject}
Body: ${this.currentEmail.body}

Rispondi solo con: "Categoria: [nome categoria]" e "Tone: [Cortese/Neutro/Urgente/Arrabbiato]"`;

          const categoryResponse = await this.callClaudeAPI([
            { role: "user", content: categoryPrompt }
          ]);

          // Estrai categoria e tone
          const catMatch = categoryResponse.match(/Categoria:\s*(.+)/);
          const toneMatch = categoryResponse.match(/Tone:\s*(.+)/);
          
          this.category = catMatch ? catMatch[1].trim() : "Richiesta informazioni";
          this.tone = toneMatch ? toneMatch[1].trim() : "Neutro";

          // Genera risposte
          const responsePrompt = `Sei Filippo, gestore di BAYS (affittacamere a Civitanova Marche).

KNOWLEDGE BASE:
${JSON.stringify(KNOWLEDGE_BASE, null, 2)}

TONE DI VOICE: Caldo, responsabile, professionale, umano. Proteggo l'azienda al 100% senza scuse. Riconosco i problemi del cliente ma non faccio promesse impossibili. Veloce nella formulazione, soluzioni concrete.

Email ricevuta:
From: ${this.currentEmail.from}
Subject: ${this.currentEmail.subject}
Body: ${this.currentEmail.body}

Categoria: ${this.category}
Tone cliente: ${this.tone}

Genera 3 risposte email perfette, ognuna leggermente diversa nello stile ma tutte certificate, professionali e coerenti col tone di BAYS. 

Formato risposta:
---RISPOSTA 1---
[testo della risposta]
---RISPOSTA 2---
[testo della risposta]
---RISPOSTA 3---
[testo della risposta]`;

          const responsesText = await this.callClaudeAPI([
            { role: "user", content: responsePrompt }
          ]);

          // Estrai le 3 risposte
          const respMatches = responsesText.split(/---RISPOSTA \d+---/);
          this.responses = respMatches
            .slice(1, 4)
            .map(r => r.trim())
            .filter(r => r.length > 0);

          if (this.responses.length < 3) {
            this.responses = Array(3).fill("Risposta non generata correttamente");
          }

          this.view = 'detail';
          this.render();
        } catch (error) {
          this.view = 'setup';
          alert("Errore: " + error.message);
          this.render();
        }
      }

      openGmailCompose(responseIdx) {
        const response = this.responses[responseIdx];
        const toEmail = this.currentEmail.from.match(/[\w.-]+@[\w.-]+\.\w+/)?.[0] || "cliente@example.com";
        
        const mailtoUrl = `https://mail.google.com/mail/?ui=2&view=cm&to=${encodeURIComponent(toEmail)}&subject=${encodeURIComponent("RE: " + this.currentEmail.subject)}&body=${encodeURIComponent(response)}`;
        
        window.open(mailtoUrl, '_blank');
        this.approvedResponseIdx = responseIdx;
        this.render();
      }

      reject(idx) {
        this.responses.splice(idx, 1);
        this.render();
      }

      setApiKey(key) {
        this.apiKey = key;
        this.view = 'input';
        this.render();
      }

      resetForm() {
        this.currentEmail = { from: '', subject: '', body: '' };
        this.category = null;
        this.tone = null;
        this.responses = [];
        this.approvedResponseIdx = null;
        this.view = 'input';
        this.render();
      }

      renderSetup() {
        return `
          <div class="section">
            <label class="label">Inserisci la tua Claude API Key</label>
            <input type="password" id="apiKeyInput" placeholder="sk-ant-v0-..." style="margin-bottom: 1rem;">
            <button onclick="app.setApiKey(document.getElementById('apiKeyInput').value)">
              Prosegui
            </button>
            <p style="font-size: 12px; color: #666; margin-top: 1rem;">
              La key rimane solo nel tuo browser. Non viene inviata da nessuna parte.
            </p>
          </div>
        `;
      }

      renderInput() {
        return `
          <div class="section">
            <label class="label">Da (email del cliente)</label>
            <input type="email" id="fromInput" placeholder="cliente@example.com" value="${this.currentEmail?.from || ''}">
            
            <label class="label">Oggetto</label>
            <input type="text" id="subjectInput" placeholder="Oggetto email" value="${this.currentEmail?.subject || ''}">
            
            <label class="label">Corpo dell'email</label>
            <textarea id="bodyInput" placeholder="Copia il testo dell'email...">${this.currentEmail?.body || ''}</textarea>
            
            <button onclick="app.prepareEmail()">
              🔍 Analizza con Claude
            </button>
          </div>
        `;
      }

      renderAnalyzing() {
        return `
          <div class="loader">
            <div class="spinner"></div>
            <p>Claude sta analizzando l'email...</p>
          </div>
        `;
      }

      renderDetail() {
        if (!this.currentEmail) return '';
        
        let html = `
          <button class="back-btn" onclick="app.resetForm()">← Nuova email</button>
          
          <div class="email-detail">
            <div class="meta-row">
              <span class="meta-label">Da:</span> ${this.currentEmail.from}
            </div>
            <div class="meta-row">
              <span class="meta-label">Oggetto:</span> ${this.currentEmail.subject}
            </div>
            <div style="margin-top: 12px;">
              <span class="badge">${this.category}</span>
              <span class="badge">${this.tone}</span>
            </div>
          </div>
          
          <div style="font-size: 14px; font-weight: 600; margin-bottom: 1rem;">
            3 Risposte consigliate
          </div>
        `;

        this.responses.forEach((resp, idx) => {
          const isApproved = this.approvedResponseIdx === idx;
          html += `
            <div class="response-option">
              <div class="response-label">Opzione ${idx + 1}</div>
              <div class="response-text">${resp}</div>
              <div class="button-group">
                <button class="approve" onclick="app.openGmailCompose(${idx})">
                  ✓ Approva e apri Gmail
                </button>
                <button class="reject" onclick="app.reject(${idx})">
                  ✗ Rifiuta
                </button>
              </div>
              ${isApproved ? '<div class="status-approved">✓ Mail aperta in Gmail</div>' : ''}
            </div>
          `;
        });

        return html;
      }

      prepareEmail() {
        this.currentEmail = {
          from: document.getElementById('fromInput').value,
          subject: document.getElementById('subjectInput').value,
          body: document.getElementById('bodyInput').value
        };
        this.analyzeEmail();
      }

      render() {
        const app = document.getElementById('app');
        let html = '';
        
        if (this.view === 'setup') {
          html = this.renderSetup();
        } else if (this.view === 'input') {
          html = this.renderInput();
        } else if (this.view === 'analyzing') {
          html = this.renderAnalyzing();
        } else if (this.view === 'detail') {
          html = this.renderDetail();
        }
        
        app.innerHTML = html;
      }
    }

    const app = new BAYSManager();
    app.render();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ACME</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ACME">
<link rel="apple-touch-icon" href="/icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Stile ispirato a Whoop, in versione chiara: fondo bianco, superfici grigio
     tenue senza ombre, numeri grandi in condensed, etichette maiuscole spaziate,
     colore usato solo come segnale (verde ok, giallo attenzione, rosso urgente). */
  :root {
    --bg: #ffffff;
    --card: #f4f5f6;
    --card-strong: #eceef0;
    --text: #0b0c0e;
    --text-secondary: #7a7f87;
    --accent: #0b0c0e;
    --accent-ink: #000000;
    --clay: #7a7f87;
    --green: #00b86b;
    --red: #f0283c;
    --orange: #ff7a1a;
    --amber: #e5a800;
    --blue: #1a73f0;
    --purple: #7b61ff;
    --teal: #00a3b4;
    --gray: #a3a8af;
    --border: rgba(11,12,14,0.08);
    --radius-sm: 12px;
    --radius-md: 16px;
    --radius-lg: 20px;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --shadow-card: none;
    --shadow-card-active: none;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "tnum" 1, "cv11" 1;
  }
  .container { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 20px) 18px 48px; min-height: 100vh; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  .topbar { padding: 8px 2px 24px; }
  .topbar .eyebrow { font-size: 11px; color: var(--text-secondary); font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 4px; }
  .topbar h1 { font-family: var(--display); font-size: 40px; font-weight: 700; letter-spacing: 0.01em; line-height: 1; text-transform: uppercase; }

  .test-auto { font-size: 12px; margin-top: 6px; line-height: 1.4; }
  .test-auto.ok { color: var(--green); }
  .test-auto.ko { color: var(--red); }
  .test-note { font-size: 12.5px; margin-top: 8px; padding: 8px 10px; background: var(--card); border-radius: 8px; cursor: pointer; line-height: 1.4; }
  .report-box { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; white-space: pre; min-height: 220px; }
  details.test-details summary { cursor: pointer; font-size: 13px; color: var(--text-secondary); padding: 6px 0; }
  .test-toggle {
    width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--card);
    font-size: 16px; cursor: pointer; flex-shrink: 0; padding: 0;
  }
  .test-checks { margin: 8px 0 0 18px; font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; }

  .reminder-badge {
    position: relative; width: 42px; height: 42px; border-radius: 50%;
    background: var(--card); border: none; color: var(--text);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer; margin-top: 2px; flex-shrink: 0;
  }
  .reminder-badge svg.i { width: 20px; height: 20px; }
  .reminder-badge:active { transform: scale(0.94); }
  .reminder-count {
    position: absolute; top: -3px; right: -3px;
    background: var(--red); color: white; font-size: 10.5px; font-weight: 700;
    min-width: 18px; height: 18px; border-radius: 9px; padding: 0 4px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--bg);
  }

  /* --- Dashboard: anelli + elenco metriche --- */
  .rings {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    background: var(--card); border-radius: var(--radius-lg); padding: 20px 8px 18px; margin-bottom: 12px;
  }
  .ring { text-align: center; cursor: pointer; transition: transform 0.15s ease; }
  .ring:active { transform: scale(0.96); }
  .ring-svg { position: relative; width: 84px; height: 84px; margin: 0 auto 10px; }
  .ring-svg svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-svg .track { fill: none; stroke: rgba(11,12,14,0.07); stroke-width: 7; }
  .ring-svg .arc { fill: none; stroke-width: 7; stroke-linecap: round; transition: stroke-dasharray 0.8s cubic-bezier(.2,.7,.2,1); }
  .ring-svg .val {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--display); font-size: 32px; font-weight: 700; line-height: 1;
  }
  .ring.zero .ring-svg .val { color: var(--gray); }
  .ring .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-secondary); }

  .metrics { background: var(--card); border-radius: var(--radius-lg); overflow: hidden; }
  .metric { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; }
  .metric + .metric { border-top: 1px solid var(--border); }
  .metric:active { background: var(--card-strong); }
  .metric .bar { width: 4px; height: 28px; border-radius: 2px; flex-shrink: 0; }
  .metric .m-label { flex: 1; font-size: 14.5px; font-weight: 500; }
  .metric .m-count { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1; min-width: 28px; text-align: right; }
  .metric.zero .m-label, .metric.zero .m-count { color: var(--text-secondary); }
  .metric.zero .bar { opacity: 0.3; }
  .metric .m-chev { color: var(--gray); }
  .c-red { color: var(--red); } .bg-red { background: var(--red); }
  .c-amber { color: var(--amber); } .bg-amber { background: var(--amber); }
  .c-blue { color: var(--blue); } .bg-blue { background: var(--blue); }
  .c-orange { color: var(--orange); } .bg-orange { background: var(--orange); }
  .c-purple { color: var(--purple); } .bg-purple { background: var(--purple); }
  .c-teal { color: var(--teal); } .bg-teal { background: var(--teal); }
  .c-green { color: var(--green); } .bg-green { background: var(--green); }
  .c-gray { color: var(--gray); } .bg-gray { background: var(--gray); }

  /* Schede generiche (ancora usate altrove) */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card {
    background: var(--card); border-radius: var(--radius-lg); padding: 18px;
    position: relative; overflow: hidden; transition: transform 0.15s ease; cursor: pointer;
  }
  .card:active { transform: scale(0.97); }
  .card .icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 19px; margin-bottom: 14px; }
  .card .name { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 4px; }
  .card .count { font-family: var(--display); font-size: 34px; font-weight: 700; }
  .card .count.zero { color: var(--gray); }

  .confirm-booking-box { background: rgba(0,184,107,0.08); border-radius: var(--radius-lg); padding: 18px; margin-top: 16px; text-align: center; }
  .confirm-booking-box .title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .confirm-booking-box .subtitle { font-size: 12px; color: var(--text-secondary); margin-bottom: 14px; }
  .confirm-booking-box .btn { background: var(--green); color: white; width: 100%; }
  .confirm-booking-box .btn.confirmed { background: rgba(0,184,107,0.14); color: var(--green); }
  .confirm-booking-box .code-line { font-size: 13px; color: var(--text-secondary); margin-top: 10px; }
  .confirm-booking-box .code-line b { color: var(--text); font-family: ui-monospace, SFMono-Regular, monospace; letter-spacing: 0.02em; }

  .booking-row {
    background: var(--card); border-radius: var(--radius-md);
    padding: 16px 44px 16px 16px; margin-bottom: 8px; position: relative; cursor: pointer;
    transition: transform 0.15s ease;
  }
  .booking-row:active { transform: scale(0.98); }
  .booking-row .name { font-size: 15.5px; font-weight: 600; margin-bottom: 4px; padding-right: 30px; }
  .booking-row .dates { font-size: 13px; color: var(--text-secondary); }
  .booking-row .dates b { color: var(--text); font-weight: 600; }
  .booking-row .total { font-family: var(--display); font-size: 22px; font-weight: 700; color: var(--text); line-height: 1; }
  .booking-row .rate-info { font-size: 12px; color: var(--text-secondary); }
  .booking-row .code-tag { font-size: 11px; color: var(--text-secondary); font-family: ui-monospace, SFMono-Regular, monospace; margin-top: 6px; letter-spacing: 0.02em; }
  .booking-row .status-tag { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; padding: 4px 8px; border-radius: 100px; margin-top: 6px; }
  .status-confermata { background: rgba(0,184,107,0.12); color: #00915a; }
  .status-in-arrivo { background: rgba(26,115,240,0.1); color: var(--blue); }
  .status-conclusa { background: rgba(11,12,14,0.06); color: var(--text-secondary); }
  .status-cancellata { background: rgba(240,40,60,0.1); color: var(--red); }
  .booking-row .dismiss-btn { top: 12px; right: 12px; }
  .booking-row.has-quick-action { padding-bottom: 44px; }
  .flag-btn {
    position: absolute; bottom: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(0,184,107,0.14); color: var(--green); border: none; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
  }
  .flag-btn:active { background: rgba(0,184,107,0.26); }

  .search-bar { position: relative; margin-bottom: 14px; }
  .search-bar input {
    width: 100%; padding: 13px 16px; border-radius: 100px; border: none;
    font-size: 15px; font-family: inherit; background: var(--card); color: var(--text);
  }
  .search-bar input:focus { outline: none; box-shadow: 0 0 0 2px var(--text); background: var(--bg); }

  .guest-selector, .pay-selector { display: flex; gap: 4px; margin-bottom: 12px; background: var(--card); border-radius: 100px; padding: 4px; }
  .guest-btn, .pay-btn {
    flex: 1; padding: 10px 4px; border-radius: 100px; border: none; background: transparent;
    color: var(--text-secondary); text-align: center; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: background 0.15s ease, color 0.15s ease;
  }
  .guest-btn { font-family: var(--display); font-size: 18px; }
  .guest-btn:active, .pay-btn:active { opacity: 0.7; }
  .guest-btn.active { background: var(--text); color: white; }
  .pay-btn.pay-da-saldare.active { background: var(--red); color: white; }
  .pay-btn.pay-acconto-versato.active { background: var(--amber); color: white; }
  .pay-btn.pay-saldata.active { background: var(--green); color: white; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
    padding: 4px 9px; border-radius: 100px; display: inline-flex; align-items: center; gap: 3px;
  }
  .chip-code { font-family: ui-monospace, SFMono-Regular, monospace; text-transform: none; letter-spacing: 0.02em; background: rgba(11,12,14,0.06); color: var(--text-secondary); }
  .chip-guests { background: rgba(11,12,14,0.06); color: var(--text); }
  .chip-pay-da-saldare { background: rgba(240,40,60,0.1); color: var(--red); }
  .chip-pay-acconto-versato { background: rgba(229,168,0,0.14); color: #a87b00; }
  .chip-pay-saldata { background: rgba(0,184,107,0.12); color: #00915a; }

  .hero-card, .hero-half { background: var(--card); border-radius: var(--radius-lg); padding: 18px; cursor: pointer; }
  .hero-row { display: flex; gap: 10px; margin-bottom: 10px; }

  .icon.red { background: rgba(240,40,60,0.1); }
  .icon.blue { background: rgba(26,115,240,0.1); }
  .icon.orange { background: rgba(255,122,26,0.12); }
  .icon.purple { background: rgba(123,97,255,0.12); }
  .icon.teal { background: rgba(0,163,180,0.12); }
  .icon.green { background: rgba(0,184,107,0.12); }
  .icon.gray { background: rgba(11,12,14,0.06); }
  .icon.amber { background: rgba(229,168,0,0.14); }

  .refresh-row { display: flex; justify-content: space-between; align-items: center; margin: 28px 0 8px; padding: 0 2px; }
  .refresh-row .status { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-secondary); }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 50%; background: var(--card); border: none; color: var(--text);
    display: flex; align-items: center; justify-content: center; font-size: 15px; cursor: pointer;
  }

  .list-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .back {
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text);
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    background: var(--card); padding: 9px 14px 9px 12px; border-radius: 100px;
  }
  .list-title { font-family: var(--display); font-size: 30px; font-weight: 700; text-transform: uppercase; line-height: 1; }

  .email-row {
    background: var(--card); border-radius: var(--radius-md);
    padding: 15px 44px 15px 16px; margin-bottom: 8px; cursor: pointer;
    transition: transform 0.15s ease; position: relative; overflow: hidden;
  }
  .email-row:active { transform: scale(0.98); }
  .email-row .from { font-size: 15px; font-weight: 600; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 auto; }
  .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; min-width: 0; }
  .email-date { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--text-secondary); white-space: nowrap; flex-shrink: 0; }
  .email-row .subject { font-size: 14px; color: var(--text); margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .email-row .preview { font-size: 13px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .email-row .ready-badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: #00915a; background: rgba(0,184,107,0.12); padding: 4px 9px; border-radius: 100px; margin-top: 8px;
  }
  .dismiss-btn {
    position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(11,12,14,0.06); color: var(--text-secondary); border: none; font-size: 13px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
  }
  .dismiss-btn:active { background: rgba(11,12,14,0.12); }

  .detail-card { background: var(--card); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 14px; }
  .detail-row { font-size: 14px; margin-bottom: 7px; line-height: 1.4; }
  .detail-row .label { color: var(--text-secondary); margin-right: 6px; }
  .pill-row { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .pill {
    background: rgba(11,12,14,0.06); color: var(--text);
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 5px 10px; border-radius: 100px;
  }
  .pill.tone-urgente, .pill.tone-arrabbiato { background: rgba(240,40,60,0.1); color: var(--red); }

  .section-title { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.14em; margin: 26px 0 10px 2px; }
  .original-text { font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; color: var(--text); }

  .response-tabs { display: flex; gap: 4px; margin-bottom: 12px; background: var(--card); border-radius: 100px; padding: 4px; }
  .response-tab {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 6px; border-radius: 100px; border: none; background: transparent; color: var(--text-secondary);
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    cursor: pointer; white-space: nowrap; transition: background 0.15s ease, color 0.15s ease;
  }
  .response-tab:active { opacity: 0.7; }
  .response-tab.active { background: var(--bg); color: var(--text); box-shadow: 0 1px 3px rgba(11,12,14,0.1); }

  .regenerate-box { margin-top: 10px; padding: 14px; background: var(--card); border-radius: var(--radius-md); }
  .regenerate-box .body-text { min-height: 70px; background: var(--bg); }

  .booking-disclosure { background: var(--card); border-radius: var(--radius-lg); margin: 20px 0 14px; overflow: hidden; }
  .booking-disclosure summary {
    list-style: none; display: flex; align-items: center; gap: 10px;
    padding: 15px 16px; cursor: pointer; font-size: 15px; font-weight: 600; color: var(--text);
  }
  .booking-disclosure summary::-webkit-details-marker { display: none; }
  .booking-disclosure summary .chevron { color: var(--gray); font-size: 14px; margin-left: auto; transition: transform 0.2s ease; }
  .booking-disclosure[open] summary .chevron { transform: rotate(90deg); }
  .booking-disclosure[open] summary { border-bottom: 1px solid var(--border); }
  .booking-disclosure .disclosure-body { padding: 16px; }

  .response-card { background: var(--card); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px; }
  .response-card .opt-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
  .opt-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .opt-dot.green { background: var(--green); }
  .opt-dot.orange { background: var(--amber); }
  .opt-dot.red { background: var(--red); }
  .opt-dot.gray { background: var(--gray); }
  .discrepancy-banner {
    background: rgba(229,168,0,0.12); color: #7a5a00; border-left: 3px solid var(--amber);
    padding: 12px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px; line-height: 1.45;
  }
  .discrepancy-banner b { font-weight: 700; }
  .body-text {
    width: 100%; font-family: inherit; font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; text-align: left;
    background: var(--bg); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 12px;
    border: 1px solid var(--border); resize: vertical; min-height: 110px; color: var(--text);
  }
  .body-text:focus { outline: none; border-color: var(--text); }
  .body-text:disabled { opacity: 0.7; }
  .sent-confirm { background: rgba(0,184,107,0.1); color: #00915a; padding: 12px; border-radius: var(--radius-sm); font-size: 13px; margin-top: 10px; }
  .sent-confirm a { color: #00915a; font-weight: 600; text-decoration: underline; }
  .sent-confirm .pending { color: var(--text-secondary); font-weight: 500; }

  .confirm-overlay {
    position: fixed; inset: 0; background: rgba(11,12,14,0.35);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: flex-end; justify-content: center; z-index: 1000;
    padding: 12px 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
  }
  .confirm-overlay.hidden { display: none; }
  .confirm-box {
    background: var(--bg); border-radius: 28px; padding: 28px 22px 20px;
    max-width: 420px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(11,12,14,0.25);
    animation: sheetUp 0.32s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .confirm-box .icon { font-size: 34px; margin-bottom: 10px; }
  .confirm-box h3 { font-family: var(--display); font-size: 26px; font-weight: 700; text-transform: uppercase; line-height: 1.05; margin-bottom: 8px; }
  .confirm-box p { font-size: 14px; color: var(--text-secondary); margin-bottom: 22px; line-height: 1.45; }
  .review-tab {
    background: rgba(11,12,14,0.06); color: var(--text); font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 7px 12px; border-radius: 100px; display: inline-block; margin-bottom: 14px;
  }
  .btn-row { display: flex; gap: 8px; }
  .btn-row + .btn-row { margin-top: 8px; }
  .btn {
    flex: 1; border: none; border-radius: 100px; padding: 14px 14px; font-family: inherit;
    font-size: 12.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
    transition: opacity 0.15s, transform 0.15s;
  }
  .btn:active { opacity: 0.75; transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; }
  .btn-send { background: var(--text); color: white; }
  .btn-send.sent { background: rgba(0,184,107,0.14); color: #00915a; }
  .btn-reject { background: rgba(240,40,60,0.1); color: var(--red); }
  .btn-secondary { background: var(--card-strong); color: var(--text); }

  .empty, .loading, .login-box { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
  .loading { font-size: 13px; }

function EUR(n) {
  const v = Number(n) || 0;
  const d = Math.round(v * 100) % 100 === 0 ? 0 : 2;

// Salva solo percorso, esito e durata (mai contenuti, chiavi o indirizzi).
// Gli errori finiscono nel Laboratorio di test, che li mette nel report.
const REQ_RING = [];
function safePath(u) {
  try {
    const url = new URL(u, location.origin);
    const a = url.searchParams.get('action');
    return url.pathname + (a ? '?action=' + a : '');
  } catch (e) { return String(u).slice(0, 60); }
}
function bufferError(err) {
  try {
    const b = JSON.parse(localStorage.getItem('acme_err_buffer') || '[]');
    b.push({ at: new Date().toISOString(), view: window.__acme ? window.__acme.view : null, ...err });
    localStorage.setItem('acme_err_buffer', JSON.stringify(b.slice(-50)));
  } catch (e) {}
}
const _nativeFetch = window.fetch.bind(window);
window.fetch = async function (input, init) {
  const url = typeof input === 'string' ? input : ((input && input.url) || '');
  const path = safePath(url);
  const method = (init && init.method) || 'GET';
  const t0 = Date.now();
  try {
    const res = await _nativeFetch(input, init);
    const ms = Date.now() - t0;
    REQ_RING.push({ at: new Date().toISOString(), method, path, status: res.status, ms });
    if (REQ_RING.length > 20) REQ_RING.shift();
    if (path.startsWith('/api/') && (res.status >= 500 || ms > 8000)) {
      bufferError({ kind: res.status >= 500 ? 'http' : 'lento', path, status: res.status, ms });
    }
    return res;
  } catch (e) {
    const ms = Date.now() - t0;
    REQ_RING.push({ at: new Date().toISOString(), method, path, status: 0, ms });
    if (REQ_RING.length > 20) REQ_RING.shift();
    if (path.startsWith('/api/')) bufferError({ kind: 'rete', path, message: e.message, ms });
    throw e;
  }

});
window.addEventListener('unhandledrejection', (ev) => {

  // non perfetto, perché le note possono anche essere state scritte in fase
  // di prenotazione per motivi non legati a un problema).
  // Statistiche per mese. Ogni notte (e la sua quota di incasso) va nel mese
  // in cui cade: un soggiorno 28 ottobre → 3 novembre conta 4 notti a ottobre
  // e 2 a novembre. Prima finiva tutto nel mese del check-in.
  computeMonthlyStats() {
    const months = {};
    const ensure = (k) => months[k] || (months[k] = { revenue: 0, nights: 0, totalStays: 0, problemStays: 0, twoRoomStays: 0, daysInMonth: this.daysInMonth(k) });
    this.bookings.forEach(b => {
      if (!b.check_in || !b.check_out || b.status === 'cancellata') return;
      let dates;
      try { dates = PR ? PR.nightDates(b.check_in, b.check_out) : null; } catch (e) { return; }
      if (!dates) return;
      const perNight = (Number(b.total) || 0) / dates.length;
      dates.forEach(d => { const m = ensure(d.slice(0, 7)); m.nights += 1; m.revenue += perNight; });
      const start = ensure(b.check_in.slice(0, 7));
      start.totalStays += 1;
      if (this.bookingRooms(b) === 2) start.twoRoomStays += 1;
      if (b.status === 'conclusa' && b.notes) start.problemStays += 1;
    });
    return months;
  }

  renderStatistics() {
    const months = this.computeMonthlyStats();
    const keys = Object.keys(months).sort().reverse();
    const rows = keys.map(k => {
      const m = months[k];
      const capacity = m.daysInMonth * this.roomsCount;
      const occupancy = capacity > 0 ? Math.min(100, Math.round((m.nights / capacity) * 100)) : 0;
      const [y, mm] = k.split('-');
      const monthLabel = this.capitalize(new Date(Number(y), Number(mm) - 1, 1).toLocaleDateString('it-IT', { month: 'long', year: 'numeric' }));
      return `
        <div class="detail-card stat-card" onclick="app.openStatsMonth('${k}')">
          <div class="row-top"><div class="section-title" style="margin:0;">${monthLabel}</div><span class="m-chev">${ICON('chev')}</span></div>
          <div class="stat-big">${EUR(m.revenue)}</div>
          <div class="stat-cap">Incasso</div>
          <div class="occ"><div class="occ-fill" style="width:${occupancy}%"></div></div>
          <div class="stat-grid">
            <div><b>${occupancy}%</b><span>Occupazione</span></div>
            <div><b>${m.nights}<small>/${capacity}</small></b><span>Notti</span></div>
            <div><b>${m.nights ? EUR(m.revenue / m.nights).replace('€ ', '') : '—'}</b><span>€ a notte</span></div>
            <div><b>${m.totalStays}</b><span>Soggiorni</span></div>
          </div>
          ${m.twoRoomStays ? `<div class="field-hint" style="margin:12px 0 0;">${m.twoRoomStays} ${m.twoRoomStays === 1 ? 'soggiorno' : 'soggiorni'} con entrambe le camere</div>` : ''}
        </div>`;
    }).join('');

    return `
      <div class="list-header">
        <div class="back" onclick="app.goBack()">‹ ACME</div>
      </div>
      <div class="topbar"><div class="eyebrow">Domus 106</div><h1>Statistiche</h1></div>
      <div style="font-size:12px; color:var(--text-secondary); margin:-8px 0 16px 4px; line-height:1.4;">Prenotazioni salvate in ACME. Occupazione sull'appartamento intero; le notti a cavallo di due mesi sono divise tra i mesi, con la loro quota di incasso. "€ a notte" = incasso medio per notte occupata.</div>
      ${this.bookingsLoading ? `<div class="loading"><div class="spinner"></div>Calcolo le statistiche…</div>`
        : (rows || `<div class="empty">Nessuna prenotazione ancora registrata</div>`)}`;
  }

  renderStatisticsMonth() {
    const key = this.selectedStatsMonth;
    const [y, mm] = key.split('-');
    const monthLabel = this.capitalize(new Date(Number(y), Number(mm) - 1, 1).toLocaleDateString('it-IT', { month: 'long', year: 'numeric' }));
    const clients = this.bookings
      .filter(b => (b.check_in || '').slice(0, 7) === key)
      .sort((a, b) => (a.check_in || '').localeCompare(b.check_in || ''));

    const rows = clients.map(b => {
      const checkInFmt = this.formatQuoteDate(b.check_in);
      const checkOutFmt = this.formatQuoteDate(b.check_out);
      const safeBooking = JSON.stringify(b).replace(/'/g, "&#39;");
      const status = b.status || 'confermata';
      const statusClass = 'status-' + status.replace(/\s+/g, '-');
      const payment = b.payment_status || 'da saldare';
      const paymentClass = 'chip-pay-' + payment.replace(/\s+/g, '-');
      const paymentLabel = payment === 'da saldare' ? 'Da saldare' : (payment === 'acconto versato' ? 'Acconto' : 'Saldata');
      return `

          ${b.rate_per_night ? `<div class="rate-info">${EUR(b.rate_per_night)}/notte${b.discount_percent ? ' · sconto ' + b.discount_percent + '%' : ''}</div>` : ''}

      <div class="list-header">
        <div class="back" onclick="app.goBack()">‹ Statistiche</div>

  isTestAddr(a) { return (a || '').includes('acmetest'); }

  testReplyTarget() { return localStorage.getItem('acme_test_reply') || null; }

  // Il registro delle prove vive su Supabase: resta per giorni e da qualunque telefono
  async loadTestSession() {
    try {
      const res = await fetch('/api/test-lab?action=log-get');
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || data.error || 'Registro non leggibile');
      this.testSession = data.session;
      this.testHistoryCount = data.historyCount || 0;
      // Migrazione una tantum dei vecchi segni salvati solo sul telefono
      const old = JSON.parse(localStorage.getItem('acme_test_checks') || 'null');
      if (old) {
        Object.entries(old).forEach(([id, st]) => {
          if (st && !this.testSession.results[id]) this.testSession.results[id] = { state: st, note: '', at: new Date().toISOString() };
        });
        localStorage.removeItem('acme_test_checks');
      }
      await this.flushErrorBuffer();
    } catch (e) {
      this.testLab.error = e.message;
    }
  }

  async saveTestSession() {
    if (!this.testSession) return;
    try {
      await fetch('/api/test-lab?action=log-save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session: this.testSession })
      });
    } catch (e) {}
  }

  describeAppError(err) {
    if (err.kind === 'http') return `Errore del server ${err.status} su ${err.path}`;
    if (err.kind === 'lento') return `Risposta molto lenta (${Math.round((err.ms || 0) / 1000)} s) su ${err.path}`;
    if (err.kind === 'rete') return `Richiesta fallita su ${err.path}: ${err.message || 'rete'}`;
    if (err.kind === 'js') return `Errore JavaScript: ${err.message}`;
    return `Errore non gestito: ${err.message}`;
  }

  // Gli errori raccolti dalla scatola nera durante l'uso normale entrano nel registro
  async flushErrorBuffer() {
    if (!this.testSession) return;
    let buf = [];
    try { buf = JSON.parse(localStorage.getItem('acme_err_buffer') || '[]'); } catch (e) {}
    if (!buf.length) return;
    const list = this.testSession.findings;
    buf.forEach(err => {
      const what = err.path || (err.message || '').slice(0, 60);
      const key = `app:${err.kind}:${what}`;
      const ex = list.find(f => f.key === key);
      if (ex) {
        ex.count = (ex.count || 1) + 1;
        ex.lastAt = err.at;
      } else {
        list.push({
          key, source: 'app', severity: err.kind === 'lento' ? 'avviso' : 'errore',
          title: this.describeAppError(err),
          detail: `Schermata: ${err.view || '?'}${err.ms ? ' · durata ' + err.ms + ' ms' : ''}${err.where ? ' · ' + err.where : ''}`,
          count: 1, firstAt: err.at, lastAt: err.at, context: { view: err.view || null }
        });
      }
    });
    localStorage.removeItem('acme_err_buffer');
    await this.saveTestSession();
  }

  async testLabAction(action, body, busyLabel, doneMsg) {
    const t = this.testLab;
    t.busy = busyLabel;
    t.message = null;
    t.error = null;
    this.render();
    try {
      const res = await fetch('/api/test-lab?action=' + action, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {})
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || data.error || 'Operazione fallita');
      const s = this.testSession;
      if (s) {
        if (action === 'seed-emails') (data.scenarioIds || []).forEach(id => { s.seeded[id] = new Date().toISOString(); });
        if (action === 'seed-bookings') s.bookingsSeeded = true;
        if (action === 'cleanup') {
          // reset totale: prove, segnalazioni, collaudo. Restano solo i report già salvati nello storico.
          this.testSession = this.freshTestSession();
          this.campaign = null;
          localStorage.removeItem('acme_campaign');
        }
        await this.saveTestSession();
      }
      let inbox = null;
      if (action === 'seed-emails' || action === 'cleanup') inbox = await this.refreshInboxQuiet();
      t.message = doneMsg(data, inbox);
      this.bookings = [];
      await this.loadReminders();
    } catch (e) {
      t.error = e.message;
    }
    t.busy = null;
    await this.loadTestLab();
  }

  // Aggiorna la dashboard senza cambiare schermata (analizza con Claude le mail nuove)
  // e riporta com'è andata, invece di ignorare i problemi in silenzio.
  async refreshInboxQuiet() {
    const out = { ok: false, error: null, seen: 0 };
    try {
      const res = await fetch('/api/emails-analyzed', {
        headers: { 'x-claude-key': localStorage.getItem('claude_api_key') }
      });
      if (!res.ok) {
        const j = await res.json().catch(() => ({}));
        out.error = (res.status === 504 || res.status === 502)
          ? 'Vercel ha interrotto l\'analisi perché ci metteva troppo (limite di 10 secondi). Aspetta 5 minuti (le analizza il controllo automatico) e premi ↻ in dashboard, oppure inserisci meno email alla volta.'
          : (j.error || ('errore ' + res.status));
        return out;
      }
      const data = await res.json();
      this.byCategory = data.byCategory || {};
      this.lastUpdated = new Date();
      out.ok = true;
      out.seen = Object.values(this.byCategory).flat().filter(e => this.isTestAddr(e.from)).length;
    } catch (e) {
      out.error = e.message;
    }
    return out;
  }

  seedMessage(r, ib) {
    let msg = `${r.inserted} email inserite in Gmail (${r.inTop8} tra le 8 più recenti, quelle che la dashboard legge). `;
    msg += ib.ok ? `Dashboard aggiornata: ne mostra ${ib.seen}.` : `Attenzione: la dashboard non si è aggiornata: ${ib.error}`;
    if (r.inTop8NoMe < r.inTop8) msg += ' Attenzione: per il controllo automatico Gmail le considera «da te»: le push urgenti non partiranno per queste mail di prova.';
    return msg;
  }

  // Esito effettivo di una prova: ❌ se l'hai segnata tu OPPURE se un controllo automatico l'ha bocciata
  testEffective(id) {
    const s = this.testSession;
    if (!s) return '';
    const manual = (s.results[id] || {}).state || '';
    const autoFail = (s.autoResults || []).some(a => a.scenarioId === id && !a.ok && a.severity === 'errore');
    if (manual === 'ko' || autoFail) return 'ko';
    return manual === 'ok' ? 'ok' : '';
  }

  cycleTestCheck(id) {
    const s = this.testSession;
    if (!s) return;
    const cur = s.results[id] || { state: '', note: '' };
    const next = { '': 'ok', 'ok': 'ko', 'ko': '' }[cur.state || ''];
    let note = next === '' ? '' : (cur.note || '');
    if (next === 'ko') {
      const typed = window.prompt('Cosa non ha funzionato? (facoltativo, ma aiuta a correggerlo)', note);
      if (typed !== null) note = typed.trim();
    }
    s.results[id] = { state: next, note, at: new Date().toISOString() };
    this.saveTestSession();
    this.render();
  }

  editTestNote(id) {
    const s = this.testSession;
    if (!s || !s.results[id]) return;
    const typed = window.prompt('Nota su questa prova:', s.results[id].note || '');
    if (typed === null) return;
    s.results[id].note = typed.trim();
    this.saveTestSession();
    this.render();
  }

  // Segnalazione libera di un problema, da qualunque punto dell'app (Impostazioni → Segnala un problema)
  async reportProblem() {
    if (!this.testSession) await this.loadTestSession();
    const s = this.testSession;
    if (!s) return;
    const text = window.prompt('Descrivi il problema: cosa stavi facendo e cosa è andato storto?', '');
    if (!text || !text.trim()) return;
    const now = new Date().toISOString();
    s.findings.push({
      key: 'man:' + Date.now(), source: 'manuale', severity: 'errore',
      title: text.trim().slice(0, 90), detail: text.trim(), count: 1, firstAt: now, lastAt: now,
      context: { view: this.view, trail: this.viewTrail.slice(-6), requests: REQ_RING.slice(-8) }
    });
    await this.saveTestSession();
    this.testLab.message = 'Problema registrato: finirà nel report della sessione.';
    this.render();
  }

  removeFinding(encKey) {
    const key = decodeURIComponent(encKey);
    this.testSession.findings = this.testSession.findings.filter(f => f.key !== key);
    this.saveTestSession();
    this.render();
  }

  // ---------- controlli automatici ----------
  async runAutoChecks() {
    const t = this.testLab, s = this.testSession, d = t.data;
    if (!s || !d) return;
    t.busy = 'Controlli in corso…';
    t.message = null;
    t.error = null;
    this.render();

    const results = [];
    const check = (key, group, title, ok, detail, severity, scenarioId) =>
      results.push({ key, group, title, ok: !!ok, detail: detail || '', severity: severity || 'errore', scenarioId: scenarioId || null });
    const J = { 'Content-Type': 'application/json' };
    const call = async (url, opts) => {
      const r = await fetch(url, opts);
      const j = await r.json().catch(() => ({}));
      return { r, j };
    };
    const iso = (n) => new Date(Date.now() + n * 86400000).toISOString().slice(0, 10);
    const todayIso = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Rome' }).format(new Date());
    const testMail = (d.ownEmail || 'autotest@example.com').replace('@', '+acmetest.autotest@');
    let rm = null, nr = null;

    try {
      // 1) Sistema (server): variabili, tabelle e colonne, token, dispositivi push
      try {
        const { r, j } = await call('/api/test-lab?action=diag');
        if (!r.ok) throw new Error(j.message || j.error || 'HTTP ' + r.status);
        (j.checks || []).forEach(c => check(c.key, c.group, c.title, c.ok, c.detail, c.severity));
      } catch (e) { check('diag', 'Sistema', 'Diagnostica del server', false, e.message); }

      // 2) Questo telefono
      check('dev:claude', 'Sistema', 'Chiave Claude salvata su questo telefono', !!localStorage.getItem('claude_api_key'), 'Reinseriscila da Impostazioni → Cambia chiave API');
      check('dev:push', 'Sistema', 'Notifiche push attive su questo iPhone', this.pushEnabled, 'Attivale da Impostazioni', 'avviso');
      check('dev:pwa', 'Sistema', 'App aperta dalla schermata Home', this.isStandalone(), 'Aperta da Safari: Calendario e push possono comportarsi in modo diverso', 'avviso');

      // 3) Logica di calcolo (senza rete)
      const T = (key, title, got, want) => check(key, 'Logica', title, JSON.stringify(got) === JSON.stringify(want), `ottenuto ${JSON.stringify(got)}, atteso ${JSON.stringify(want)}`);
      const ago = (h) => new Date(Date.now() - h * 3600000).toISOString();
      T('lg:h25', 'Check-out 11:00 → check-in 12:00 del giorno dopo = 25 ore', this.hoursUntilNextCheckin('2026-10-01', '2026-10-02'), 25);
      T('lg:f25', 'Formato countdown: 25 ore', this.formatHoursCountdown(25), 'mancano 25 ore');
      T('lg:f1', 'Formato countdown: 1 ora', this.formatHoursCountdown(1), 'mancano 1 ora');
      T('lg:f50', 'Formato countdown: 50 ore', this.formatHoursCountdown(50), 'mancano 2 giorni e 2 ore');
      T('lg:f48', 'Formato countdown: 48 ore', this.formatHoursCountdown(48), 'mancano 2 giorni');
      T('lg:lock72', 'Blocco a 48 ore: chiusa da 72 ore → bloccata', this.isBookingLocked({ concluded_at: ago(72) }), true);
      T('lg:lock2', 'Blocco a 48 ore: chiusa da 2 ore → ripristinabile', this.isBookingLocked({ concluded_at: ago(2) }), false);
      T('lg:lockNone', 'Senza data di chiusura non si blocca', this.isBookingLocked({}), false);
      T('lg:nights', 'Notti tra 1 e 6 ottobre', this.computeNightsPreview('2026-10-01', '2026-10-06'), 5);
      let threw = false;
      try { this.computeNightsPreview('2026-10-06', '2026-10-01'); } catch (e) { threw = true; }
      T('lg:nightsBad', 'Date invertite: segnala errore', threw, true);
      T('lg:rateHigh', 'Tariffa suggerita in alta stagione (luglio)', this.suggestRatePreview('2026-07-10'), 150);
      T('lg:rateLow', 'Tariffa suggerita in bassa stagione (novembre)', this.suggestRatePreview('2026-11-10'), 80);
      if (PR) {
        T('lg:mixed', 'Listino: 28 mag → 5 giu = 4 notti bassa + 4 alta, 15% sulle notti', PR.computeQuote({ checkIn: '2026-05-28', checkOut: '2026-06-05', guests: 2 }).total, 782);
        T('lg:room2', 'Listino: 4 ospiti, 7 notti luglio = 1.096 € (seconda camera inclusa)', PR.computeQuote({ checkIn: '2026-07-12', checkOut: '2026-07-19', guests: 4 }).total, 1096);
      }
      T('lg:plus', 'Indirizzo con «+» letto per intero', this.extractEmailAddress('Marco <mario+acmetest.marco@gmail.com>'), 'mario+acmetest.marco@gmail.com');
      T('lg:name', 'Nome ospite tra virgolette', this.extractGuestName('"Marco Bianchi" <m@x.it>'), 'Marco Bianchi');

      // 4) Flussi dati: scrive, rilegge e cancella una prenotazione e un preventivo di prova
      let created = null;
      try {
        const c = await call('/api/booking', { method: 'POST', headers: J, body: JSON.stringify({ guestName: 'TEST · autotest', guestEmail: testMail, checkIn: iso(200), checkOut: iso(203), total: 300, notes: 'autotest', guests: 3, paymentStatus: 'acconto versato', ratePerNight: 100, discountPercent: 0 }) });
        created = c.r.ok ? c.j.booking : null;
        check('rt:create', 'Flussi dati', 'Salvataggio di una prenotazione con codice', c.r.ok && created && /^D106-\d{4}-[A-Z2-9]{4}$/.test(created.code || ''), c.r.ok ? `codice ${created && created.code}` : (c.j.error || 'HTTP ' + c.r.status));
        if (created) {
          const p = await call('/api/booking', { method: 'PATCH', headers: J, body: JSON.stringify({ id: created.id, notes: 'autotest2', status: 'conclusa', paymentStatus: 'saldata', checkoutReviewed: true, concludedAt: new Date().toISOString(), cleanerNotified: true, cleanerConfirmed: false }) });
          const pb = p.j.booking || {};
          check('rt:patch', 'Flussi dati', 'Modifica di stato, pagamento e pulizie (tutte le colonne)', p.r.ok && pb.status === 'conclusa' && pb.payment_status === 'saldata' && pb.cleaner_notified === true && !!pb.concluded_at, p.r.ok ? 'un campo non ha salvato il valore' : (p.j.error || 'HTTP ' + p.r.status));
          const g = await call('/api/booking?code=' + encodeURIComponent(created.code));
          const gb = (g.j.bookings || [])[0] || {};
          check('rt:get', 'Flussi dati', 'Lettura per codice, con ospiti e tariffa', g.r.ok && gb.guests === 3 && Number(gb.rate_per_night) === 100, `ospiti=${gb.guests}, tariffa=${gb.rate_per_night}`);
          const ir = await fetch('/api/booking?' + new URLSearchParams({ ics: '1', guestName: 'TEST · autotest', checkIn: iso(200), checkOut: iso(203), paymentStatus: 'da saldare', code: created.code }));
          const it = await ir.text();
          check('rt:ics', 'Flussi dati', 'Evento Calendario (.ics) con stato di pagamento', ir.ok && (ir.headers.get('content-type') || '').includes('text/calendar') && it.includes('BEGIN:VEVENT') && it.includes('DA SALDARE'), ir.ok ? 'contenuto inatteso' : 'HTTP ' + ir.status);
        }
      } catch (e) {
        check('rt:create', 'Flussi dati', 'Salvataggio di una prenotazione con codice', false, e.message);
      } finally {
        if (created) await fetch('/api/booking', { method: 'DELETE', headers: J, body: JSON.stringify({ id: created.id }) }).catch(() => {});
      }

      try {
        const sv = await call('/api/booking', { method: 'POST', headers: J, body: JSON.stringify({ savePendingQuote: true, guestEmail: testMail, guestName: 'TEST · autotest', checkIn: iso(200), checkOut: iso(203), ratePerNight: 100, discountPercent: 5, guests: 2, total: 285 }) });
        const rd = await call('/api/booking?pendingQuoteEmail=' + encodeURIComponent(testMail));
        const pq = rd.j.pendingQuote;
        check('rt:pq', 'Flussi dati', 'Preventivo in sospeso: salva e rilegge (indirizzo con «+»)', sv.r.ok && pq && Number(pq.rate_per_night) === 100 && Number(pq.discount_percent) === 5, sv.r.ok ? 'riletto: ' + JSON.stringify(pq) : (sv.j.error || 'HTTP ' + sv.r.status));
        await fetch('/api/booking', { method: 'DELETE', headers: J, body: JSON.stringify({ deletePendingQuoteEmail: testMail }) });
        const rd2 = await call('/api/booking?pendingQuoteEmail=' + encodeURIComponent(testMail));
        check('rt:pqdel', 'Flussi dati', 'Preventivo in sospeso: si cancella alla conferma', rd2.r.ok && rd2.j.pendingQuote === null, JSON.stringify(rd2.j.pendingQuote));
      } catch (e) {
        check('rt:pq', 'Flussi dati', 'Preventivo in sospeso', false, e.message);
      }

      rm = await call('/api/booking?reminders=1');
      check('api:reminders', 'Flussi dati', 'Promemoria operativi (pulizie e pagamenti)', rm.r.ok && Array.isArray(rm.j.cleanerPending) && Array.isArray(rm.j.paymentPending), rm.j.error || 'HTTP ' + rm.r.status);
      const nx = await call('/api/booking?nextCheckinAfter=' + todayIso);
      check('api:next', 'Flussi dati', 'Ricerca della prossima prenotazione', nx.r.ok && 'nextBooking' in nx.j, nx.j.error || 'HTTP ' + nx.r.status);
      nr = await call('/api/booking?needsReview=true');
      check('api:review', 'Flussi dati', 'Prenotazioni da rivedere al check-out', nr.r.ok && Array.isArray(nr.j.bookings), nr.j.error || 'HTTP ' + nr.r.status);
      const ce = await call('/api/auth?action=get-cleaner-email');
      check('api:cleaner', 'Flussi dati', 'Lettura email della persona delle pulizie', ce.r.ok, ce.j.error || 'HTTP ' + ce.r.status);

      // 5) Posta: raggiungibilità e tempo di analisi (il limite di Vercel è 10 secondi)
      if (localStorage.getItem('claude_api_key')) {
        const t0 = Date.now();
        const ib = await this.refreshInboxQuiet();
        const ms = Date.now() - t0;
        check('api:inbox', 'Posta', 'Lettura e analisi della posta', ib.ok, ib.ok ? `${ms} ms` : ib.error);
        if (ib.ok) check('api:inboxms', 'Posta', 'Analisi sotto gli 8 secondi (il limite di Vercel è 10)', ms < 8000, `${ms} ms`, 'avviso');
      }

      // 6) Email di prova inserite: categoria, tono, corpo leggibile, contenuto delle risposte
      const allMails = Object.values(this.byCategory || {}).flat();
      const norm = (r) => (r && typeof r === 'object') ? (r.text || '') : (r || '');
      for (const sc of d.scenarios) {
        if (!s.seeded[sc.id]) continue;
        const e = allMails.find(x => ((x.from || '').includes(sc.tag + '@' + (d.testDomain || 'acmetest.example.com')) || (x.from || '').includes('+acmetest.' + sc.tag + '@')) && (x.subject || '').startsWith(sc.subjectPrefix || ''));
        if (!e) {
          check('cls:' + sc.id, 'Email', sc.title, false, 'Inserita ma non compare tra le mail analizzate (limite delle 8 mail più recenti, timeout o errore di analisi)', 'errore', sc.id);
          continue;
        }
        const ex = sc.expect || {};
        const problems = [];
        if (e.analysisError) problems.push('analisi Claude fallita');
        if (ex.categories && !ex.categories.includes(e.category)) problems.push(`categoria «${e.category}», attesa ${ex.categories.map(c => '«' + c + '»').join(' o ')}`);
        if (ex.tones && !ex.tones.includes(e.tone)) problems.push(`tono «${e.tone}», atteso ${ex.tones.map(c => '«' + c + '»').join(' o ')}`);
        if (ex.discrepancy && !e.discrepancy) problems.push('nessuna incongruenza segnalata');
        if (ex.bodyNotEmpty && (!e.body || e.body === '(No body)')) problems.push('corpo della mail illeggibile «(No body)»');
        check('cls:' + sc.id, 'Email', sc.title, problems.length === 0, problems.length ? problems.join(' · ') : `${e.category} · ${e.tone}`, 'errore', sc.id);
        const texts = (e.responses || []).map(norm).filter(Boolean);
        (sc.responseChecks || []).forEach((rc, i) => {
          if (!texts.length) return;
          let bad, why = '';
          if (rc.mustMatchAny) {
            const re = new RegExp(rc.mustMatchAny, rc.flags || '');
            bad = !texts.some(x => re.test(x));
            if (bad) why = `nessuna delle ${texts.length} risposte lo contiene`;
          } else {
            const re = new RegExp(rc.mustNotMatch, rc.flags || '');
            const hit = texts.map(x => x.match(re)).find(Boolean);
            bad = !!hit;
            if (bad) why = `trovato nella risposta: «…${hit.input.slice(Math.max(0, hit.index - 30), hit.index + hit[0].length + 30).replace(/\s+/g, ' ')}…»`;
          }
          check(`resp:${sc.id}:${i}`, 'Risposte', `${sc.title}: ${rc.label}`, !bad, why, rc.severity, sc.id);
        });
      }

      // 7) Prenotazioni di prova
      if (s.bookingsSeeded) {
        const all = await call('/api/booking');
        const rows = all.j.bookings || [];
        const named = (n) => rows.find(b => b.guest_name === 'TEST · ' + n);
        const H48 = 48 * 3600000;

        const oggiRow = named('Check-out oggi');
        const oggi = ((nr && nr.j.bookings) || []).find(b => b.guest_name === 'TEST · Check-out oggi');
        check('bk:oggi', 'Prenotazioni', 'Check-out di oggi → compare tra quelle da rivedere', !!oggi || (oggiRow && oggiRow.status === 'conclusa'), 'Non compare: il pop-up «Com\'è andato il soggiorno?» non partirebbe', 'errore', 'b-oggi');

        const domRow = named('Arrivo domani');
        const dom = ((rm && rm.j.paymentPending) || []).find(b => b.guest_name === 'TEST · Arrivo domani');
        check('bk:domani', 'Prenotazioni', 'Arrivo imminente da saldare → tra i pagamenti da sollecitare', !!dom || (domRow && domRow.payment_status !== 'da saldare'), 'Non compare nei promemoria pagamenti', 'errore', 'b-domani');

        const nove = named('Arrivo tra 9 giorni');
        check('bk:nove', 'Prenotazioni', 'Acconto, 4 ospiti e tariffa salvati correttamente', nove && nove.payment_status === 'acconto versato' && nove.guests === 4 && Number(nove.rate_per_night) === 90, nove ? `pagamento=${nove.payment_status}, ospiti=${nove.guests}, tariffa=${nove.rate_per_night}` : 'prenotazione non trovata', 'errore', 'b-nove');

        const due = named('Chiusa da 2 ore');
        const dueAge = due && due.concluded_at ? Date.now() - new Date(due.concluded_at).getTime() : 0;
        check('bk:duore', 'Prenotazioni', 'Chiusa da poco → ancora ripristinabile', due && (dueAge > H48 || !this.isBookingLocked(due)), due ? `chiusa il ${due.concluded_at}` : 'prenotazione non trovata', 'errore', 'b-duore');

        const tre = named('Chiusa da 3 giorni');
        const treRem = ((rm && rm.j.cleanerPending) || []).find(b => b.guest_name === 'TEST · Chiusa da 3 giorni');
        check('bk:tre', 'Prenotazioni', 'Chiusa da 3 giorni → bloccata, con promemoria pulizie e prossimo arrivo', tre && this.isBookingLocked(tre) && (!!treRem ? !!treRem.next_check_in : tre.cleaner_confirmed === true), tre ? `bloccata=${this.isBookingLocked(tre)}, promemoria=${!!treRem}, prossimo arrivo=${treRem ? treRem.next_check_in : '—'}` : 'prenotazione non trovata', 'errore', 'b-tregiorni');

        const el = named('Elena Greco');
        let hist = [];
        if (el) { const h = await call('/api/booking?guestEmail=' + encodeURIComponent(el.guest_email)); hist = h.j.bookings || []; }
        check('bk:elena', 'Prenotazioni', 'Storico ospite: la nota del soggiorno passato riemerge', hist.some(b => (b.notes || '').includes('Rumorosi')), 'Lo storico non restituisce la nota', 'errore', 'b-elena');

        const prev = this.bookings;
        this.bookings = rows;
        const ms = this.computeMonthlyStats();
        this.bookings = prev;
        const months = Object.values(ms);
        check('bk:stat', 'Prenotazioni', 'Statistiche: incasso e soggiorni con note', months.some(m => m.revenue > 0) && months.some(m => m.problemStays >= 1), `mesi calcolati: ${months.length}`, 'errore', 'b-stat');
      }
    } catch (e) {
      check('autotest', 'Sistema', 'Esecuzione dei controlli', false, e.message);
    }

    // I controlli falliti diventano segnalazioni; quelli superati fanno sparire la segnalazione precedente
    const at = new Date().toISOString();
    s.autoResults = results;
    s.autoRunAt = at;
    s.findings = s.findings.filter(f => f.source !== 'auto').concat(
      results.filter(r => !r.ok).map(r => ({
        key: 'auto:' + r.key, source: 'auto', severity: r.severity, title: r.title, detail: r.detail,
        scenarioId: r.scenarioId, group: r.group, count: 1, firstAt: at, lastAt: at
      }))
    );
    await this.saveTestSession();
    const fails = results.filter(r => !r.ok);
    t.message = `Controlli completati: ${results.length - fails.length}/${results.length} superati` + (fails.length ? `, ${fails.length} da guardare.` : '.');
    t.busy = null;
    this.render();
  }

  // ---------- problemi e report ----------
  collectIssues() {
    const s = this.testSession, d = this.testLab.data;
    const byId = {};
    (d ? [...d.scenarios, ...d.bookingScenarios] : []).forEach(x => { byId[x.id] = x; });
    const issues = [];
    const manualByScenario = {};
    Object.entries(s.results).forEach(([id, r]) => {
      if (r.state !== 'ko') return;
      const it = { sev: 'errore', origin: 'segnalato a mano', title: byId[id] ? byId[id].title : id, scenario: byId[id] || null, note: r.note || '', details: [] };
      issues.push(it);
      manualByScenario[id] = it;
    });
    s.findings.forEach(f => {
      if (f.source === 'auto' && f.scenarioId && manualByScenario[f.scenarioId]) {
        const it = manualByScenario[f.scenarioId];
        it.details.push(`${f.title}: ${f.detail}`);
        it.origin = 'segnalato a mano + rilevato dal controllo automatico';
        return;
      }
      issues.push({
        sev: f.severity,
        origin: f.source === 'auto' ? 'rilevato dal controllo automatico' : (f.source === 'app' ? 'errore rilevato durante l\'uso' : 'segnalato a mano'),
        title: f.title, detail: f.detail, scenario: f.scenarioId ? (byId[f.scenarioId] || null) : null,
        count: f.count, lastAt: f.lastAt, context: f.context, key: f.key, removable: f.source !== 'auto', details: []
      });
    });
    // problemi trovati dal collaudo automatico di 7 giorni
    if (this.campaign && this.campaign.issues) {
      this.campaign.issues.forEach(i => {
        const sid = (i.key || '').split(':')[1];
        issues.push({
          sev: i.severity, origin: `collaudo automatico, ${i.count} ${i.count === 1 ? 'volta' : 'volte'}`,
          title: i.title, detail: (i.examples || []).join(' · '), scenario: byId[sid] || null,
          count: i.count, lastAt: i.lastAt, removable: false, details: []
        });
      });
    }
    issues.sort((a, b) => (a.sev === 'errore' ? 0 : 1) - (b.sev === 'errore' ? 0 : 1));
    return issues;
  }

  testSummary() {
    const d = this.testLab.data;
    const all = [...d.scenarios, ...d.bookingScenarios];
    let ok = 0, ko = 0, todo = 0;
    all.forEach(x => { const e = this.testEffective(x.id); if (e === 'ok') ok++; else if (e === 'ko') ko++; else todo++; });
    const issues = this.collectIssues();
    return { ok, ko, todo, errors: issues.filter(i => i.sev === 'errore').length, warnings: issues.filter(i => i.sev !== 'errore').length };
  }

  buildTestReport() {
    const s = this.testSession, d = this.testLab.data;
    const fmt = (iso) => iso ? new Date(iso).toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' }) : '—';
    const sum = this.testSummary();
    const issues = this.collectIssues();
    const all = [...d.scenarios, ...d.bookingScenarios];
    const days = Math.max(0, Math.round((Date.now() - new Date(s.startedAt).getTime()) / 86400000));
    const L = [];
    L.push('# Report Laboratorio di test — ACME Inbox Manager (Domus 106)');
    L.push('');
    L.push(`Generato: ${fmt(new Date().toISOString())} · Sessione iniziata: ${fmt(s.startedAt)} (${days} giorni fa)`);
    L.push(`Dispositivo: ${(navigator.userAgent || '').slice(0, 110)}`);
    L.push(`App aperta dalla Home: ${this.isStandalone() ? 'sì' : 'no'} · Push attive: ${this.pushEnabled ? 'sì' : 'no'}`);
    L.push('');
    L.push('> Nota per Claude: questo report è generato dal Laboratorio di test dell\'app. Per ogni problema trovi cosa era atteso, cosa è stato rilevato e il contesto. File del progetto: index.html, api/ (booking, auth, test-lab, check-urgent, quote, emails-analyzed, analyze-single, send-email, mark-resolved, push-subscription, callback) e lib/ (analyze-email, gmail-token, send-push, pricing, quote-pdf, fonts). Proponi la correzione indicando file e modifica; se ti serve un file che non hai, chiedimelo.');
    L.push('');
    L.push('## Riepilogo');
    L.push(`- Prove: ✅ ${sum.ok} · ❌ ${sum.ko} · ⚪ ${sum.todo} da provare`);
    L.push(`- Problemi aperti: ${sum.errors} errori, ${sum.warnings} avvisi`);
    L.push(`- Controlli automatici: ${s.autoRunAt ? `ultima esecuzione ${fmt(s.autoRunAt)}, ${s.autoResults.filter(r => r.ok).length}/${s.autoResults.length} superati` : 'mai eseguiti'}`);
    L.push('');
    const c = this.campaign;
    if (c) {
      const day = (iso) => iso ? new Date(iso).toLocaleDateString('it-IT', { day: 'numeric', month: 'short' }) : '—';
      const titleOf = Object.fromEntries(d.scenarios.map(x => [x.id, x.title]));
      L.push('## Collaudo automatico di 7 giorni');
      L.push(`- Stato: ${c.active ? (c.paused ? 'in pausa' : 'in corso') : 'terminato'}, giorno ${c.day} di ${c.totalDays} (dal ${day(c.startedAt)} al ${day(c.finishedAt || c.endsAt)})`);
      L.push(`- Email inserite: ${c.injected} · analizzate: ${c.analyzed} · classificate bene: ${c.correct}${c.accuracyPct != null ? ' (' + c.accuracyPct + '%)' : ''} · mai analizzate: ${c.notAnalyzed}`);
      L.push(`- Comparse in dashboard: ${c.seenInDashboard} · non viste (app aperta dopo l'arrivo, mail assente): ${c.missed}`);
      L.push(`- Ritardo medio tra arrivo e analisi: ${c.avgAnalysisMin != null ? c.avgAnalysisMin + ' minuti (misurato a scatti di 5)' : 'n.d.'}`);
      L.push(`- Controllo automatico ogni 5 minuti: ${c.ticks.count} giri, buco massimo ${c.ticks.maxGapMin} minuti`);
      L.push(`- Ultima apertura della dashboard registrata: ${c.lastDashboardLoadAt ? fmt(c.lastDashboardLoadAt) : 'mai'}`);
      if ((c.byDay || []).length) {
        L.push('');
        L.push('| Giorno | Inserite | Giuste | Non analizzate | Non viste | Buco cron max |');
        L.push('|---|---|---|---|---|---|');
        c.byDay.forEach(x => L.push(`| ${day(x.date)} | ${x.injected} | ${x.correct}/${x.analyzed} | ${x.notAnalyzed} | ${x.missed} | ${x.maxGapMin != null ? x.maxGapMin + ' min' : '—'} |`));
      }
      if ((c.perScenario || []).length) {
        L.push('');
        L.push('| Tipo di email | Prove | Giuste |');
        L.push('|---|---|---|');
        c.perScenario.forEach(x => L.push(`| ${titleOf[x.id] || x.id} | ${x.n} | ${x.ok} |`));
      }
      L.push('');
    }
    L.push('## Problemi da correggere');
    if (!issues.length) L.push('Nessun problema aperto.');
    issues.forEach((it, i) => {
      L.push('');
      L.push(`### ${i + 1}. [${it.sev === 'errore' ? 'ERRORE' : 'AVVISO'}] ${it.title}`);
      L.push(`- Origine: ${it.origin}`);
      if (it.detail) L.push(`- Rilevato: ${it.detail}`);
      (it.details || []).forEach(x => L.push(`- Rilevato automaticamente: ${x}`));
      if (it.note) L.push(`- Nota di Filippo: ${it.note}`);
      if (it.scenario) {
        L.push('- Cosa doveva succedere:');
        it.scenario.checks.forEach(c => L.push(`  - ${c}`));
      }
      if (it.count > 1) L.push(`- Ripetuto ${it.count} volte, ultima il ${fmt(it.lastAt)}`);
      if (it.context) {
        if (it.context.view && !(it.detail || '').includes('Schermata:')) L.push(`- Schermata: ${it.context.view}`);
        if (it.context.trail && it.context.trail.length) L.push(`- Schermate visitate poco prima: ${it.context.trail.join(' → ')}`);
        if (it.context.requests && it.context.requests.length) {
          L.push('- Ultime richieste prima della segnalazione:');
          it.context.requests.forEach(q => L.push(`  - ${q.method} ${q.path} → ${q.status || 'errore di rete'} (${q.ms} ms)`));
        }
      }
    });
    L.push('');
    L.push('## Esito di tutte le prove');
    L.push('| Prova | Manuale | Automatico |');
    L.push('|---|---|---|');
    all.forEach(x => {
      const man = (s.results[x.id] || {}).state;
      const autos = (s.autoResults || []).filter(a => a.scenarioId === x.id);
      L.push(`| ${x.title} | ${man === 'ok' ? '✅' : (man === 'ko' ? '❌' : '⚪')} | ${autos.length ? (autos.every(a => a.ok) ? '✅' : '❌') : '—'} |`);
    });
    L.push('');
    L.push('## Controlli automatici (ultima esecuzione)');
    if (!s.autoResults.length) L.push('Non ancora eseguiti.');
    let grp = '';
    s.autoResults.forEach(r => {
      if (r.group !== grp) { grp = r.group; L.push(`**${grp}**`); }
      L.push(`- ${r.ok ? '✅' : (r.severity === 'errore' ? '❌' : '⚠️')} ${r.title}${r.ok || !r.detail ? '' : ' — ' + r.detail}`);
    });
    L.push('');
    L.push('## Ultime richieste dell\'app');
    REQ_RING.slice(-15).forEach(q => L.push(`- ${q.at.slice(11, 19)} ${q.method} ${q.path} → ${q.status || 'errore di rete'} (${q.ms} ms)`));
    L.push('');
    L.push('Fine report.');
    let text = L.join('\n');
    // niente indirizzo personale nel report
    const own = d.ownEmail || '';
    if (own) {
      const [loc, dom] = own.split('@');
      text = text.split(loc + '+acmetest.').join('TUAMAIL+acmetest.').split(own).join('TUAMAIL@' + dom);
    }
    return text;
  }

  async previewTestReport() {
    await this.flushErrorBuffer();
    await this.loadCampaign();
    this.testReport = { text: this.buildTestReport(), closed: false };
    this.render();
  }

  confirmCloseTestSession() {
    this.showConfirmDialog({
      title: 'Chiudere la sessione di test?',
      desc: 'Genero il report e lo salvo nello storico. La sessione riparte da zero (le prove tornano da fare); i dati di test restano finché non li elimini.',
      confirmLabel: 'Chiudi e genera',
      confirmColor: 'var(--accent)',
      icon: 'doc',
      onConfirm: () => this.closeTestSession()
    });
  }

  async closeTestSession() {
    const t = this.testLab;
    t.busy = 'Genero il report…';
    this.render();
    try {
      await this.flushErrorBuffer();
      await this.loadCampaign();
      const text = this.buildTestReport();
      const summary = this.testSummary();
      const res = await fetch('/api/test-lab?action=log-close', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ report: { text, summary } })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || data.error || 'Chiusura non riuscita');
      this.testSession = data.session;
      this.testHistory = null;
      this.testHistoryCount += 1;
      this.testReport = { text, closed: true };
      t.message = summary.errors
        ? `Sessione chiusa: ${summary.errors} problemi nel report. Condividilo o copialo e mandalo a Claude.`
        : 'Sessione chiusa: nessun errore. Report salvato nello storico.';
    } catch (e) {
      t.error = e.message;
    }
    t.busy = null;
    this.render();
  }

  async shareTestReport() {
    const text = this.testReport && this.testReport.text;
    if (!text) return;
    const name = `report-test-ACME-${new Date().toISOString().slice(0, 10)}.txt`;
    const file = new File([text], name, { type: 'text/plain' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Report test ACME' });
        return;
      }
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
    await this.copyTestReport();
  }

  async copyTestReport() {
    const text = this.testReport && this.testReport.text;
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      this.testLab.message = 'Report copiato: incollalo nella chat con Claude.';
      this.testLab.error = null;
    } catch (e) {
      this.testLab.error = 'Copia non riuscita: tieni premuto sul testo qui sotto, seleziona tutto e copia.';
    }
    this.render();
  }

  async loadTestHistory() {
    try {
      const res = await fetch('/api/test-lab?action=history-get');
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Storico non leggibile');
      this.testHistory = data.history || [];
    } catch (e) {
      this.testLab.error = e.message;
    }
    this.render();
  }

  openHistoryReport(i) {
    const h = this.testHistory && this.testHistory[i];
    if (!h) return;
    this.testReport = { text: h.text, closed: true };
    this.render();
    window.scrollTo(0, 0);
  }

          ${d.bookingScenarios.map(x => card(x, false)).join('')}

          ${historyPanel}
        </div>
      </details>`;
  }

  async openCalendarSettings() {
    this.cal = { loading: true, saving: false, booking: '', airbnb: '', feedUrl: '', message: null, errors: [], schemaOk: null };
    this.view = 'calendarSettings';
    this.render();
    try {
      const [r1, r2] = await Promise.all([fetch('/api/booking?calendarSettings=1'), fetch('/api/booking?schemaCheck=1')]);
      const d1 = await r1.json().catch(() => ({})), d2 = await r2.json().catch(() => ({}));
      if (!r1.ok) throw new Error(d1.error || 'Impostazioni non disponibili');
      Object.assign(this.cal, { booking: d1.booking, airbnb: d1.airbnb, feedUrl: d1.feedUrl, schemaOk: r2.ok ? !!d2.upToDate : null });
    } catch (e) { this.error = e.message; }
    this.cal.loading = false;
    if (this.view === 'calendarSettings') this.render();
  }

  async saveCalendarSettings() {
    const c = this.cal;
    c.booking = (document.getElementById('icalBooking') || {}).value || '';
    c.airbnb = (document.getElementById('icalAirbnb') || {}).value || '';
    c.saving = true; c.message = null; c.errors = []; this.error = null;
    this.render();
    try {
      const res = await fetch('/api/booking', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ saveCalendarSettings: true, booking: c.booking, airbnb: c.airbnb })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Salvataggio non riuscito');
      c.errors = data.errors || [];
      c.message = c.errors.length ? null : 'Salvati: i calendari rispondono correttamente.';
    } catch (e) { this.error = e.message; }
    c.saving = false;
    this.render();
  }

    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = 'Copiato';
      setTimeout(() => { btn.textContent = original; }, 1500);
    }).catch(() => {});
  }

  renderCalendarSettings() {

    return `
      <div class="list-header"><div class="back" onclick="app.goBack()">‹ ACME</div></div>
      ${this.error ? `<div class="error-banner">${this.escape(this.error)}</div>` : ''}
      <div class="topbar"><div class="eyebrow">Impostazioni</div><h1>Calendari</h1></div>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACME</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a6ebd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ACME">
<link rel="apple-touch-icon" href="/icon-180.png?v=2">
<style>
  :root {
    --bg: #f6f4f0;
    --card: #ffffff;
    --text: #1c1c1e;
    --text-secondary: #8a8a8e;
    --accent: #0a6ebd;
    --green: #34c759;
    --red: #ff3b30;
    --orange: #ff9500;
    --border: rgba(60,60,67,0.1);
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; min-height: 100vh; }

  .topbar { padding: 8px 4px 24px; }
  .topbar .eyebrow { font-size: 13px; color: var(--text-secondary); font-weight: 500; margin-bottom: 2px; }
  .topbar h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }

  .reminder-badge {
    position: relative; width: 42px; height: 42px; border-radius: 50%;
    background: var(--card); border: 1px solid rgba(60,60,67,0.08);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer; margin-top: 4px; flex-shrink: 0;
  }
  .reminder-badge:active { transform: scale(0.94); }
  .reminder-count {
    position: absolute; top: -4px; right: -4px;
    background: var(--red); color: white; font-size: 11px; font-weight: 700;
    min-width: 18px; height: 18px; border-radius: 9px; padding: 0 4px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--bg);
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    background: var(--card);
    border: 1px solid rgba(60,60,67,0.06);
    border-radius: var(--radius-lg);
    padding: 18px;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s ease;
    cursor: pointer;
  }
  .card:active { transform: scale(0.97); }
  .card .icon {
    width: 40px; height: 40px;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    margin-bottom: 14px;
  }
  .card .name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .card .count { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  .card .count.zero { color: var(--text-secondary); }

  .confirm-booking-box {
    background: rgba(52,199,89,0.08);
    border-radius: var(--radius-lg);
    padding: 18px;
    margin-top: 16px;
    text-align: center;
  }
  .confirm-booking-box .title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .confirm-booking-box .subtitle { font-size: 12px; color: var(--text-secondary); margin-bottom: 14px; }
  .confirm-booking-box .btn { background: var(--green); color: white; width: 100%; }
  .confirm-booking-box .btn.confirmed { background: rgba(52,199,89,0.15); color: var(--green); }
  .confirm-booking-box .code-line { font-size: 13px; color: var(--text-secondary); margin-top: 10px; }
  .confirm-booking-box .code-line b { color: var(--text); font-family: ui-monospace, SFMono-Regular, monospace; letter-spacing: 0.02em; }

  .booking-row {
    background: var(--card);
    border: 1px solid rgba(60,60,67,0.06);
    border-radius: var(--radius-md);
    padding: 14px 44px 14px 16px;
    margin-bottom: 10px;
    position: relative;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .booking-row:active { transform: scale(0.98); }
  .booking-row .name { font-size: 15px; font-weight: 600; margin-bottom: 4px; padding-right: 30px; }
  .booking-row .dates { font-size: 13px; color: var(--text-secondary); }
  .booking-row .dates b { color: var(--text); font-weight: 700; }
  .booking-row .total { font-size: 13px; color: var(--accent); font-weight: 600; margin-top: 4px; }
  .booking-row .rate-info { font-size: 12px; color: var(--text-secondary); }
  .booking-row .code-tag { font-size: 11px; color: var(--text-secondary); font-family: ui-monospace, SFMono-Regular, monospace; margin-top: 6px; letter-spacing: 0.02em; }
  .booking-row .status-tag { display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 100px; margin-top: 6px; }
  .status-confermata { background: rgba(52,199,89,0.12); color: var(--green); }
  .status-in-arrivo { background: rgba(10,110,189,0.12); color: var(--accent); }
  .status-conclusa { background: rgba(142,142,147,0.12); color: var(--text-secondary); }
  .status-cancellata { background: rgba(255,59,48,0.12); color: var(--red); }
  .booking-row .dismiss-btn { top: 12px; right: 12px; }
  .booking-row.has-quick-action { padding-bottom: 44px; }
  .flag-btn {
    position: absolute; bottom: 10px; right: 10px;
    width: 26px; height: 26px; border-radius: 50%;
    background: rgba(52,199,89,0.14); color: var(--green);
    border: none; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
  }
  .flag-btn:active { background: rgba(52,199,89,0.26); }

  .search-bar { position: relative; margin-bottom: 16px; }
  .search-bar input {
    width: 100%; padding: 12px 14px; border-radius: var(--radius-md); border: 1px solid var(--border);
    font-size: 15px; background: var(--card); color: var(--text);
  }

  .guest-selector { display: flex; gap: 8px; margin-bottom: 12px; }
  .guest-btn {
    flex: 1; padding: 11px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--bg); color: var(--text); text-align: center; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .guest-btn:active { opacity: 0.7; }
  .guest-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

  .pay-selector { display: flex; gap: 8px; margin-bottom: 12px; }
  .pay-btn {
    flex: 1; padding: 10px 4px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--bg); color: var(--text-secondary); text-align: center; font-size: 12.5px; font-weight: 700;
    cursor: pointer; transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .pay-btn:active { opacity: 0.7; }
  .pay-btn.pay-da-saldare.active { background: rgba(255,59,48,0.12); color: var(--red); border-color: transparent; }
  .pay-btn.pay-acconto-versato.active { background: rgba(255,149,0,0.12); color: var(--orange); border-color: transparent; }
  .pay-btn.pay-saldata.active { background: rgba(52,199,89,0.12); color: var(--green); border-color: transparent; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em;
    padding: 4px 9px; border-radius: 100px; display: inline-flex; align-items: center; gap: 3px;
  }
  .chip-code { font-family: ui-monospace, SFMono-Regular, monospace; text-transform: none; letter-spacing: 0.01em; background: rgba(142,142,147,0.12); color: var(--text-secondary); }
  .chip-guests { background: rgba(90,200,250,0.16); color: #0669a8; }
  .chip-pay-da-saldare { background: rgba(255,59,48,0.12); color: var(--red); }
  .chip-pay-acconto-versato { background: rgba(255,149,0,0.12); color: var(--orange); }
  .chip-pay-saldata { background: rgba(52,199,89,0.12); color: var(--green); }

  .hero-card {
    background: var(--card);
    border: 1px solid rgba(60,60,67,0.06);
    border-radius: var(--radius-lg);
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .hero-card:active { transform: scale(0.98); }
  .hero-card .hero-icon {
    width: 52px; height: 52px; flex-shrink: 0;
    border-radius: var(--radius-sm);
    background: rgba(142,142,147,0.12);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .hero-card .hero-text { flex: 1; }
  .hero-card .name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .hero-card .count { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-secondary); }
  .hero-card.has-items {
    background: rgba(255,59,48,0.08);
    border-color: transparent;
    box-shadow: 0 4px 16px rgba(255,59,48,0.08);
  }
  .hero-card.has-items .hero-icon { background: rgba(255,59,48,0.14); }
  .hero-card.has-items .count { color: var(--red); }

  .hero-row { display: flex; gap: 12px; margin-bottom: 12px; }
  .hero-half {
    flex: 1; background: var(--card); border: 1px solid rgba(60,60,67,0.06);
    border-radius: var(--radius-lg); padding: 16px; cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .hero-half:active { transform: scale(0.97); }
  .hero-half .hero-icon {
    width: 40px; height: 40px; border-radius: var(--radius-sm);
    background: rgba(142,142,147,0.12); display: flex; align-items: center; justify-content: center;
    font-size: 19px; margin-bottom: 10px;
  }
  .hero-half .name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .hero-half .count { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-secondary); }
  .hero-half.tone-red.has-items { background: rgba(255,59,48,0.08); border-color: transparent; box-shadow: 0 4px 16px rgba(255,59,48,0.08); }
  .hero-half.tone-red.has-items .hero-icon { background: rgba(255,59,48,0.14); }
  .hero-half.tone-red.has-items .count { color: var(--red); }
  .hero-half.tone-amber.has-items { background: rgba(255,159,10,0.1); border-color: transparent; box-shadow: 0 4px 16px rgba(255,159,10,0.1); }
  .hero-half.tone-amber.has-items .hero-icon { background: rgba(255,159,10,0.2); }
  .hero-half.tone-amber.has-items .count { color: #b25900; }

  .icon.red { background: rgba(255,59,48,0.12); }
  .icon.blue { background: rgba(10,110,189,0.12); }
  .icon.orange { background: rgba(255,149,0,0.12); }
  .icon.purple { background: rgba(175,82,222,0.12); }
  .icon.teal { background: rgba(90,200,250,0.12); }
  .icon.green { background: rgba(52,199,89,0.12); }
  .icon.gray { background: rgba(142,142,147,0.12); }
  .icon.amber { background: rgba(255,159,10,0.16); }

  .refresh-row { display: flex; justify-content: space-between; align-items: center; margin: 24px 0 4px; padding: 0 4px; }
  .refresh-row .status { font-size: 13px; color: var(--text-secondary); }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--card); border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; cursor: pointer;
  }

  .list-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .back { font-size: 17px; color: var(--accent); font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .list-title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }

  .email-row {
    background: var(--card);
    border-radius: var(--radius-md);
    padding: 14px 44px 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: transform 0.15s ease;
    position: relative;
  }
  .email-row:active { transform: scale(0.98); }
  .email-row .from { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .email-date { font-size: 12px; color: var(--text-secondary); white-space: nowrap; flex-shrink: 0; }
  .email-row .subject { font-size: 14px; color: var(--text); margin-bottom: 4px; opacity: 0.85; }
  .email-row .preview { font-size: 13px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .email-row .ready-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--green); font-weight: 600; margin-top: 6px; }
  .dismiss-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: rgba(60,60,67,0.08);
    color: var(--text-secondary);
    border: none;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .dismiss-btn:active { background: rgba(60,60,67,0.16); }

  .detail-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 16px;
  }
  .detail-row { font-size: 14px; margin-bottom: 6px; }
  .detail-row .label { color: var(--text-secondary); margin-right: 6px; }
  .pill-row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .pill {
    background: rgba(10,110,189,0.1); color: var(--accent);
    font-size: 12px; font-weight: 600;
    padding: 5px 10px; border-radius: 100px;
  }
  .pill.tone-urgente, .pill.tone-arrabbiato { background: rgba(255,59,48,0.1); color: var(--red); }

  .section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.02em; margin: 20px 0 10px 4px; }
  .original-text {
    font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    color: var(--text); opacity: 0.85;
  }

  .response-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 12px;
  }
  .response-card .opt-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .opt-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .opt-dot.green { background: var(--green); }
  .opt-dot.orange { background: var(--orange); }
  .opt-dot.red { background: var(--red); }
  .opt-dot.gray { background: var(--text-secondary); }
  .discrepancy-banner {
    background: rgba(255,149,0,0.12); color: var(--orange);
    padding: 12px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px; line-height: 1.45;
  }
  .discrepancy-banner b { font-weight: 700; }
  .response-card .body-text {
    width: 100%;
    font-family: inherit;
    font-size: 14px; line-height: 1.5; white-space: pre-wrap;
    text-align: left;
    background: var(--bg); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 12px;
    border: 1px solid transparent;
    resize: vertical;
    min-height: 110px;
    color: var(--text);
  }
  .response-card .body-text:focus { outline: none; border-color: var(--accent); background: var(--card); }
  .response-card .body-text:disabled { opacity: 0.7; }
  .sent-confirm {
    background: rgba(52,199,89,0.12); color: var(--green);
    padding: 12px; border-radius: var(--radius-sm); font-size: 13px; margin-top: 10px;
  }
  .sent-confirm a { color: var(--green); font-weight: 600; text-decoration: underline; }
  .sent-confirm .pending { color: var(--text-secondary); font-weight: 500; }

  .confirm-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .confirm-overlay.hidden { display: none; }
  .confirm-box {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 28px 24px;
    max-width: 320px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  .confirm-box .icon { font-size: 42px; margin-bottom: 12px; }
  .confirm-box h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .confirm-box p { font-size: 14px; color: var(--text-secondary); margin-bottom: 22px; line-height: 1.45; }
  .review-tab {
    background: rgba(10,110,189,0.08); color: var(--accent); font-size: 13px; font-weight: 700;
    padding: 8px 14px; border-radius: 100px; display: inline-block; margin-bottom: 14px;
  }
  .btn-row { display: flex; gap: 8px; }
  .btn-row + .btn-row { margin-top: 8px; }
  .btn {
    flex: 1; border: none; border-radius: var(--radius-sm); padding: 11px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.7; }
  .btn:disabled { opacity: 0.4; }
  .btn-send { background: var(--green); color: white; }
  .btn-send.sent { background: rgba(52,199,89,0.15); color: var(--green); }
  .btn-reject { background: rgba(255,59,48,0.1); color: var(--red); }
  .btn-secondary { background: rgba(10,110,189,0.1); color: var(--accent); }

  .empty, .loading, .login-box { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
  .spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid rgba(0,0,0,0.08); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .login-box h2 { color: var(--text); font-size: 20px; margin-bottom: 8px; }
  .login-box p { font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
  .btn-primary {
    background: var(--accent); color: white; border: none;
    padding: 14px; border-radius: var(--radius-md); font-size: 16px; font-weight: 600;
    width: 100%; cursor: pointer;
  }

  input.key-input {
    width: 100%; padding: 14px; border-radius: var(--radius-md); border: 1px solid var(--border);
    font-size: 15px; font-family: monospace; margin-bottom: 12px; background: var(--card);
  }
  .form-input {
    width: 100%; padding: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    font-size: 14px; font-family: inherit; background: var(--bg); color: var(--text); margin-bottom: 10px;
  }
  select.form-input { -webkit-appearance: none; appearance: none; }
  .form-label { font-size: 12px; color: var(--text-secondary); font-weight: 600; margin-bottom: 4px; display: block; }
  .quote-preview { background: var(--bg); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 12px; }
  .quote-preview .detail-row:last-child { margin-bottom: 0; }

  .error-banner {
    background: rgba(255,59,48,0.1); color: var(--red);
    padding: 12px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px;
  }

  .code-hero { text-align: center; padding: 6px 0 4px; }
  .code-hero .code-value {
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 22px; font-weight: 700; letter-spacing: 0.03em;
    background: rgba(10,110,189,0.08); color: var(--accent);
    padding: 10px 16px; border-radius: var(--radius-sm); display: inline-block; margin-top: 6px;
  }
  .source-email-box {
    background: var(--bg); border-radius: var(--radius-sm); padding: 12px; margin-top: 4px;
    font-size: 13px; line-height: 1.5;
  }
  .source-email-box .src-subject { font-weight: 600; margin-bottom: 4px; }
  .source-email-box .src-body { color: var(--text-secondary); }

  .settings-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    overflow: hidden;
    margin-top: 20px;
    border: 1px solid rgba(60,60,67,0.06);
  }
  .settings-row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer; }
  .settings-row:active { background: var(--bg); }
  .settings-row + .settings-row { border-top: 1px solid rgba(60,60,67,0.08); }
  .settings-row .settings-icon { font-size: 17px; width: 22px; text-align: center; flex-shrink: 0; }
  .settings-icon-badge {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .settings-icon-badge.blue { background: rgba(10,110,189,0.12); }
  .settings-icon-badge.gray { background: rgba(142,142,147,0.12); }
  .settings-icon-badge.purple { background: rgba(175,82,222,0.12); }
  .settings-row .settings-label { flex: 1; font-size: 15px; color: var(--text); }
  .settings-row .settings-chevron { color: var(--text-secondary); font-size: 16px; }
</style>
</head>
<body>
  <div class="container" id="app"></div>
  <div id="confirmOverlay" class="confirm-overlay hidden"></div>

<script>
const CATEGORY_META = {
  'Lamentela':               { icon: '⚠️', color: 'red', label: 'Lamentela' },
  'Da verificare':           { icon: '🔍', color: 'amber', label: 'Da verificare' },

  // Camere disponibili — usate per calcolare la percentuale di occupazione.

  get roomsCount() { return 2; }

  daysInMonth(monthKey) {
    const [y, m] = monthKey.split('-').map(Number);
    return new Date(y, m, 0).getDate();
  }

  capitalize(str) {
    return str ? str.charAt(0).toUpperCase() + str.slice(1) : str;
  }

  // Statistiche mensili: incasso, notti occupate (e % occupazione sulle
  // camere disponibili), numero di soggiorni e quanti tra quelli conclusi
  // hanno una nota associata (proxy di "soggiorno con qualche problema" —
  // non perfetto, perché le note possono anche essere state scritte in fase
  // di prenotazione per motivi non legati a un problema).
  computeMonthlyStats() {
    const months = {};
    this.bookings.forEach(b => {
      if (!b.check_in) return;
      const monthKey = b.check_in.slice(0, 7);
      if (!months[monthKey]) {
        months[monthKey] = { revenue: 0, nights: 0, totalStays: 0, problemStays: 0, daysInMonth: this.daysInMonth(monthKey) };
      }
      const m = months[monthKey];
      if (b.status === 'cancellata') return;
      m.revenue += Number(b.total) || 0;
      m.totalStays += 1;
      try {
        m.nights += this.computeNightsPreview(b.check_in, b.check_out);
      } catch (e) {}
      if (b.status === 'conclusa' && b.notes) m.problemStays += 1;
    });
    return months;
  }

    const months = this.computeMonthlyStats();
    const keys = Object.keys(months).sort().reverse();
    const rows = keys.map(k => {

      const occupancy = capacity > 0 ? Math.min(100, Math.round((m.nights / capacity) * 100)) : 0;
      const [y, mm] = k.split('-');
      const monthLabel = this.capitalize(new Date(Number(y), Number(mm) - 1, 1).toLocaleDateString('it-IT', { month: 'long', year: 'numeric' }));

  async saveBookingDetail() {
    const b = this.selectedBooking;
    this.bookingSaving = true;
    this.error = null;
    this.render();
    try {
      const wasActive = (b.status || 'confermata') !== 'conclusa' && (b.status || 'confermata') !== 'cancellata';
      const nowConcluded = this.bookingStatusDraft === 'conclusa' || this.bookingStatusDraft === 'cancellata';
      const concludedAt = (wasActive && nowConcluded) ? new Date().toISOString() : undefined;
      const payload = { id: b.id, notes: this.bookingNotesDraft, status: this.bookingStatusDraft, paymentStatus: this.bookingPaymentDraft };
      if (concludedAt) payload.concludedAt = concludedAt;
      const res = await fetch('/api/booking', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Salvataggio fallito');
      this.selectedBooking = data.booking;
      const idx = this.bookings.findIndex(x => x.id === b.id);
      if (idx !== -1) this.bookings[idx] = data.booking;
      if (wasActive && this.bookingStatusDraft === 'conclusa') {
        this.notifyCleaningLady(data.booking);
        this.showNextBookingInfo(data.booking);

    } catch (e) {
      this.error = e.message;

    this.render();

      confirmLabel: 'Elimina',
      onConfirm: async () => {
        try {
          await fetch('/api/booking', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },

        this.bookings = this.bookings.filter(b => b.id !== id);

  // Una prenotazione conclusa da più di 48 ore non può più tornare "in corso":
  // diventa solo consultabile, per sicurezza (evita di riaprire per sbaglio
  // soggiorni ormai chiusi da tempo). Le prenotazioni senza concluded_at
  // (salvate prima di questo aggiornamento) non vengono bloccate a ritroso.
  isBookingLocked(b) {
    if (!b.concluded_at) return false;
    const elapsedMs = Date.now() - new Date(b.concluded_at).getTime();
    return elapsedMs > 48 * 60 * 60 * 1000;
  }

  restoreBookingToActive(id) {
    const booking = this.bookings.find(b => b.id === id);
    if (!booking) return;
    if (this.isBookingLocked(booking)) {
      this.error = 'Sono passate più di 48 ore dalla chiusura: questa prenotazione è ormai solo consultabile.';
      this.render();
      return;
    }
    this.showConfirmDialog({
      title: 'Riportarla tra le prenotazioni in corso?',
      desc: `${this.escape(booking.guest_name)} tornerà tra le prenotazioni attive.`,
      confirmLabel: 'Riporta in corso',
      confirmColor: 'var(--accent)',
      icon: '↩️',
      onConfirm: async () => {
        try {
          await fetch('/api/booking', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, status: 'confermata', checkoutReviewed: false, concludedAt: null })
          });
        } catch (e) {}
        const idx = this.bookings.findIndex(x => x.id === id);
        if (idx !== -1) { this.bookings[idx].status = 'confermata'; this.bookings[idx].checkout_reviewed = false; this.bookings[idx].concluded_at = null; }
        const area = document.getElementById('bookingResultsArea');
        if (area) area.innerHTML = this.renderBookingRows(); else this.render();
      }
    });
  }

    if (debugScope) {
      window.history.replaceState({}, '', window.location.pathname);
    }
    const key = localStorage.getItem('claude_api_key');
    if (!key) { this.view = 'setup'; this.render(); return; }
    await this.loadEmails();
    if (debugScope) {
      this.error = 'DEBUG scope ricevuto da Google: ' + decodeURIComponent(debugScope);
      this.render();
    }
    setInterval(() => this.silentRefresh(), 5 * 60 * 1000);

  async silentRefresh() {
    if (this.view !== 'dashboard') return;
    try {
      const res = await fetch('/api/emails-analyzed', {
        headers: { 'x-claude-key': localStorage.getItem('claude_api_key') }
      });
      if (!res.ok) return;
      const data = await res.json();
      this.byCategory = data.byCategory || {};
      this.lastUpdated = new Date();
      if (this.view === 'dashboard') this.render();

    this.loadReminders();

        headers: { 'x-claude-key': localStorage.getItem('claude_api_key') }
      });
      if (res.status === 401) { this.view = 'login'; this.render(); return; }
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error || 'Errore nel caricamento');

      const data = await res.json();
      this.byCategory = data.byCategory || {};
      this.lastUpdated = new Date();

  // Se per questo cliente c'è un preventivo già inviato in precedenza,
  // precompila la sezione Prenotazione con tariffa/sconto/date/ospiti già
  // decisi — evita di doverli ridigitare quando il cliente risponde per confermare.
  async checkPendingQuote(email) {
    try {
      const res = await fetch('/api/booking?pendingQuoteEmail=' + encodeURIComponent(email));
      const data = await res.json().catch(() => ({}));
      const pq = data.pendingQuote;
      if (!pq) return;
      // Solo se siamo ancora sulla stessa mail/cliente (evita race condition
      // se l'utente ha già cambiato schermata quando la risposta arriva)
      if (!this.selectedEmail || this.extractEmailAddress(this.selectedEmail.from) !== email) return;
      const bs = this.emailBookingState;
      if (pq.check_in) bs.checkIn = pq.check_in;
      if (pq.check_out) bs.checkOut = pq.check_out;
      if (pq.rate_per_night != null) { bs.ratePerNight = String(pq.rate_per_night); bs.rateTouched = true; }
      if (pq.discount_percent != null) { bs.discountPercent = String(pq.discount_percent); bs.discountTouched = true; }
      if (pq.guests) bs.guests = pq.guests;
      bs.prefilledFromQuote = true;
      bs.quoteSentAt = pq.created_at;
      this.render();
    } catch (e) {}
  }

  async sendResponse(idx) {
    const email = this.selectedEmail;
    const respItem = email.responses[idx];
    const resp = (respItem && typeof respItem === 'object') ? respItem.text : respItem;
    const to = (email.from.match(/[\w.-]+@[\w.-]+\.\w+/) || [])[0] || '';
    const subject = 'RE: ' + email.subject;
    this.sendingIdx = idx;
    this.error = null;
    this.render();
    try {
      const res = await fetch('/api/send-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ to, subject, body: resp })
      });
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error || ('Invio fallito (status ' + res.status + ')'));
      }
      const data = await res.json();
      email.sentIdx = idx;
      email.sentThreadId = data.threadId || null;
      email.sentConfirmed = !!data.confirmed;
      this.resolvedIds.add(email.id);
      this.saveResolvedIds();
      this.showSendConfirmation(data.confirmed);
      fetch('/api/mark-resolved', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ emailId: email.id })
      }).catch(() => {});
    } catch (e) {
      this.error = e.message;
    }
    this.sendingIdx = null;
    this.render();
  }

  showSendConfirmation(confirmed) {
    const overlay = document.getElementById('confirmOverlay');
    const icon = confirmed ? '✅' : '⚠️';
    const title = confirmed ? 'Email inviata e confermata' : 'Email inviata';
    const desc = confirmed
      ? 'Verificato direttamente su Gmail: il messaggio risulta davvero nella posta inviata.'
      : 'Il messaggio è stato inviato, ma la verifica automatica su Gmail non è riuscita in questo momento. Puoi controllare manualmente se vuoi esserne certo.';
    overlay.innerHTML = `
      <div class="confirm-box">
        <div class="icon">${icon}</div>
        <h3>${title}</h3>
        <p>${desc}</p>
        <button class="btn btn-primary" onclick="app.closeConfirmModal()">OK</button>
      </div>`;
    overlay.classList.remove('hidden');
  }

  closeConfirmModal() {
    document.getElementById('confirmOverlay').classList.add('hidden');
  }

  // Dialog di conferma generico usato prima di ogni cancellazione (✕): mostra
  // Annulla + un bottone d'azione rosso, ed esegue onConfirm solo se confermato.
  showConfirmDialog({ title, desc, confirmLabel = 'Elimina', confirmColor = 'var(--red)', icon = '🗑️', onConfirm }) {
    this._pendingConfirmAction = onConfirm;
    const overlay = document.getElementById('confirmOverlay');
    overlay.innerHTML = `
      <div class="confirm-box">
        <div class="icon">${icon}</div>
        <h3>${title}</h3>
        <p>${desc}</p>
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="app.cancelConfirmDialog()">Annulla</button>
          <button class="btn" style="background:${confirmColor}; color:white;" onclick="app.runConfirmedAction()">${confirmLabel}</button>
        </div>
      </div>`;
    overlay.classList.remove('hidden');
  }

  cancelConfirmDialog() {
    this._pendingConfirmAction = null;
    document.getElementById('confirmOverlay').classList.add('hidden');
  }

  runConfirmedAction() {
    const action = this._pendingConfirmAction;
    this._pendingConfirmAction = null;
    document.getElementById('confirmOverlay').classList.add('hidden');
    if (action) action();
  }

  extractEmailAddress(fromStr) {
    return (fromStr.match(/[\w.-]+@[\w.-]+\.\w+/) || [])[0] || '';
  }

  extractGuestName(fromStr) {
    const match = fromStr.match(/^"?([^"<]+)"?\s*<[^>]+>/);
    if (match) return match[1].trim();
    return this.extractEmailAddress(fromStr).split('@')[0] || fromStr;
  }

  toggleQuoteForm() {
    if (!this.quoteState.open && !this.quoteState.guestName) {
      this.quoteState.guestName = this.extractGuestName(this.selectedEmail.from);
    }
    const opening = !this.quoteState.open;
    this.quoteState.open = opening;
    this.render();
    if (opening && !this.quoteState.guestHistory.length) {
      const guestEmail = this.extractEmailAddress(this.selectedEmail.from);
      if (guestEmail) this.checkGuestHistory('quoteState', guestEmail);
    }
  }

  selectGuests(stateKey, n) {
    this[stateKey].guests = n;
    this.render();
  }

  renderGuestSelector(stateKey, current) {
    const opts = [1, 2, 3, 4];
    return `
      <span class="form-label">Numero ospiti</span>
      <div class="guest-selector">
        ${opts.map(n => `<div class="guest-btn ${current === n ? 'active' : ''}" onclick="app.selectGuests('${stateKey}', ${n})">${n}</div>`).join('')}
      </div>`;
  }

  selectPaymentStatus(stateKey, value) {
    this[stateKey].paymentStatus = value;
    this.render();
  }

  renderPaymentSelector(stateKey, current) {
    const opts = [
      { value: 'da saldare', label: 'Da saldare' },
      { value: 'acconto versato', label: 'Acconto' },
      { value: 'saldata', label: 'Saldata' }
    ];
    return `
      <span class="form-label">Pagamento</span>
      <div class="pay-selector">
        ${opts.map(o => `<div class="pay-btn pay-${o.value.replace(/\s+/g, '-')} ${current === o.value ? 'active' : ''}" onclick="app.selectPaymentStatus('${stateKey}', '${o.value}')">${o.label}</div>`).join('')}
      </div>`;
  }

  // ---------- Storico ospite: avvisa se chi sta prenotando ha già avuto
  // problemi in soggiorni precedenti (vedi note salvate al check-out) ----------
  async checkGuestHistory(stateKey, email) {
    if (!email) { this[stateKey].guestHistory = []; return; }
    try {
      const res = await fetch('/api/booking?guestEmail=' + encodeURIComponent(email));
      const data = await res.json().catch(() => ({}));
      const withNotes = (data.bookings || []).filter(b => b.notes);
      // Deduplica per data+testo: se ci sono più prenotazioni con la stessa
      // identica nota (es. da un doppio tap durante un test), mostrala una volta sola.
      const seen = new Set();
      this[stateKey].guestHistory = withNotes.filter(b => {
        const key = (b.check_out || '') + '|' + b.notes;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    } catch (e) {
      this[stateKey].guestHistory = [];
    }
    this.render();
  }

  renderGuestHistoryBanner(guestHistory) {
    if (!guestHistory || !guestHistory.length) return '';
    const items = guestHistory.map(h =>
      `<div>${this.formatQuoteDate(h.check_out)}: ${this.escape(h.notes)}</div>`
    ).join('');
    return `<div class="discrepancy-banner">⚠️ <b>Questo ospite ha già soggiornato — note dai check-out precedenti:</b>${items}</div>`;
  }

  // ---------- Pop-up di revisione check-out: appare da solo quando una
  // prenotazione ha raggiunto la data di check-out e non è ancora stata
  // confermata come "andata bene" o "andata male" ----------
  async checkPendingCheckoutReviews() {
    try {
      const res = await fetch('/api/booking?needsReview=true');
      const data = await res.json().catch(() => ({}));
      this.checkoutReviewQueue = data.bookings || [];
    } catch (e) {
      this.checkoutReviewQueue = [];
    }
    this.showNextCheckoutReview();
  }

  showNextCheckoutReview() {
    if (!this.checkoutReviewQueue.length) return;
    this.currentCheckoutReview = this.checkoutReviewQueue[0];
    this.checkoutNoteDraft = '';
    this.renderCheckoutReviewModal();
  }

  renderCheckoutReviewModal() {
    const b = this.currentCheckoutReview;
    const overlay = document.getElementById('confirmOverlay');
    const checkOutFmt = this.formatQuoteDate(b.check_out);
    overlay.innerHTML = `
      <div class="confirm-box">
        <div class="icon">🏁</div>
        <h3>Com'è andato il soggiorno?</h3>
        <p>${this.escape(b.guest_name)} — check-out del ${checkOutFmt}${b.code ? ' · ' + this.escape(b.code) : ''}</p>
        <div class="btn-row">
          <button class="btn btn-send" onclick="app.reviewCheckoutOk()">✅ Tutto ok</button>
          <button class="btn" style="background:var(--orange); color:white;" onclick="app.reviewCheckoutProblem()">⚠️ Problemi</button>
        </div>
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="app.skipCheckoutReview()">Chiedimelo più tardi</button>
        </div>
      </div>`;
    overlay.classList.remove('hidden');
  }

  async reviewCheckoutOk() {
    const b = this.currentCheckoutReview;
    await this.saveCheckoutReview(b, true, null);
    this.showNextBookingInfo(b, () => this.advanceCheckoutQueue());
  }

  reviewCheckoutProblem() {
    const b = this.currentCheckoutReview;
    const overlay = document.getElementById('confirmOverlay');
    overlay.innerHTML = `
      <div class="confirm-box">
        <div class="icon">⚠️</div>
        <h3>Cosa è successo?</h3>
        <p>Questa nota resta legata a ${this.escape(b.guest_name)} — utile se dovesse riprenotare in futuro.</p>
        <textarea class="form-input" style="min-height:90px; resize:vertical; text-align:left;" placeholder="Es. rumoroso, lamentele dai vicini, danni…" oninput="app.checkoutNoteDraft = this.value"></textarea>
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="app.skipCheckoutReview()">Salta per ora</button>
          <button class="btn btn-send" onclick="app.saveCheckoutProblemNote()">Salva nota</button>
        </div>
      </div>`;
    overlay.classList.remove('hidden');
  }

  async saveCheckoutProblemNote() {
    const b = this.currentCheckoutReview;
    await this.saveCheckoutReview(b, true, this.checkoutNoteDraft || null);
    this.showNextBookingInfo(b, () => this.advanceCheckoutQueue());
  }

  skipCheckoutReview() {
    // non segna come rivisto: ricomparirà al prossimo avvio dell'app
    this.closeConfirmModal();
    this.checkoutReviewQueue.shift();
    this.currentCheckoutReview = null;
    setTimeout(() => this.showNextCheckoutReview(), 400);
  }

  async saveCheckoutReview(booking, reviewed, note) {
    try {
      const existingNotes = booking.notes ? booking.notes + '\n' : '';
      const combinedNotes = note ? existingNotes + note : (booking.notes || null);
      const concludedAt = new Date().toISOString();
      await fetch('/api/booking', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: booking.id, status: 'conclusa', checkoutReviewed: reviewed, notes: combinedNotes, concludedAt })
      });
      const idx = this.bookings.findIndex(x => x.id === booking.id);
      if (idx !== -1) { this.bookings[idx].status = 'conclusa'; this.bookings[idx].notes = combinedNotes; this.bookings[idx].concluded_at = concludedAt; }
      this.notifyCleaningLady(booking);
    } catch (e) {}
  }

  // Orari fissi di check-out/check-in — modificabili qui se la regola cambia.
  // Check-out entro le 11:00; check-in del prossimo ospite non prima delle
  // 12:00 (un giorno libero per le pulizie, come da regola di Filippo).
  get checkoutHour() { return 11; }
  get checkinHour() { return 12; }

  hoursUntilNextCheckin(checkOutDate, nextCheckInDate) {
    const checkoutMoment = new Date(`${checkOutDate}T${String(this.checkoutHour).padStart(2, '0')}:00:00`);
    const nextCheckinMoment = new Date(`${nextCheckInDate}T${String(this.checkinHour).padStart(2, '0')}:00:00`);
    return Math.round((nextCheckinMoment - checkoutMoment) / 3600000);
  }

  formatHoursCountdown(hours) {
    if (hours <= 0) return 'check-in già iniziato o imminente';
    if (hours < 48) return `mancano ${hours} or${hours === 1 ? 'a' : 'e'}`;
    const days = Math.floor(hours / 24);
    const remHours = hours % 24;
    return `mancano ${days} giorn${days === 1 ? 'o' : 'i'}${remHours > 0 ? ` e ${remHours} or${remHours === 1 ? 'a' : 'e'}` : ''}`;
  }

  // Avvisa la persona delle pulizie che un soggiorno è terminato, incrociando
  // il calendario per dirle quanto tempo ha prima della prossima prenotazione
  // (nota: le prenotazioni non sono legate a una camera specifica, quindi se
  // ci sono più camere questo guarda la prossima in assoluto, non per forza
  // la stessa stanza appena liberata).
  async notifyCleaningLady(booking) {
    try {
      const settingsRes = await fetch('/api/auth?action=get-cleaner-email');
      const settingsData = await settingsRes.json().catch(() => ({}));
      const cleanerEmail = settingsData.cleanerEmail;
      if (!cleanerEmail) return;

      const nextRes = await fetch('/api/booking?nextCheckinAfter=' + encodeURIComponent(booking.check_out));
      const nextData = await nextRes.json().catch(() => ({}));
      const next = nextData.nextBooking;

      const checkOutFmt = this.formatQuoteDate(booking.check_out);
      let body;
      if (!next) {
        body = `Ciao! Il soggiorno di ${booking.guest_name} a Domus 106 è terminato oggi (check-out del ${checkOutFmt}). Puoi andare a fare le pulizie quando preferisci — al momento non risultano altre prenotazioni in arrivo.`;
      } else {
        const nextCheckInFmt = this.formatQuoteDate(next.check_in);
        const hoursLeft = this.hoursUntilNextCheckin(booking.check_out, next.check_in);
        const countdown = this.formatHoursCountdown(hoursLeft);
        if (hoursLeft <= 24) {
          body = `Ciao! Il soggiorno di ${booking.guest_name} a Domus 106 è terminato oggi (check-out del ${checkOutFmt}). ⚠️ Attenzione: il prossimo ospite (${next.guest_name}) arriva il ${nextCheckInFmt} — ${countdown}, servirebbero le pulizie il prima possibile.`;
        } else {
          body = `Ciao! Il soggiorno di ${booking.guest_name} a Domus 106 è terminato oggi (check-out del ${checkOutFmt}). Puoi andare a fare le pulizie con calma: la prossima prenotazione (${next.guest_name}) arriva il ${nextCheckInFmt} — ${countdown}.`;
        }
      }

      await fetch('/api/send-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ to: cleanerEmail, subject: 'Domus 106 — check-out completato', body })
      });

      // Segna che la mail è partita: da qui in poi compare il promemoria
      // "conferma che gliel'hai detto" finché non lo chiudi tu a mano.
      await fetch('/api/booking', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: booking.id, cleanerNotified: true, cleanerConfirmed: false })
      }).catch(() => {});
      const idx = this.bookings.findIndex(x => x.id === booking.id);
      if (idx !== -1) { this.bookings[idx].cleaner_notified = true; this.bookings[idx].cleaner_confirmed = false; }
      this.loadReminders();
    } catch (e) {
      // avviso best-effort: un problema qui non deve mai bloccare la chiusura della prenotazione
    }
  }

  advanceCheckoutQueue() {
    this.checkoutReviewQueue.shift();
    this.currentCheckoutReview = null;
    this.closeConfirmModal();
    setTimeout(() => this.showNextCheckoutReview(), 400);
  }

  // Dopo aver chiuso un soggiorno, mostra a Filippo (non alla colf) la
  // prossima prenotazione con un countdown in giorni. Niente orario: il
  // check-in di Domus 106 è autonomo e senza fascia oraria fissa, quindi
  // quel dato semplicemente non esiste da nessuna parte nei dati salvati.
  async showNextBookingInfo(booking, onDismiss) {
    this._nextInfoDismiss = onDismiss || null;
    let next = null;
    try {
      const nextRes = await fetch('/api/booking?nextCheckinAfter=' + encodeURIComponent(booking.check_out));
      const nextData = await nextRes.json().catch(() => ({}));
      next = nextData.nextBooking;
    } catch (e) {}

    let desc;
    if (!next) {
      desc = 'Nessuna prenotazione in arrivo al momento.';
    } else {
      const nextCheckInFmt = this.formatQuoteDate(next.check_in);
      const hoursLeft = this.hoursUntilNextCheckin(booking.check_out, next.check_in);
      const countdown = this.formatHoursCountdown(hoursLeft);
      desc = `${next.guest_name} — check-in il ${nextCheckInFmt}. ${countdown} al prossimo check-in (check-out entro le ${this.checkoutHour}:00, check-in non prima delle ${this.checkinHour}:00).`;
    }

    const overlay = document.getElementById('confirmOverlay');
    overlay.innerHTML = `
      <div class="confirm-box">
        <div class="icon">📅</div>
        <h3>Prossima prenotazione</h3>
        <p>${this.escape(desc)}</p>
        <button class="btn btn-primary" onclick="app.dismissNextBookingInfo()">OK</button>
      </div>`;
    overlay.classList.remove('hidden');
  }

  dismissNextBookingInfo() {
    document.getElementById('confirmOverlay').classList.add('hidden');
    const cb = this._nextInfoDismiss;
    this._nextInfoDismiss = null;
    if (cb) cb();
  }

  updateQuoteField(stateKey, field, value) {
    const qs = this[stateKey];
    qs[field] = value;
    if (field === 'ratePerNight') qs.rateTouched = true;
    if (field === 'discountPercent') qs.discountTouched = true;
    if (field === 'emailMessage') qs.messageTouched = true;
    if (field === 'checkIn' || field === 'checkOut') this.applySuggestedDefaults(stateKey);
    // emailBookingState non ha un messaggio email da rigenerare (non invia mail,
    // serve solo a confermare una prenotazione diretta con tariffa/totale)
    const messageElIds = { quoteState: 'quoteMessage', standaloneQuoteState: 'standaloneQuoteMessage' };
    if (messageElIds[stateKey] && field !== 'emailMessage' && !qs.messageTouched) {
      qs.emailMessage = this.buildDefaultQuoteMessage(stateKey);
      const msgEl = document.getElementById(messageElIds[stateKey]);
      if (msgEl) msgEl.value = qs.emailMessage;
    }
    this.refreshQuotePreview(stateKey);
  }

  formatQuoteDate(isoDateStr) {
    if (!isoDateStr) return '';
    const d = new Date(isoDateStr + 'T00:00:00');
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('it-IT', { day: '2-digit', month: 'long', year: 'numeric' });
  }

  buildDefaultQuoteMessage(stateKey) {
    const qs = this[stateKey];
    const { guestName, checkIn, checkOut, ratePerNight, discountPercent } = qs;
    if (!checkIn || !checkOut || !guestName || !ratePerNight) return '';
    let nights;
    try { nights = this.computeNightsPreview(checkIn, checkOut); } catch (e) { return ''; }
    const rate = parseFloat(ratePerNight) || 0;
    const discount = parseFloat(discountPercent) || 0;
    const subtotal = nights * rate;
    const discountAmount = Math.round(subtotal * discount) / 100;
    const total = subtotal - discountAmount;
    const checkInFmt = this.formatQuoteDate(checkIn);
    const checkOutFmt = this.formatQuoteDate(checkOut);
    return `Gentile ${guestName},

in allegato trova il preventivo richiesto per il Suo soggiorno presso Domus 106 dal ${checkInFmt} al ${checkOutFmt} (${nights} nott${nights === 1 ? 'e' : 'i'}).

Totale soggiorno: € ${total.toFixed(2)}${discount > 0 ? ` (sconto ${discount}% per soggiorni lunghi già applicato)` : ''}

Resto a disposizione per qualsiasi chiarimento.

Cordiali saluti,
Domus 106`;
  }

  computeNightsPreview(checkInStr, checkOutStr) {
    const checkIn = new Date(checkInStr + 'T00:00:00');
    const checkOut = new Date(checkOutStr + 'T00:00:00');
    const nights = Math.round((checkOut - checkIn) / 86400000);
    if (!(nights > 0)) throw new Error('Il check-out deve essere dopo il check-in');
    return nights;
  }

  suggestRatePreview(checkInStr) {
    const checkIn = new Date(checkInStr + 'T00:00:00');
    const month = checkIn.getMonth() + 1;
    return (month >= 6 && month <= 9) ? 150 : 80;
  }

  applySuggestedDefaults(stateKey) {
    const qs = this[stateKey];
    const { checkIn, checkOut } = qs;
    if (!checkIn || !checkOut) return;
    try {
      const nights = this.computeNightsPreview(checkIn, checkOut);
      if (!qs.rateTouched) qs.ratePerNight = String(this.suggestRatePreview(checkIn));
      if (!qs.discountTouched) qs.discountPercent = String(nights >= 30 ? 30 : (nights >= 7 ? 15 : 0));
    } catch (e) {}
  }

  refreshQuotePreview(stateKey) {
    const previewElIds = { quoteState: 'quotePreview', standaloneQuoteState: 'standaloneQuotePreview', emailBookingState: 'emailBookingPreview' };
    const previewEl = document.getElementById(previewElIds[stateKey]);
    if (!previewEl) return;
    const qs = this[stateKey];
    const { checkIn, checkOut, ratePerNight, discountPercent } = qs;
    if (!checkIn || !checkOut || !ratePerNight) { previewEl.innerHTML = ''; return; }
    try {
      const nights = this.computeNightsPreview(checkIn, checkOut);
      const rate = parseFloat(ratePerNight) || 0;
      const discount = parseFloat(discountPercent) || 0;
      const subtotal = nights * rate;
      const discountAmount = Math.round(subtotal * discount) / 100;
      const total = subtotal - discountAmount;
      previewEl.innerHTML = `
        <div class="detail-row"><span class="label">Notti</span>${nights}</div>
        <div class="detail-row"><span class="label">Subtotale</span>€ ${subtotal.toFixed(2)}</div>
        ${discount > 0 ? `<div class="detail-row"><span class="label">Sconto (${discount}%)</span>− € ${discountAmount.toFixed(2)}</div>` : ''}
        <div class="detail-row" style="font-weight:700; font-size:16px; margin-top:8px;"><span class="label">Totale</span>€ ${total.toFixed(2)}</div>`;
    } catch (err) {
      previewEl.innerHTML = `<div class="detail-row" style="color:var(--red)">${this.escape(err.message)}</div>`;
    }
  }

  async generateQuoteMessageWithAI(stateKey) {
    const qs = this[stateKey];
    const { guestName, checkIn, checkOut, ratePerNight, discountPercent } = qs;
    if (!guestName || !checkIn || !checkOut || !ratePerNight) {
      this.error = 'Compila nome ospite, date e tariffa prima di generare il messaggio';
      this.render();
      return;
    }
    let nights, subtotal, discountAmount, total;
    try {
      nights = this.computeNightsPreview(checkIn, checkOut);
    } catch (e) {
      this.error = e.message;
      this.render();
      return;
    }
    const rate = parseFloat(ratePerNight) || 0;
    const discount = parseFloat(discountPercent) || 0;
    subtotal = nights * rate;
    discountAmount = Math.round(subtotal * discount) / 100;
    total = subtotal - discountAmount;

    qs.generatingMessage = true;
    this.error = null;
    this.render();
    try {
      const res = await fetch('/api/quote', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-claude-key': localStorage.getItem('claude_api_key')
        },
        body: JSON.stringify({
          action: 'message',
          originalSubject: this.selectedEmail.subject,
          originalBody: this.selectedEmail.body,
          guestName,
          checkInFmt: this.formatQuoteDate(checkIn),
          checkOutFmt: this.formatQuoteDate(checkOut),
          nights,
          ratePerNight: rate,
          discountPercent: discount,
          total: total.toFixed(2),
          season: this.suggestRatePreview(checkIn) === 150 ? 'Alta stagione' : 'Bassa stagione'
        })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('Generazione fallita (status ' + res.status + ')'));
      qs.emailMessage = data.message;
      qs.messageTouched = true;
      const msgEl = document.getElementById('quoteMessage');
      if (msgEl) msgEl.value = data.message;
    } catch (e) {
      this.error = e.message;
    }
    qs.generatingMessage = false;
    this.render();

  async shareQuotePdf(stateKey) {
    const qs = this[stateKey];
    const { checkIn, checkOut, guestName, ratePerNight, discountPercent } = qs;
    if (!checkIn || !checkOut || !guestName.trim() || !ratePerNight) {
      this.error = 'Compila nome ospite, date e tariffa prima di condividere';
      this.render();
      return;
    }
    qs.sharing = true;
    this.error = null;
    this.render();
    try {
      const res = await fetch('/api/quote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'pdf', guestName, checkIn, checkOut, ratePerNight, discountPercent })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Generazione PDF fallita');

      const byteChars = atob(data.pdfBase64);
      const byteNumbers = new Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
      const byteArray = new Uint8Array(byteNumbers);
      const file = new File([byteArray], data.filename || 'Preventivo_Domus106.pdf', { type: 'application/pdf' });

      try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: 'Preventivo Domus 106',
            text: `Preventivo di soggiorno per ${guestName}`
          });
        } else {
          throw new Error('share-unsupported');
        }
      } catch (shareErr) {
        if (shareErr.name === 'AbortError') {
        } else {
          const url = URL.createObjectURL(file);
          window.open(url, '_blank');
        }
      }
    } catch (e) {
      if (e.name !== 'AbortError') this.error = e.message;
    }
    qs.sharing = false;
    this.render();
  }

  buildICS({ guestName, checkIn, checkOut, guestEmail, total, guests, paymentStatus, notes, code }) {
    const fmtDate = (d) => d.replace(/-/g, '');
    const uid = `acme-${checkIn}-${guestName.replace(/\s+/g, '')}-${Date.now()}@domus106`;
    const dtstamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
    const paymentLabel = paymentStatus === 'saldata' ? 'Saldata'
      : paymentStatus === 'acconto versato' ? 'Acconto versato' : 'DA SALDARE';
    const paymentBadge = paymentStatus === 'saldata' ? '✅' : (paymentStatus === 'acconto versato' ? '💶' : '⚠️');
    const descParts = [];
    descParts.push('Pagamento: ' + paymentLabel);
    if (guests) descParts.push('Ospiti: ' + guests);
    if (guestEmail) descParts.push('Email ospite: ' + guestEmail);
    if (total) descParts.push('Totale: € ' + Number(total).toFixed(2));
    if (code) descParts.push('Codice: ' + code);
    if (notes) descParts.push('Note: ' + notes);
    descParts.push('Creato da ACME Inbox Manager');
    const lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Domus 106//ACME//IT',
      'CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      `UID:${uid}`,
      `DTSTAMP:${dtstamp}`,
      `DTSTART;VALUE=DATE:${fmtDate(checkIn)}`,
      `DTEND;VALUE=DATE:${fmtDate(checkOut)}`,
      `SUMMARY:${paymentBadge} ${guestName} — Domus 106 (${paymentLabel})`,
      `DESCRIPTION:${descParts.join('\\n')}`,
      'END:VEVENT',
      'END:VCALENDAR'
    ];
    return lines.join('\r\n');
  }

  async confirmBooking(stateKey) {
    const qs = this[stateKey];
    const { guestName, checkIn, checkOut } = qs;
    if (!guestName || !checkIn || !checkOut) {
      this.error = 'Compila nome ospite, check-in e check-out prima di confermare';
      this.render();
      return;
    }
    let total = null;
    try {
      const nights = this.computeNightsPreview(checkIn, checkOut);
      const rate = parseFloat(qs.ratePerNight) || 0;
      const discount = parseFloat(qs.discountPercent) || 0;
      const subtotal = nights * rate;
      const discountAmount = Math.round(subtotal * discount) / 100;
      total = subtotal - discountAmount;
    } catch (e) {}

    const hasSourceEmail = (stateKey === 'quoteState' || stateKey === 'emailBookingState') && this.selectedEmail;
    const guestEmail = hasSourceEmail
      ? this.extractEmailAddress(this.selectedEmail.from)
      : (qs.recipientEmail || '').trim();

    qs.confirming = true;
    this.error = null;
    this.render();

    // 1) Salva PRIMA sul server, mentre la pagina è ancora sicuramente in
    // primo piano — evita che l'apertura del foglio "Aggiungi a Calendario"
    // metta in pausa la pagina proprio mentre la richiesta è in volo (causa
    // del blocco su "Un attimo…"). Un timeout di sicurezza a 12s impedisce
    // comunque che il bottone resti bloccato all'infinito in caso di rete
    // lenta o assente.
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 12000);
    let savedBooking = null;
    try {
      const res = await fetch('/api/booking', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        signal: controller.signal,
        body: JSON.stringify({
          guestName, guestEmail, checkIn, checkOut, total,
          notes: qs.notes || null,
          guests: qs.guests || null,
          paymentStatus: qs.paymentStatus || 'da saldare',
          ratePerNight: qs.ratePerNight ? parseFloat(qs.ratePerNight) : null,
          discountPercent: qs.discountPercent ? parseFloat(qs.discountPercent) : null,
          sourceFrom: hasSourceEmail ? this.selectedEmail.from : null,
          sourceSubject: hasSourceEmail ? this.selectedEmail.subject : null,
          sourceBody: hasSourceEmail ? (this.selectedEmail.body || '').slice(0, 300) : null
        })
      });
      clearTimeout(timeoutId);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Salvataggio prenotazione fallito');
      savedBooking = data.booking || null;
    } catch (e) {
      clearTimeout(timeoutId);
      const msg = e.name === 'AbortError'
        ? 'Il salvataggio sta impiegando troppo tempo. Controlla la connessione e riprova.'
        : e.message;
      this.error = msg;
      qs.confirming = false;
      this.showBookingSavedConfirmation(false, null, msg);
      this.render();
      return;
    }

    // 2) Solo ORA, con il salvataggio già confermato, apriamo il foglio
    // "Aggiungi a Calendario" — se la pagina va in pausa da qui in poi non
    // ha più conseguenze, il dato è già al sicuro sul server.
    //
    // IMPORTANTE: niente più Blob generato lato client — su iOS, quando l'app
    // gira come PWA installata (aggiunta alla Home), i download via Blob
    // spesso non arrivano mai al foglio nativo "Aggiungi a Calendario" e
    // sembrano "non succedere niente". Una vera richiesta di rete verso un
    // endpoint che risponde con Content-Type: text/calendar viene invece
    // sempre riconosciuta correttamente da iOS.
    const icsParams = new URLSearchParams({
      ics: '1',
      guestName, checkIn, checkOut,
      guestEmail: guestEmail || '',
      total: total != null ? String(total) : '',
      guests: qs.guests || '',
      paymentStatus: qs.paymentStatus || 'da saldare',
      notes: qs.notes || '',
      code: (savedBooking && savedBooking.code) || ''
    });
    window.location.href = '/api/booking?' + icsParams.toString();

    qs.confirmed = true;
    qs.confirmedCode = (savedBooking && savedBooking.code) || null;
    qs.confirming = false;
    this.showBookingSavedConfirmation(true, qs.confirmedCode);
    // La mail di origine è "gestita": sparisce dal box Richieste prenotazioni,
    // esattamente come quando si invia una risposta o si scarta manualmente.
    if (hasSourceEmail) {
      this.resolvedIds.add(this.selectedEmail.id);
      this.saveResolvedIds();
      fetch('/api/mark-resolved', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ emailId: this.selectedEmail.id })
      }).catch(() => {});
      if (guestEmail) {
        fetch('/api/booking', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ deletePendingQuoteEmail: guestEmail })
        }).catch(() => {});
      }
    }
    this.render();
  }

  async sendQuote(stateKey) {
    const qs = this[stateKey];
    const { checkIn, checkOut, guestName, ratePerNight, discountPercent, emailMessage } = qs;
    if (!checkIn || !checkOut || !guestName.trim() || !ratePerNight) {
      this.error = 'Compila nome ospite, date e tariffa prima di inviare';
      this.render();
      return;
    }
    const to = stateKey === 'quoteState'
      ? this.extractEmailAddress(this.selectedEmail.from)
      : (qs.recipientEmail || '').trim();
    if (!to) {
      this.error = 'Inserisci l\'indirizzo email del destinatario';
      this.render();
      return;
    }
    qs.sending = true;
    this.error = null;
    this.render();
    try {
      const res = await fetch('/api/quote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'send', to, guestName, checkIn, checkOut, ratePerNight, discountPercent, emailMessage })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.error || ('Invio fallito (status ' + res.status + ')'));
      }
      qs.sending = false;
      qs.sent = true;
      this.showQuoteConfirmation(data.confirmed, data.total);
      // Salva il preventivo come "in sospeso" per questo cliente, così quando
      // risponde per confermare non serve ridigitare tariffa/sconto/date.
      fetch('/api/booking', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          savePendingQuote: true,
          guestEmail: to, guestName, checkIn, checkOut,
          ratePerNight: parseFloat(ratePerNight) || null,
          discountPercent: parseFloat(discountPercent) || null,
          guests: qs.guests || null,
          total: data.total,
          sourceSubject: this.selectedEmail ? this.selectedEmail.subject : null
        })
      }).catch(() => {});
    } catch (e) {
      qs.sending = false;
      this.error = e.message;
    }
    this.render();
  }

  urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  async checkPushStatus() {
    try {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      this.pushEnabled = !!sub;
    } catch (e) {}
  }

  async togglePushNotifications() {
    if (this.pushEnabled) { await this.disablePush(); } else { await this.enablePush(); }
  }

  async enablePush() {
    this.error = null;
    try {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        this.error = 'Le notifiche push non sono supportate su questo browser/dispositivo';
        this.render();
        return;
      }
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        this.error = 'Permesso notifiche negato dal telefono';
        this.render();
        return;
      }
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: this.urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
      await fetch('/api/push-subscription', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'save', subscription: sub })
      });
      this.pushEnabled = true;
    } catch (e) {
      this.error = 'Attivazione notifiche fallita: ' + e.message;
    }
    this.render();
  }

  async disablePush() {
    this.error = null;
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (sub) {
        await fetch('/api/push-subscription', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'delete', endpoint: sub.endpoint })
        });
        await sub.unsubscribe();
      }
      this.pushEnabled = false;
    } catch (e) {
      this.error = 'Disattivazione fallita: ' + e.message;
    }
    this.render();
  }

  renderBookingRows() {
    const isHistory = this.view === 'bookingHistory';
    const list = this.filteredBookings(isHistory);
    if (this.bookingsLoading) {
      return `<div class="loading"><div class="spinner"></div>Carico le prenotazioni…</div>`;
    }
    if (!list.length) {
      return `<div class="empty">${this.bookingSearchQuery ? 'Nessuna prenotazione trovata' : (isHistory ? 'Nessuna prenotazione conclusa ancora' : 'Nessuna prenotazione confermata ancora')}</div>`;
    }
    return list.map(b => {
      const checkInFmt = this.formatQuoteDate(b.check_in);
      const checkOutFmt = this.formatQuoteDate(b.check_out);
      const safeBooking = JSON.stringify(b).replace(/'/g, "&#39;");
      const status = b.status || 'confermata';
      const statusClass = 'status-' + status.replace(/\s+/g, '-');
      const payment = b.payment_status || 'da saldare';
      const paymentClass = 'chip-pay-' + payment.replace(/\s+/g, '-');
      const paymentLabel = payment === 'da saldare' ? 'Da saldare' : (payment === 'acconto versato' ? 'Acconto' : 'Saldata');
      const showQuickConclude = !isHistory && status !== 'conclusa' && status !== 'cancellata';
      const locked = isHistory && this.isBookingLocked(b);
      return `
        <div class="booking-row ${showQuickConclude ? 'has-quick-action' : ''}" onclick='app.openBookingDetail(${safeBooking})'>
          ${isHistory
            ? (locked
                ? `<button class="dismiss-btn" title="Bloccata: consultabile ma non modificabile" disabled style="opacity:0.4; cursor:default;">🔒</button>`
                : `<button class="dismiss-btn" title="Riporta tra le prenotazioni in corso" onclick='event.stopPropagation(); app.restoreBookingToActive(${b.id})'>↩</button>`)
            : ''}
          ${showQuickConclude ? `<button class="flag-btn" title="Segna come conclusa" onclick='event.stopPropagation(); app.quickConcludeBooking(${b.id})'>✓</button>` : ''}
          <div class="row-top">
            <div class="name">${this.escape(b.guest_name)}</div>
            ${b.total ? `<div class="total">€ ${Number(b.total).toFixed(2)}</div>` : ''}

          ${b.rate_per_night ? `<div class="rate-info">€ ${Number(b.rate_per_night).toFixed(2)}/notte${b.discount_percent ? ' · sconto ' + b.discount_percent + '%' : ''}</div>` : ''}

            <span class="chip ${statusClass}">${this.escape(status)}</span>

  async finalizeBookingConclusion(booking, note) {
    const combinedNotes = note ? (booking.notes ? booking.notes + '\n' + note : note) : (booking.notes || null);
    const concludedAt = new Date().toISOString();
    try {
      await fetch('/api/booking', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: booking.id, status: 'conclusa', checkoutReviewed: true, notes: combinedNotes, concludedAt })
      });
    } catch (e) {}
    const idx = this.bookings.findIndex(x => x.id === booking.id);
    if (idx !== -1) {
      this.bookings[idx].status = 'conclusa';
      this.bookings[idx].checkout_reviewed = true;
      this.bookings[idx].notes = combinedNotes;
      this.bookings[idx].concluded_at = concludedAt;
    }
    this.pendingConcludeBooking = null;
    const area = document.getElementById('bookingResultsArea');
    if (area) area.innerHTML = this.renderBookingRows(); else this.render();
    this.notifyCleaningLady(booking);
    this.showNextBookingInfo(booking);
  }

      ['da saldare', 'Da saldare'], ['acconto versato', 'Acconto versato'], ['saldata', 'Saldata']
    ].map(([v, l]) => `<option value="${v}" ${this.bookingPaymentDraft === v ? 'selected' : ''}>${l}</option>`).join('');

    return `
      <div class="list-header">
        <div class="back" onclick="app.goBack()">‹ Prenotazioni</div>
      </div>
      ${this.error ? `<div class="error-banner">${this.escape(this.error)}</div>` : ''}
      <div class="detail-card">
        <div class="code-hero">
          <div class="form-label" style="margin-bottom:0;">Codice prenotazione</div>
          <div class="code-value">${this.escape(b.code || '—')}</div>
          <div style="margin-top:8px;">
            <button class="btn btn-secondary" style="width:auto; padding:8px 16px; flex:none;" onclick="app.copyBookingCode(this, '${b.code || ''}')">Copia codice</button>
          </div>
        </div>
      </div>
      <div class="detail-card">
        <div class="detail-row"><span class="label">Ospite</span>${this.escape(b.guest_name)}</div>
        ${b.guest_email ? `<div class="detail-row"><span class="label">Email</span>${this.escape(b.guest_email)}</div>` : ''}
        <div class="detail-row"><span class="label">Check-in</span><b>${checkInFmt}</b></div>
        <div class="detail-row"><span class="label">Check-out</span><b>${checkOutFmt}</b></div>
        ${b.guests ? `<div class="detail-row"><span class="label">Ospiti</span>${b.guests}</div>` : ''}
        ${b.total ? `<div class="detail-row"><span class="label">Totale</span>€ ${Number(b.total).toFixed(2)}</div>` : ''}
        ${b.rate_per_night ? `<div class="detail-row"><span class="label">Tariffa</span>€ ${Number(b.rate_per_night).toFixed(2)}/notte</div>` : ''}
        ${b.discount_percent ? `<div class="detail-row"><span class="label">Sconto</span>${b.discount_percent}%</div>` : ''}
      </div>
      ${hasSource ? `
      <div class="section-title">Nata da questa mail</div>
      <div class="detail-card">
        <div class="source-email-box">
          ${b.source_from ? `<div>${this.escape(b.source_from)}</div>` : ''}
          ${b.source_subject ? `<div class="src-subject">${this.escape(b.source_subject)}</div>` : ''}
          ${b.source_body ? `<div class="src-body">${this.escape(b.source_body)}</div>` : ''}
        </div>
      </div>` : ''}
      <div class="section-title">Stato, pagamento e note</div>
      <div class="detail-card">
        ${locked ? `
          <div class="discrepancy-banner">🔒 Conclusa da più di 48 ore: ora è solo consultabile, non più modificabile né ripristinabile tra le prenotazioni in corso.</div>
          <div class="detail-row"><span class="label">Stato soggiorno</span>${this.escape(b.status || 'confermata')}</div>
          <div class="detail-row"><span class="label">Stato pagamento</span>${this.escape(b.payment_status || 'da saldare')}</div>
          ${b.notes ? `<div class="detail-row"><span class="label">Note</span></div><div class="original-text">${this.escape(b.notes)}</div>` : ''}
        ` : `
          <span class="form-label">Stato soggiorno</span>
          <select class="form-input" onchange="app.bookingStatusDraft = this.value">${statusOptions}</select>
          <span class="form-label">Stato pagamento</span>
          <select class="form-input" onchange="app.bookingPaymentDraft = this.value">${paymentOptions}</select>
          <span class="form-label">Note</span>
          <textarea class="form-input" style="min-height:90px; resize:vertical;" placeholder="Es. arriva in ritardo, ha chiesto una culla…" oninput="app.bookingNotesDraft = this.value">${this.escape(this.bookingNotesDraft)}</textarea>
          <button class="btn btn-primary" ${this.bookingSaving ? 'disabled' : ''} onclick="app.saveBookingDetail()">${this.bookingSaving ? 'Salvataggio…' : 'Salva modifiche'}</button>
        `}
      </div>
      ${this.bookingDetailOrigin === 'bookingHistory' ? `
      <div class="detail-card">
        <button class="btn" style="background:rgba(255,59,48,0.1); color:var(--red);" onclick="app.dismissBooking(${b.id})">🗑️ Elimina prenotazione</button>
      </div>` : ''}`;
  }

  formatDate(dateStr, full) {
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return '';
    if (full) {
      return d.toLocaleString('it-IT', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    return d.toLocaleString('it-IT', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  escape(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  render() {
    const el = document.getElementById('app');
    if (this.view === 'setup') el.innerHTML = this.renderSetup();
    else if (this.view === 'login') el.innerHTML = this.renderLogin();
    else if (this.view === 'loading' || this.view === 'init') el.innerHTML = this.renderLoading();
    else if (this.view === 'dashboard') el.innerHTML = this.renderDashboard();
    else if (this.view === 'emails') el.innerHTML = this.renderEmails();
    else if (this.view === 'detail') el.innerHTML = this.renderDetail();
    else if (this.view === 'quoteStandalone') el.innerHTML = this.renderStandaloneQuote();
    else if (this.view === 'bookingsList') el.innerHTML = this.renderBookingsList();
    else if (this.view === 'bookingHistory') el.innerHTML = this.renderBookingHistory();
    else if (this.view === 'statistics') el.innerHTML = this.renderStatistics();
    else if (this.view === 'statisticsMonth') el.innerHTML = this.renderStatisticsMonth();
    else if (this.view === 'reminders') el.innerHTML = this.renderReminders();
    else if (this.view === 'bookingDetail') el.innerHTML = this.renderBookingDetail();
    this.updateAppBadge();
  }

  updateAppBadge() {
    if (!('setAppBadge' in navigator)) return;
    try {
      const total = Object.keys(CATEGORY_META).reduce((sum, cat) => sum + this.unresolvedCount(cat), 0);
      if (total > 0) navigator.setAppBadge(total).catch(() => {});
      else if ('clearAppBadge' in navigator) navigator.clearAppBadge().catch(() => {});
    } catch (e) {}
  }
}

const app = new ACME();
app.init();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(() => app.checkPushStatus())
      .then(() => app.render())
      .catch(() => {});
  });
}
</script>
</body>
</html>

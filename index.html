<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACME</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a6ebd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ACME">
<link rel="apple-touch-icon" href="/icon-180.png?v=2">
<style>
  :root {
    --bg: #f6f4f0;
    --card: #ffffff;
    --text: #1c1c1e;
    --text-secondary: #8a8a8e;
    --accent: #0a6ebd;
    --green: #34c759;
    --red: #ff3b30;
    --orange: #ff9500;
    --border: rgba(60,60,67,0.1);
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; min-height: 100vh; }

  .topbar { padding: 8px 4px 24px; }
  .topbar .eyebrow { font-size: 13px; color: var(--text-secondary); font-weight: 500; margin-bottom: 2px; }
  .topbar h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    background: var(--card);
    border: 1px solid rgba(60,60,67,0.06);
    border-radius: var(--radius-lg);
    padding: 18px;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s ease;
    cursor: pointer;
  }
  .card:active { transform: scale(0.97); }
  .card .icon {
    width: 40px; height: 40px;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    margin-bottom: 14px;
  }
  .card .name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .card .count { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  .card .count.zero { color: var(--text-secondary); }

  .confirm-booking-box {
    background: rgba(52,199,89,0.08);
    border-radius: var(--radius-lg);
    padding: 18px;
    margin-top: 16px;
    text-align: center;
  }
  .confirm-booking-box .title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .confirm-booking-box .subtitle { font-size: 12px; color: var(--text-secondary); margin-bottom: 14px; }
  .confirm-booking-box .btn { background: var(--green); color: white; width: 100%; }
  .confirm-booking-box .btn.confirmed { background: rgba(52,199,89,0.15); color: var(--green); }
  .confirm-booking-box .code-line { font-size: 13px; color: var(--text-secondary); margin-top: 10px; }
  .confirm-booking-box .code-line b { color: var(--text); font-family: ui-monospace, SFMono-Regular, monospace; letter-spacing: 0.02em; }

  .booking-row {
    background: var(--card);
    border: 1px solid rgba(60,60,67,0.06);
    border-radius: var(--radius-md);
    padding: 14px 44px 14px 16px;
    margin-bottom: 10px;
    position: relative;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .booking-row:active { transform: scale(0.98); }
  .booking-row .name { font-size: 15px; font-weight: 600; margin-bottom: 4px; padding-right: 30px; }
  .booking-row .dates { font-size: 13px; color: var(--text-secondary); }
  .booking-row .dates b { color: var(--text); font-weight: 700; }
  .booking-row .total { font-size: 13px; color: var(--accent); font-weight: 600; margin-top: 4px; }
  .booking-row .code-tag { font-size: 11px; color: var(--text-secondary); font-family: ui-monospace, SFMono-Regular, monospace; margin-top: 6px; letter-spacing: 0.02em; }
  .booking-row .status-tag { display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 100px; margin-top: 6px; }
  .status-confermata { background: rgba(52,199,89,0.12); color: var(--green); }
  .status-in-arrivo { background: rgba(10,110,189,0.12); color: var(--accent); }
  .status-conclusa { background: rgba(142,142,147,0.12); color: var(--text-secondary); }
  .status-cancellata { background: rgba(255,59,48,0.12); color: var(--red); }
  .booking-row .dismiss-btn { top: 12px; right: 12px; }

  .search-bar { position: relative; margin-bottom: 16px; }
  .search-bar input {
    width: 100%; padding: 12px 14px; border-radius: var(--radius-md); border: 1px solid var(--border);
    font-size: 15px; background: var(--card); color: var(--text);
  }

  .guest-selector { display: flex; gap: 8px; margin-bottom: 12px; }
  .guest-btn {
    flex: 1; padding: 11px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--bg); color: var(--text); text-align: center; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .guest-btn:active { opacity: 0.7; }
  .guest-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

  .hero-card {
    background: var(--card);
    border: 1px solid rgba(60,60,67,0.06);
    border-radius: var(--radius-lg);
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .hero-card:active { transform: scale(0.98); }
  .hero-card .hero-icon {
    width: 52px; height: 52px; flex-shrink: 0;
    border-radius: var(--radius-sm);
    background: rgba(142,142,147,0.12);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .hero-card .hero-text { flex: 1; }
  .hero-card .name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .hero-card .count { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-secondary); }
  .hero-card.has-items {
    background: rgba(255,59,48,0.08);
    border-color: transparent;
    box-shadow: 0 4px 16px rgba(255,59,48,0.08);
  }
  .hero-card.has-items .hero-icon { background: rgba(255,59,48,0.14); }
  .hero-card.has-items .count { color: var(--red); }

  .icon.red { background: rgba(255,59,48,0.12); }
  .icon.blue { background: rgba(10,110,189,0.12); }
  .icon.orange { background: rgba(255,149,0,0.12); }
  .icon.purple { background: rgba(175,82,222,0.12); }
  .icon.teal { background: rgba(90,200,250,0.12); }
  .icon.green { background: rgba(52,199,89,0.12); }
  .icon.gray { background: rgba(142,142,147,0.12); }

  .refresh-row { display: flex; justify-content: space-between; align-items: center; margin: 24px 0 4px; padding: 0 4px; }
  .refresh-row .status { font-size: 13px; color: var(--text-secondary); }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--card); border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; cursor: pointer;
  }

  .list-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .back { font-size: 17px; color: var(--accent); font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .list-title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }

  .email-row {
    background: var(--card);
    border-radius: var(--radius-md);
    padding: 14px 44px 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: transform 0.15s ease;
    position: relative;
  }
  .email-row:active { transform: scale(0.98); }
  .email-row .from { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .email-date { font-size: 12px; color: var(--text-secondary); white-space: nowrap; flex-shrink: 0; }
  .email-row .subject { font-size: 14px; color: var(--text); margin-bottom: 4px; opacity: 0.85; }
  .email-row .preview { font-size: 13px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .email-row .ready-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--green); font-weight: 600; margin-top: 6px; }
  .dismiss-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: rgba(60,60,67,0.08);
    color: var(--text-secondary);
    border: none;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .dismiss-btn:active { background: rgba(60,60,67,0.16); }

  .detail-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 16px;
  }
  .detail-row { font-size: 14px; margin-bottom: 6px; }
  .detail-row .label { color: var(--text-secondary); margin-right: 6px; }
  .pill-row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .pill {
    background: rgba(10,110,189,0.1); color: var(--accent);
    font-size: 12px; font-weight: 600;
    padding: 5px 10px; border-radius: 100px;
  }
  .pill.tone-urgente, .pill.tone-arrabbiato { background: rgba(255,59,48,0.1); color: var(--red); }

  .section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.02em; margin: 20px 0 10px 4px; }
  .original-text {
    font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    color: var(--text); opacity: 0.85;
  }

  .response-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 12px;
  }
  .response-card .opt-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .opt-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .opt-dot.green { background: var(--green); }
  .opt-dot.orange { background: var(--orange); }
  .opt-dot.red { background: var(--red); }
  .opt-dot.gray { background: var(--text-secondary); }
  .discrepancy-banner {
    background: rgba(255,149,0,0.12); color: var(--orange);
    padding: 12px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px; line-height: 1.45;
  }
  .discrepancy-banner b { font-weight: 700; }
  .response-card .body-text {
    width: 100%;
    font-family: inherit;
    font-size: 14px; line-height: 1.5; white-space: pre-wrap;
    text-align: left;
    background: var(--bg); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 12px;
    border: 1px solid transparent;
    resize: vertical;
    min-height: 110px;
    color: var(--text);
  }
  .response-card .body-text:focus { outline: none; border-color: var(--accent); background: var(--card); }
  .response-card .body-text:disabled { opacity: 0.7; }
  .sent-confirm {
    background: rgba(52,199,89,0.12); color: var(--green);
    padding: 12px; border-radius: var(--radius-sm); font-size: 13px; margin-top: 10px;
  }
  .sent-confirm a { color: var(--green); font-weight: 600; text-decoration: underline; }
  .sent-confirm .pending { color: var(--text-secondary); font-weight: 500; }

  .confirm-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .confirm-overlay.hidden { display: none; }
  .confirm-box {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 28px 24px;
    max-width: 320px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  .confirm-box .icon { font-size: 42px; margin-bottom: 12px; }
  .confirm-box h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .confirm-box p { font-size: 14px; color: var(--text-secondary); margin-bottom: 22px; line-height: 1.45; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row + .btn-row { margin-top: 8px; }
  .btn {
    flex: 1; border: none; border-radius: var(--radius-sm); padding: 11px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.7; }
  .btn:disabled { opacity: 0.4; }
  .btn-send { background: var(--green); color: white; }
  .btn-send.sent { background: rgba(52,199,89,0.15); color: var(--green); }
  .btn-reject { background: rgba(255,59,48,0.1); color: var(--red); }
  .btn-secondary { background: rgba(10,110,189,0.1); color: var(--accent); }

  .empty, .loading, .login-box { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
  .spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid rgba(0,0,0,0.08); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .login-box h2 { color: var(--text); font-size: 20px; margin-bottom: 8px; }
  .login-box p { font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
  .btn-primary {
    background: var(--accent); color: white; border: none;
    padding: 14px; border-radius: var(--radius-md); font-size: 16px; font-weight: 600;
    width: 100%; cursor: pointer;
  }

  input.key-input {
    width: 100%; padding: 14px; border-radius: var(--radius-md); border: 1px solid var(--border);
    font-size: 15px; font-family: monospace; margin-bottom: 12px; background: var(--card);
  }
  .form-input {
    width: 100%; padding: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    font-size: 14px; font-family: inherit; background: var(--bg); color: var(--text); margin-bottom: 10px;
  }
  select.form-input { -webkit-appearance: none; appearance: none; }
  .form-label { font-size: 12px; color: var(--text-secondary); font-weight: 600; margin-bottom: 4px; display: block; }
  .quote-preview { background: var(--bg); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 12px; }
  .quote-preview .detail-row:last-child { margin-bottom: 0; }

  .error-banner {
    background: rgba(255,59,48,0.1); color: var(--red);
    padding: 12px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px;
  }

  .code-hero { text-align: center; padding: 6px 0 4px; }
  .code-hero .code-value {
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 22px; font-weight: 700; letter-spacing: 0.03em;
    background: rgba(10,110,189,0.08); color: var(--accent);
    padding: 10px 16px; border-radius: var(--radius-sm); display: inline-block; margin-top: 6px;
  }
  .source-email-box {
    background: var(--bg); border-radius: var(--radius-sm); padding: 12px; margin-top: 4px;
    font-size: 13px; line-height: 1.5;
  }
  .source-email-box .src-subject { font-weight: 600; margin-bottom: 4px; }
  .source-email-box .src-body { color: var(--text-secondary); }

  .settings-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    overflow: hidden;
    margin-top: 20px;
    border: 1px solid rgba(60,60,67,0.06);
  }
  .settings-row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer; }
  .settings-row:active { background: var(--bg); }
  .settings-row + .settings-row { border-top: 1px solid rgba(60,60,67,0.08); }
  .settings-row .settings-icon { font-size: 17px; width: 22px; text-align: center; flex-shrink: 0; }
  .settings-row .settings-label { flex: 1; font-size: 15px; color: var(--text); }
  .settings-row .settings-chevron { color: var(--text-secondary); font-size: 16px; }
</style>
</head>
<body>
  <div class="container" id="app"></div>
  <div id="confirmOverlay" class="confirm-overlay hidden"></div>

<script>
const CATEGORY_META = {
  'Lamentela':               { icon: '⚠️', color: 'red' },
  'Prenotazione':            { icon: '📅', color: 'blue' },
  'Problema tecnico':        { icon: '🔧', color: 'orange' },
  'Fatturazione':            { icon: '💳', color: 'purple' },
  'Richiesta informazioni':  { icon: '❓', color: 'teal' },
  'Complimento':             { icon: '⭐', color: 'green' },
  'Cancellazione':           { icon: '❌', color: 'gray' }
};

const BOOKING_STATUSES = ['confermata', 'in arrivo', 'conclusa', 'cancellata'];

const VAPID_PUBLIC_KEY = "BAUiDQRLOp24qASDBM3nbZp39PPaZdfaCSC0Fcx9u79ervwtSp7apDxmMo_aV-V-4qVXOH7wB4ck598mmBgJcSU";

class ACME {
  constructor() {
    this.view = 'init';
    this.byCategory = {};
    this.selectedCategory = null;
    this.selectedEmail = null;
    this.error = null;
    this.lastUpdated = null;
    this.resolvedIds = new Set(JSON.parse(localStorage.getItem('acme_resolved_ids') || '[]'));
    this.sendingIdx = null;
    this.quoteState = this.emptyQuoteState();
    this.standaloneQuoteState = this.emptyQuoteState();
    this.emailBookingState = this.emptyQuoteState();
    this.pushEnabled = false;
    this.bookings = [];
    this.bookingsLoading = false;
    this.bookingSearchQuery = '';
    this.selectedBooking = null;
    this.bookingNotesDraft = '';
    this.bookingStatusDraft = '';
    this.bookingSaving = false;
  }

  emptyQuoteState() {
    return {
      open: false, checkIn: '', checkOut: '', guestName: '', recipientEmail: '',
      ratePerNight: '', discountPercent: '', rateTouched: false, discountTouched: false,
      emailMessage: '', messageTouched: false, generatingMessage: false, sharing: false,
      notes: '', guests: 1,
      confirming: false, confirmed: false, confirmedCode: null,
      sending: false, sent: false
    };
  }

  openStandaloneQuote() {
    this.standaloneQuoteState = this.emptyQuoteState();
    this.view = 'quoteStandalone';
    this.render();
  }

  async openBookingsList() {
    this.bookingSearchQuery = '';
    this.view = 'bookingsList';
    this.render();
    await this.loadBookings();
  }

  async loadBookings() {
    this.bookingsLoading = true;
    this.render();
    try {
      const res = await fetch('/api/booking');
      const data = await res.json().catch(() => ({}));
      if (res.ok) this.bookings = data.bookings || [];
    } catch (e) {
      this.error = 'Impossibile caricare le prenotazioni';
    }
    this.bookingsLoading = false;
    this.render();
  }

  updateBookingSearch(value) {
    this.bookingSearchQuery = value;
    const area = document.getElementById('bookingResultsArea');
    if (area) {
      area.innerHTML = this.renderBookingRows();
    } else {
      this.render();
    }
  }

  filteredBookings() {
    const q = this.bookingSearchQuery.trim().toLowerCase();
    if (!q) return this.bookings;
    return this.bookings.filter(b =>
      (b.code || '').toLowerCase().includes(q) ||
      (b.guest_name || '').toLowerCase().includes(q)
    );
  }

  openBookingDetail(booking) {
    this.selectedBooking = booking;
    this.bookingNotesDraft = booking.notes || '';
    this.bookingStatusDraft = booking.status || 'confermata';
    this.view = 'bookingDetail';
    this.render();
  }

  async saveBookingDetail() {
    const b = this.selectedBooking;
    this.bookingSaving = true;
    this.error = null;
    this.render();
    try {
      const res = await fetch('/api/booking', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: b.id, notes: this.bookingNotesDraft, status: this.bookingStatusDraft })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Salvataggio fallito');
      this.selectedBooking = data.booking;
      const idx = this.bookings.findIndex(x => x.id === b.id);
      if (idx !== -1) this.bookings[idx] = data.booking;
    } catch (e) {
      this.error = e.message;
    }
    this.bookingSaving = false;
    this.render();
  }

  copyBookingCode(btn, code) {
    const original = btn.textContent;
    navigator.clipboard.writeText(code).then(() => {
      btn.textContent = '✓ Copiato';
      setTimeout(() => { btn.textContent = original; }, 1500);
    }).catch(() => {});
  }

  dismissBooking(id) {
    const booking = this.bookings.find(b => b.id === id);
    const name = booking ? booking.guest_name : 'questa prenotazione';
    this.showConfirmDialog({
      title: 'Eliminare la prenotazione?',
      desc: `${name} verrà rimossa definitivamente dall'archivio${booking && booking.code ? ' (codice ' + booking.code + ')' : ''}. Non è recuperabile.`,
      confirmLabel: 'Elimina',
      onConfirm: async () => {
        try {
          await fetch('/api/booking', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
          });
        } catch (e) {}
        this.bookings = this.bookings.filter(b => b.id !== id);
        this.render();
      }
    });
  }

  saveResolvedIds() {
    localStorage.setItem('acme_resolved_ids', JSON.stringify([...this.resolvedIds]));
  }

  unresolvedCount(cat) {
    const emails = this.byCategory[cat] || [];
    return emails.filter(e => !this.resolvedIds.has(e.id) && !e.resolved).length;
  }

  async init() {
    const params = new URLSearchParams(window.location.search);
    const debugScope = params.get('debug_scope');
    if (debugScope) {
      window.history.replaceState({}, '', window.location.pathname);
    }
    const key = localStorage.getItem('claude_api_key');
    if (!key) { this.view = 'setup'; this.render(); return; }
    await this.loadEmails();
    if (debugScope) {
      this.error = 'DEBUG scope ricevuto da Google: ' + decodeURIComponent(debugScope);
      this.render();
    }
    setInterval(() => this.silentRefresh(), 5 * 60 * 1000);
  }

  async silentRefresh() {
    if (this.view !== 'dashboard') return;
    try {
      const res = await fetch('/api/emails-analyzed', {
        headers: { 'x-claude-key': localStorage.getItem('claude_api_key') }
      });
      if (!res.ok) return;
      const data = await res.json();
      this.byCategory = data.byCategory || {};
      this.lastUpdated = new Date();
      if (this.view === 'dashboard') this.render();
    } catch (e) {}
  }

  saveKey() {
    const val = document.getElementById('keyInput').value.trim();
    if (!val) { alert('Inserisci una API Key valida'); return; }
    localStorage.setItem('claude_api_key', val);
    this.loadEmails();
  }

  async loadEmails() {
    this.view = 'loading';
    this.error = null;
    this.render();
    try {
      const res = await fetch('/api/emails-analyzed', {
        headers: { 'x-claude-key': localStorage.getItem('claude_api_key') }
      });
      if (res.status === 401) { this.view = 'login'; this.render(); return; }
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error || 'Errore nel caricamento');
      }
      const data = await res.json();
      this.byCategory = data.byCategory || {};
      this.lastUpdated = new Date();
      this.view = 'dashboard';
    } catch (e) {
      this.error = e.message;
      this.view = 'dashboard';
    }
    this.render();
  }

  async loginWithGmail() {
    const res = await fetch('/api/auth');
    const data = await res.json();
    window.location.href = data.authUrl;
  }

  openCategory(cat) {
    this.selectedCategory = cat;
    this.view = 'emails';
    this.render();
  }

  openEmail(email) {
    this.selectedEmail = email;
    this.quoteState = this.emptyQuoteState();
    this.emailBookingState = this.emptyQuoteState();
    this.emailBookingState.guestName = this.extractGuestName(email.from);
    this.view = 'detail';
    this.render();
  }

  async sendResponse(idx) {
    const email = this.selectedEmail;
    const respItem = email.responses[idx];
    const resp = (respItem && typeof respItem === 'object') ? respItem.text : respItem;
    const to = (email.from.match(/[\w.-]+@[\w.-]+\.\w+/) || [])[0] || '';
    const subject = 'RE: ' + email.subject;
    this.sendingIdx = idx;
    this.error = null;
    this.render();
    try {
      const res = await fetch('/api/send-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ to, subject, body: resp })
      });
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error || ('Invio fallito (status ' + res.status + ')'));
      }
      const data = await res.json();
      email.sentIdx = idx;
      email.sentThreadId = data.threadId || null;
      email.sentConfirmed = !!data.confirmed;
      this.resolvedIds.add(email.id);
      this.saveResolvedIds();
      this.showSendConfirmation(data.confirmed);
      fetch('/api/mark-resolved', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ emailId: email.id })
      }).catch(() => {});
    } catch (e) {
      this.error = e.message;
    }
    this.sendingIdx = null;
    this.render();
  }

  showSendConfirmation(confirmed) {
    const overlay = document.getElementById('confirmOverlay');
    const icon = confirmed ? '✅' : '⚠️';
    const title = confirmed ? 'Email inviata e confermata' : 'Email inviata';
    const desc = confirmed
      ? 'Verificato direttamente su Gmail: il messaggio risulta davvero nella posta inviata.'
      : 'Il messaggio è stato inviato, ma la verifica automatica su Gmail non è riuscita in questo momento. Puoi controllare manualmente se vuoi esserne certo.';
    overlay.innerHTML = `
      <div class="confirm-box">
        <div class="icon">${icon}</div>
        <h3>${title}</h3>
        <p>${desc}</p>
        <button class="btn btn-primary" onclick="app.closeConfirmModal()">OK</button>
      </div>`;
    overlay.classList.remove('hidden');
  }

  closeConfirmModal() {
    document.getElementById('confirmOverlay').classList.add('hidden');
  }

  // Dialog di conferma generico usato prima di ogni cancellazione (✕): mostra
  // Annulla + un bottone d'azione rosso, ed esegue onConfirm solo se confermato.
  showConfirmDialog({ title, desc, confirmLabel = 'Elimina', onConfirm }) {
    this._pendingConfirmAction = onConfirm;
    const overlay = document.getElementById('confirmOverlay');
    overlay.innerHTML = `
      <div class="confirm-box">
        <div class="icon">🗑️</div>
        <h3>${title}</h3>
        <p>${desc}</p>
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="app.cancelConfirmDialog()">Annulla</button>
          <button class="btn" style="background:var(--red); color:white;" onclick="app.runConfirmedAction()">${confirmLabel}</button>
        </div>
      </div>`;
    overlay.classList.remove('hidden');
  }

  cancelConfirmDialog() {
    this._pendingConfirmAction = null;
    document.getElementById('confirmOverlay').classList.add('hidden');
  }

  runConfirmedAction() {
    const action = this._pendingConfirmAction;
    this._pendingConfirmAction = null;
    document.getElementById('confirmOverlay').classList.add('hidden');
    if (action) action();
  }

  extractEmailAddress(fromStr) {
    return (fromStr.match(/[\w.-]+@[\w.-]+\.\w+/) || [])[0] || '';
  }

  extractGuestName(fromStr) {
    const match = fromStr.match(/^"?([^"<]+)"?\s*<[^>]+>/);
    if (match) return match[1].trim();
    return this.extractEmailAddress(fromStr).split('@')[0] || fromStr;
  }

  toggleQuoteForm() {
    if (!this.quoteState.open && !this.quoteState.guestName) {
      this.quoteState.guestName = this.extractGuestName(this.selectedEmail.from);
    }
    this.quoteState.open = !this.quoteState.open;
    this.render();
  }

  selectGuests(stateKey, n) {
    this[stateKey].guests = n;
    this.render();
  }

  renderGuestSelector(stateKey, current) {
    const opts = [1, 2, 3, 4];
    return `
      <span class="form-label">Numero ospiti</span>
      <div class="guest-selector">
        ${opts.map(n => `<div class="guest-btn ${current === n ? 'active' : ''}" onclick="app.selectGuests('${stateKey}', ${n})">${n}</div>`).join('')}
      </div>`;
  }

  updateQuoteField(stateKey, field, value) {
    const qs = this[stateKey];
    qs[field] = value;
    if (field === 'ratePerNight') qs.rateTouched = true;
    if (field === 'discountPercent') qs.discountTouched = true;
    if (field === 'emailMessage') qs.messageTouched = true;
    if (field === 'checkIn' || field === 'checkOut') this.applySuggestedDefaults(stateKey);
    if (field !== 'emailMessage' && !qs.messageTouched) {
      qs.emailMessage = this.buildDefaultQuoteMessage(stateKey);
      const msgEl = document.getElementById(stateKey === 'quoteState' ? 'quoteMessage' : 'standaloneQuoteMessage');
      if (msgEl) msgEl.value = qs.emailMessage;
    }
    this.refreshQuotePreview(stateKey);
  }

  formatQuoteDate(isoDateStr) {
    if (!isoDateStr) return '';
    const d = new Date(isoDateStr + 'T00:00:00');
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('it-IT', { day: '2-digit', month: 'long', year: 'numeric' });
  }

  buildDefaultQuoteMessage(stateKey) {
    const qs = this[stateKey];
    const { guestName, checkIn, checkOut, ratePerNight, discountPercent } = qs;
    if (!checkIn || !checkOut || !guestName || !ratePerNight) return '';
    let nights;
    try { nights = this.computeNightsPreview(checkIn, checkOut); } catch (e) { return ''; }
    const rate = parseFloat(ratePerNight) || 0;
    const discount = parseFloat(discountPercent) || 0;
    const subtotal = nights * rate;
    const discountAmount = Math.round(subtotal * discount) / 100;
    const total = subtotal - discountAmount;
    const checkInFmt = this.formatQuoteDate(checkIn);
    const checkOutFmt = this.formatQuoteDate(checkOut);
    return `Gentile ${guestName},

in allegato trova il preventivo richiesto per il Suo soggiorno presso Domus 106 dal ${checkInFmt} al ${checkOutFmt} (${nights} nott${nights === 1 ? 'e' : 'i'}).

Totale soggiorno: € ${total.toFixed(2)}${discount > 0 ? ` (sconto ${discount}% per soggiorni lunghi già applicato)` : ''}

Resto a disposizione per qualsiasi chiarimento.

Cordiali saluti,
Domus 106`;
  }

  computeNightsPreview(checkInStr, checkOutStr) {
    const checkIn = new Date(checkInStr + 'T00:00:00');
    const checkOut = new Date(checkOutStr + 'T00:00:00');
    const nights = Math.round((checkOut - checkIn) / 86400000);
    if (!(nights > 0)) throw new Error('Il check-out deve essere dopo il check-in');
    return nights;
  }

  suggestRatePreview(checkInStr) {
    const checkIn = new Date(checkInStr + 'T00:00:00');
    const month = checkIn.getMonth() + 1;
    return (month >= 6 && month <= 9) ? 150 : 80;
  }

  applySuggestedDefaults(stateKey) {
    const qs = this[stateKey];
    const { checkIn, checkOut } = qs;
    if (!checkIn || !checkOut) return;
    try {
      const nights = this.computeNightsPreview(checkIn, checkOut);
      if (!qs.rateTouched) qs.ratePerNight = String(this.suggestRatePreview(checkIn));
      if (!qs.discountTouched) qs.discountPercent = String(nights >= 30 ? 30 : (nights >= 7 ? 15 : 0));
    } catch (e) {}
  }

  refreshQuotePreview(stateKey) {
    const previewEl = document.getElementById(stateKey === 'quoteState' ? 'quotePreview' : 'standaloneQuotePreview');
    if (!previewEl) return;
    const qs = this[stateKey];
    const { checkIn, checkOut, ratePerNight, discountPercent } = qs;
    if (!checkIn || !checkOut || !ratePerNight) { previewEl.innerHTML = ''; return; }
    try {
      const nights = this.computeNightsPreview(checkIn, checkOut);
      const rate = parseFloat(ratePerNight) || 0;
      const discount = parseFloat(discountPercent) || 0;
      const subtotal = nights * rate;
      const discountAmount = Math.round(subtotal * discount) / 100;
      const total = subtotal - discountAmount;
      previewEl.innerHTML = `
        <div class="detail-row"><span class="label">Notti</span>${nights}</div>
        <div class="detail-row"><span class="label">Subtotale</span>€ ${subtotal.toFixed(2)}</div>
        ${discount > 0 ? `<div class="detail-row"><span class="label">Sconto (${discount}%)</span>− € ${discountAmount.toFixed(2)}</div>` : ''}
        <div class="detail-row" style="font-weight:700; font-size:16px; margin-top:8px;"><span class="label">Totale</span>€ ${total.toFixed(2)}</div>`;
    } catch (err) {
      previewEl.innerHTML = `<div class="detail-row" style="color:var(--red)">${this.escape(err.message)}</div>`;
    }
  }

  async generateQuoteMessageWithAI(stateKey) {
    const qs = this[stateKey];
    const { guestName, checkIn, checkOut, ratePerNight, discountPercent } = qs;
    if (!guestName || !checkIn || !checkOut || !ratePerNight) {
      this.error = 'Compila nome ospite, date e tariffa prima di generare il messaggio';
      this.render();
      return;
    }
    let nights, subtotal, discountAmount, total;
    try {
      nights = this.computeNightsPreview(checkIn, checkOut);
    } catch (e) {
      this.error = e.message;
      this.render();
      return;
    }
    const rate = parseFloat(ratePerNight) || 0;
    const discount = parseFloat(discountPercent) || 0;
    subtotal = nights * rate;
    discountAmount = Math.round(subtotal * discount) / 100;
    total = subtotal - discountAmount;

    qs.generatingMessage = true;
    this.error = null;
    this.render();
    try {
      const res = await fetch('/api/quote', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-claude-key': localStorage.getItem('claude_api_key')
        },
        body: JSON.stringify({
          action: 'message',
          originalSubject: this.selectedEmail.subject,
          originalBody: this.selectedEmail.body,
          guestName,
          checkInFmt: this.formatQuoteDate(checkIn),
          checkOutFmt: this.formatQuoteDate(checkOut),
          nights,
          ratePerNight: rate,
          discountPercent: discount,
          total: total.toFixed(2),
          season: this.suggestRatePreview(checkIn) === 150 ? 'Alta stagione' : 'Bassa stagione'
        })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('Generazione fallita (status ' + res.status + ')'));
      qs.emailMessage = data.message;
      qs.messageTouched = true;
      const msgEl = document.getElementById('quoteMessage');
      if (msgEl) msgEl.value = data.message;
    } catch (e) {
      this.error = e.message;
    }
    qs.generatingMessage = false;
    this.render();
  }

  async shareQuotePdf(stateKey) {
    const qs = this[stateKey];
    const { checkIn, checkOut, guestName, ratePerNight, discountPercent } = qs;
    if (!checkIn || !checkOut || !guestName.trim() || !ratePerNight) {
      this.error = 'Compila nome ospite, date e tariffa prima di condividere';
      this.render();
      return;
    }
    qs.sharing = true;
    this.error = null;
    this.render();
    try {
      const res = await fetch('/api/quote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'pdf', guestName, checkIn, checkOut, ratePerNight, discountPercent })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Generazione PDF fallita');

      const byteChars = atob(data.pdfBase64);
      const byteNumbers = new Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
      const byteArray = new Uint8Array(byteNumbers);
      const file = new File([byteArray], data.filename || 'Preventivo_Domus106.pdf', { type: 'application/pdf' });

      try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: 'Preventivo Domus 106',
            text: `Preventivo di soggiorno per ${guestName}`
          });
        } else {
          throw new Error('share-unsupported');
        }
      } catch (shareErr) {
        if (shareErr.name === 'AbortError') {
        } else {
          const url = URL.createObjectURL(file);
          window.open(url, '_blank');
        }
      }
    } catch (e) {
      if (e.name !== 'AbortError') this.error = e.message;
    }
    qs.sharing = false;
    this.render();
  }

  buildICS({ guestName, checkIn, checkOut, guestEmail, total }) {
    const fmtDate = (d) => d.replace(/-/g, '');
    const uid = `acme-${checkIn}-${guestName.replace(/\s+/g, '')}-${Date.now()}@domus106`;
    const dtstamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
    const descParts = [];
    if (guestEmail) descParts.push('Email ospite: ' + guestEmail);
    if (total) descParts.push('Totale: € ' + Number(total).toFixed(2));
    descParts.push('Creato da ACME Inbox Manager');
    const lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Domus 106//ACME//IT',
      'CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      `UID:${uid}`,
      `DTSTAMP:${dtstamp}`,
      `DTSTART;VALUE=DATE:${fmtDate(checkIn)}`,
      `DTEND;VALUE=DATE:${fmtDate(checkOut)}`,
      `SUMMARY:Prenotazione: ${guestName} — Domus 106`,
      `DESCRIPTION:${descParts.join('\\n')}`,
      'END:VEVENT',
      'END:VCALENDAR'
    ];
    return lines.join('\r\n');
  }

  async confirmBooking(stateKey) {
    const qs = this[stateKey];
    const { guestName, checkIn, checkOut } = qs;
    if (!guestName || !checkIn || !checkOut) {
      this.error = 'Compila nome ospite, check-in e check-out prima di confermare';
      this.render();
      return;
    }
    let total = null;
    try {
      const nights = this.computeNightsPreview(checkIn, checkOut);
      const rate = parseFloat(qs.ratePerNight) || 0;
      const discount = parseFloat(qs.discountPercent) || 0;
      const subtotal = nights * rate;
      const discountAmount = Math.round(subtotal * discount) / 100;
      total = subtotal - discountAmount;
    } catch (e) {}

    const hasSourceEmail = (stateKey === 'quoteState' || stateKey === 'emailBookingState') && this.selectedEmail;
    const guestEmail = hasSourceEmail
      ? this.extractEmailAddress(this.selectedEmail.from)
      : (qs.recipientEmail || '').trim();

    const icsContent = this.buildICS({ guestName, checkIn, checkOut, guestEmail, total });
    const blob = new Blob([icsContent], { type: 'text/calendar' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    qs.confirming = true;
    this.error = null;
    this.render();
    try {
      // keepalive: true — la richiesta deve arrivare a destinazione anche se
      // iOS mette la pagina in background subito dopo aver aperto il foglio
      // "Aggiungi a Calendario" (altrimenti la fetch può restare sospesa e
      // sembrare che non sia successo nulla, pur avendo salvato più tardi
      // — o mai).
      const res = await fetch('/api/booking', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        keepalive: true,
        body: JSON.stringify({
          guestName, guestEmail, checkIn, checkOut, total,
          notes: qs.notes || null,
          guests: qs.guests || null,
          sourceFrom: hasSourceEmail ? this.selectedEmail.from : null,
          sourceSubject: hasSourceEmail ? this.selectedEmail.subject : null,
          sourceBody: hasSourceEmail ? (this.selectedEmail.body || '').slice(0, 300) : null
        })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Salvataggio prenotazione fallito');

      qs.confirmed = true;
      qs.confirmedCode = (data.booking && data.booking.code) || null;
      this.showBookingSavedConfirmation(true, qs.confirmedCode);
    } catch (e) {
      this.error = e.message;
      this.showBookingSavedConfirmation(false, null, e.message);
    }
    qs.confirming = false;
    this.render();
  }

  showBookingSavedConfirmation(success, code, errorMsg) {
    const overlay = document.getElementById('confirmOverlay');
    const icon = success ? '✅' : '⚠️';
    const title = success ? 'Prenotazione salvata' : 'Salvataggio non riuscito';
    const desc = success
      ? (code ? `Codice prenotazione: <b>${code}</b>. La trovi anche in "Prenotazioni confermate".` : 'Salvata nell\'archivio interno.')
      : (this.escape(errorMsg || '') || 'Controlla la connessione e riprova.');
    overlay.innerHTML = `
      <div class="confirm-box">
        <div class="icon">${icon}</div>
        <h3>${title}</h3>
        <p>${desc}</p>
        <button class="btn btn-primary" onclick="app.closeConfirmModal()">OK</button>
      </div>`;
    overlay.classList.remove('hidden');
  }

  async sendQuote(stateKey) {
    const qs = this[stateKey];
    const { checkIn, checkOut, guestName, ratePerNight, discountPercent, emailMessage } = qs;
    if (!checkIn || !checkOut || !guestName.trim() || !ratePerNight) {
      this.error = 'Compila nome ospite, date e tariffa prima di inviare';
      this.render();
      return;
    }
    const to = stateKey === 'quoteState'
      ? this.extractEmailAddress(this.selectedEmail.from)
      : (qs.recipientEmail || '').trim();
    if (!to) {
      this.error = 'Inserisci l\'indirizzo email del destinatario';
      this.render();
      return;
    }
    qs.sending = true;
    this.error = null;
    this.render();
    try {
      const res = await fetch('/api/quote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'send', to, guestName, checkIn, checkOut, ratePerNight, discountPercent, emailMessage })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.error || ('Invio fallito (status ' + res.status + ')'));
      }
      qs.sending = false;
      qs.sent = true;
      this.showQuoteConfirmation(data.confirmed, data.total);
    } catch (e) {
      qs.sending = false;
      this.error = e.message;
    }
    this.render();
  }

  showQuoteConfirmation(confirmed, total) {
    const overlay = document.getElementById('confirmOverlay');
    const icon = confirmed ? '✅' : '⚠️';
    const title = confirmed ? 'Preventivo inviato e confermato' : 'Preventivo inviato';
    const totalText = typeof total === 'number' ? `Totale preventivato: € ${total.toFixed(2)}. ` : '';
    const desc = confirmed
      ? totalText + 'Il PDF è stato consegnato e verificato direttamente su Gmail.'
      : totalText + 'Il PDF è stato inviato, ma la verifica automatica su Gmail non è riuscita in questo momento.';
    overlay.innerHTML = `
      <div class="confirm-box">
        <div class="icon">${icon}</div>
        <h3>${title}</h3>
        <p>${desc}</p>
        <button class="btn btn-primary" onclick="app.closeConfirmModal()">OK</button>
      </div>`;
    overlay.classList.remove('hidden');
  }

  updateResponseText(idx, value) {
    const r = this.selectedEmail.responses[idx];
    if (r && typeof r === 'object') {
      r.text = value;
    } else {
      this.selectedEmail.responses[idx] = value;
    }
  }

  dismissEmail(email) {
    this.showConfirmDialog({
      title: 'Rimuovere questa email?',
      desc: 'Sparirà dalla lista di ACME. Resta comunque nella tua casella Gmail, quindi puoi sempre ritrovarla lì.',
      confirmLabel: 'Rimuovi',
      onConfirm: () => {
        this.resolvedIds.add(email.id);
        this.saveResolvedIds();
        fetch('/api/mark-resolved', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ emailId: email.id })
        }).catch(() => {});
        this.render();
      }
    });
  }

  async reanalyzeEmail() {
    const email = this.selectedEmail;
    this.view = 'analyzing';
    this.error = null;
    this.render();
    try {
      const res = await fetch('/api/analyze-single', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-claude-key': localStorage.getItem('claude_api_key')
        },
        body: JSON.stringify({ from: email.from, subject: email.subject, body: email.body })
      });
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error || 'Rianalisi fallita');
      }
      const data = await res.json();
      email.category = data.category;
      email.tone = data.tone;
      email.discrepancy = data.discrepancy || null;
      email.responses = data.responses;
      email.analysisError = false;
      Object.keys(this.byCategory).forEach(cat => {
        const idx = (this.byCategory[cat] || []).findIndex(e => e.id === email.id);
        if (idx !== -1) this.byCategory[cat][idx] = email;
      });
    } catch (e) {
      this.error = e.message;
    }
    this.view = 'detail';
    this.render();
  }

  rejectResponse(idx) {
    this.selectedEmail.responses.splice(idx, 1);
    this.render();
  }

  goBack() {
    if (this.view === 'detail') { this.view = 'emails'; this.selectedEmail = null; }
    else if (this.view === 'emails') { this.view = 'dashboard'; this.selectedCategory = null; }
    else if (this.view === 'quoteStandalone') { this.view = 'dashboard'; }
    else if (this.view === 'bookingsList') { this.view = 'dashboard'; }
    else if (this.view === 'bookingDetail') { this.view = 'bookingsList'; this.selectedBooking = null; }
    this.render();
  }

  async reconnectGmail() {
    await fetch('/api/logout');
    this.loginWithGmail();
  }

  urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  async checkPushStatus() {
    try {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      this.pushEnabled = !!sub;
    } catch (e) {}
  }

  async togglePushNotifications() {
    if (this.pushEnabled) { await this.disablePush(); } else { await this.enablePush(); }
  }

  async enablePush() {
    this.error = null;
    try {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        this.error = 'Le notifiche push non sono supportate su questo browser/dispositivo';
        this.render();
        return;
      }
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        this.error = 'Permesso notifiche negato dal telefono';
        this.render();
        return;
      }
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: this.urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
      await fetch('/api/push-subscription', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'save', subscription: sub })
      });
      this.pushEnabled = true;
    } catch (e) {
      this.error = 'Attivazione notifiche fallita: ' + e.message;
    }
    this.render();
  }

  async disablePush() {
    this.error = null;
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (sub) {
        await fetch('/api/push-subscription', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'delete', endpoint: sub.endpoint })
        });
        await sub.unsubscribe();
      }
      this.pushEnabled = false;
    } catch (e) {
      this.error = 'Disattivazione fallita: ' + e.message;
    }
    this.render();
  }

  renderBookingRows() {
    const list = this.filteredBookings();
    if (this.bookingsLoading) {
      return `<div class="loading"><div class="spinner"></div>Carico le prenotazioni…</div>`;
    }
    if (!list.length) {
      return `<div class="empty">${this.bookingSearchQuery ? 'Nessuna prenotazione trovata' : 'Nessuna prenotazione confermata ancora'}</div>`;
    }
    return list.map(b => {
      const checkInFmt = this.formatQuoteDate(b.check_in);
      const checkOutFmt = this.formatQuoteDate(b.check_out);
      const safeBooking = JSON.stringify(b).replace(/'/g, "&#39;");
      const status = b.status || 'confermata';
      const statusClass = 'status-' + status.replace(/\s+/g, '-');
      return `
        <div class="booking-row" onclick='app.openBookingDetail(${safeBooking})'>
          <button class="dismiss-btn" onclick='event.stopPropagation(); app.dismissBooking(${b.id})'>✕</button>
          <div class="name">${this.escape(b.guest_name)}</div>
          <div class="dates"><b>${checkInFmt}</b> → <b>${checkOutFmt}</b></div>
          ${b.total ? `<div class="total">€ ${Number(b.total).toFixed(2)}</div>` : ''}
          ${b.guests ? `<div class="code-tag">👤 ${b.guests} ospit${b.guests === 1 ? 'e' : 'i'}</div>` : ''}
          <div class="code-tag">${b.code ? this.escape(b.code) : 'Nessun codice (prenotazione precedente all\'aggiornamento)'}</div>
          <span class="status-tag ${statusClass}">${this.escape(status)}</span>
        </div>`;
    }).join('');
  }

    return `
      <div class="list-header">
        <div class="back" onclick="app.goBack()">‹ ACME</div>
      </div>
      ${this.error ? `<div class="error-banner">${this.escape(this.error)}</div>` : ''}
      <div class="topbar"><div class="eyebrow">Domus 106</div><h1>Prenotazioni confermate</h1></div>
      <div class="search-bar">
        <input type="text" id="bookingSearchInput" placeholder="Cerca per codice o nome ospite…" value="${this.escape(this.bookingSearchQuery)}" oninput="app.updateBookingSearch(this.value)">
      </div>
      <div id="bookingResultsArea">${this.renderBookingRows()}</div>`;
  }

  renderBookingDetail() {
    const b = this.selectedBooking;
    const checkInFmt = this.formatQuoteDate(b.check_in);
    const checkOutFmt = this.formatQuoteDate(b.check_out);
    const hasSource = b.source_subject || b.source_from || b.source_body;
    const statusOptions = BOOKING_STATUSES.map(s =>
      `<option value="${s}" ${this.bookingStatusDraft === s ? 'selected' : ''}>${s.charAt(0).toUpperCase() + s.slice(1)}</option>`
    ).join('');

    return `
      <div class="list-header">
        <div class="back" onclick="app.goBack()">‹ Prenotazioni</div>
      </div>
      ${this.error ? `<div class="error-banner">${this.escape(this.error)}</div>` : ''}
      <div class="detail-card">
        <div class="code-hero">
          <div class="form-label" style="margin-bottom:0;">Codice prenotazione</div>
          <div class="code-value">${this.escape(b.code || '—')}</div>
          <div style="margin-top:8px;">
            <button class="btn btn-secondary" style="width:auto; padding:8px 16px; flex:none;" onclick="app.copyBookingCode(this, '${b.code || ''}')">Copia codice</button>
          </div>
        </div>
      </div>
      <div class="detail-card">
        <div class="detail-row"><span class="label">Ospite</span>${this.escape(b.guest_name)}</div>
        ${b.guest_email ? `<div class="detail-row"><span class="label">Email</span>${this.escape(b.guest_email)}</div>` : ''}
        <div class="detail-row"><span class="label">Check-in</span><b>${checkInFmt}</b></div>
        <div class="detail-row"><span class="label">Check-out</span><b>${checkOutFmt}</b></div>
        ${b.guests ? `<div class="detail-row"><span class="label">Ospiti</span>${b.guests}</div>` : ''}
        ${b.total ? `<div class="detail-row"><span class="label">Totale</span>€ ${Number(b.total).toFixed(2)}</div>` : ''}
      </div>
      ${hasSource ? `
      <div class="section-title">Nata da questa mail</div>
      <div class="detail-card">
        <div class="source-email-box">
          ${b.source_from ? `<div>${this.escape(b.source_from)}</div>` : ''}
          ${b.source_subject ? `<div class="src-subject">${this.escape(b.source_subject)}</div>` : ''}
          ${b.source_body ? `<div class="src-body">${this.escape(b.source_body)}</div>` : ''}
        </div>
      </div>` : ''}
      <div class="section-title">Stato e note</div>
      <div class="detail-card">
        <span class="form-label">Stato</span>
        <select class="form-input" onchange="app.bookingStatusDraft = this.value">${statusOptions}</select>
        <span class="form-label">Note</span>
        <textarea class="form-input" style="min-height:90px; resize:vertical;" placeholder="Es. arriva in ritardo, ha chiesto una culla…" oninput="app.bookingNotesDraft = this.value">${this.escape(this.bookingNotesDraft)}</textarea>
        <button class="btn btn-primary" ${this.bookingSaving ? 'disabled' : ''} onclick="app.saveBookingDetail()">${this.bookingSaving ? 'Salvataggio…' : 'Salva modifiche'}</button>
      </div>`;
  }

  formatDate(dateStr, full) {
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return '';
    if (full) {
      return d.toLocaleString('it-IT', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    return d.toLocaleString('it-IT', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  escape(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  render() {
    const el = document.getElementById('app');
    if (this.view === 'setup') el.innerHTML = this.renderSetup();
    else if (this.view === 'login') el.innerHTML = this.renderLogin();
    else if (this.view === 'loading' || this.view === 'init') el.innerHTML = this.renderLoading();
    else if (this.view === 'dashboard') el.innerHTML = this.renderDashboard();
    else if (this.view === 'emails') el.innerHTML = this.renderEmails();
    else if (this.view === 'detail') el.innerHTML = this.renderDetail();
    else if (this.view === 'quoteStandalone') el.innerHTML = this.renderStandaloneQuote();
    else if (this.view === 'bookingsList') el.innerHTML = this.renderBookingsList();
    else if (this.view === 'bookingDetail') el.innerHTML = this.renderBookingDetail();
    this.updateAppBadge();
  }

  updateAppBadge() {
    if (!('setAppBadge' in navigator)) return;
    try {
      const total = Object.keys(CATEGORY_META).reduce((sum, cat) => sum + this.unresolvedCount(cat), 0);
      if (total > 0) navigator.setAppBadge(total).catch(() => {});
      else if ('clearAppBadge' in navigator) navigator.clearAppBadge().catch(() => {});
    } catch (e) {}
  }
}

const app = new ACME();
app.init();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(() => app.checkPushStatus())
      .then(() => app.render())
      .catch(() => {});
  });
}
</script>
</body>
</html>

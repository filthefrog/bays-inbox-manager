<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAYS Inbox Manager</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
    }
    
    .container {
      max-width: 100%;
      background: white;
      min-height: 100vh;
      padding: 1rem;
    }
    
    .header {
      margin-bottom: 2rem;
      border-bottom: 1px solid #e5e5e5;
      padding-bottom: 1rem;
    }
    
    .title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    
    .subtitle {
      font-size: 13px;
      color: #666;
    }
    
    button {
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #0084ff;
      color: white;
      cursor: pointer;
      width: 100%;
      margin-bottom: 8px;
    }
    
    button:hover {
      background: #0066cc;
    }
    
    .login-screen {
      text-align: center;
      padding: 2rem;
    }
    
    .login-screen h2 {
      margin-bottom: 1rem;
      font-size: 20px;
    }
    
    .login-screen p {
      color: #666;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    
    .dashboard {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .email-item {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .email-item:hover {
      border-color: #0084ff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    
    .email-from {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    
    .email-subject {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }
    
    .email-preview {
      font-size: 12px;
      color: #999;
      line-height: 1.5;
      max-height: 40px;
      overflow: hidden;
    }
    
    .loader {
      text-align: center;
      padding: 2rem;
    }
    
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0084ff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .email-detail {
      background: #f9f9f9;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
    }
    
    .meta-row {
      font-size: 13px;
      margin-bottom: 8px;
    }
    
    .meta-label {
      font-weight: 600;
      color: #666;
    }
    
    .badge {
      display: inline-block;
      background: #e8f3ff;
      color: #0084ff;
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 4px;
      font-weight: 600;
      margin-right: 8px;
      margin-bottom: 8px;
    }
    
    .response-option {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 12px;
    }
    
    .response-label {
      font-size: 12px;
      color: #666;
      font-weight: 600;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    
    .response-text {
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
      background: #f9f9f9;
      padding: 12px;
      border-radius: 4px;
    }
    
    .button-group {
      display: flex;
      gap: 8px;
    }
    
    .button-group button {
      flex: 1;
      margin-bottom: 0;
    }
    
    .approve {
      background: #31a24c;
    }
    
    .approve:hover {
      background: #2a8c41;
    }
    
    .reject {
      background: white;
      color: #dc3545;
      border: 1px solid #dc3545;
    }
    
    .reject:hover {
      background: #fff5f6;
    }
    
    .back-btn {
      background: white;
      color: #0084ff;
      border: 1px solid #0084ff;
      margin-bottom: 1rem;
    }
    
    .error {
      background: #ffebee;
      color: #c62828;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    
    .status-approved {
      background: #e8f5e9;
      color: #31a24c;
      padding: 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 12px;
    }
    
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">BAYS Inbox Manager</div>
      <div class="subtitle">Civitanova Marche • Via Papa Giovanni XXIII, 106</div>
    </div>
    
    <div id="app"></div>
  </div>

  <script>
    class BAYSManager {
      constructor() {
        this.view = 'loading';
        this.emails = [];
        this.selectedEmailId = null;
        this.category = null;
        this.tone = null;
        this.responses = [];
        this.approvedResponseIdx = null;
        this.error = null;
      }

      async init() {
        try {
          const response = await fetch('/api/emails');
          if (!response.ok) {
            this.view = 'login';
          } else {
            const data = await response.json();
            this.emails = data.emails || [];
            this.view = 'dashboard';
          }
        } catch (error) {
          this.view = 'login';
        }
        this.render();
      }

      async loginWithGmail() {
        try {
          const response = await fetch('/api/auth');
          const data = await response.json();
          window.location.href = data.authUrl;
        } catch (error) {
          this.error = "Errore nel login";
          this.render();
        }
      }

      selectEmail(id) {
        this.selectedEmailId = id;
        this.view = 'analyzing';
        this.error = null;
        this.render();
        this.analyzeEmail();
      }

      async analyzeEmail() {
        const email = this.emails.find(e => e.id === this.selectedEmailId);
        if (!email) return;

        try {
          let apiKey = localStorage.getItem('claude_api_key');
          
          if (!apiKey) {
            apiKey = prompt("Inserisci la tua Claude API Key (sk-ant-v0-...):") || '';
            if (!apiKey) {
              this.error = "API Key richiesta";
              this.view = 'dashboard';
              this.render();
              return;
            }
            localStorage.setItem('claude_api_key', apiKey);
          }

          const response = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              from: email.from,
              subject: email.subject,
              body: email.body,
              apiKey: apiKey
            })
          });

          if (!response.ok) {
            throw new Error('Errore nell\'analisi');
          }

          const data = await response.json();
          this.category = data.category;
          this.tone = data.tone;
          this.responses = data.responses || [];
          this.view = 'detail';
          this.render();
        } catch (error) {
          this.error = error.message;
          this.view = 'dashboard';
          this.render();
        }
      }

      openGmailCompose(responseIdx) {
        const email = this.emails.find(e => e.id === this.selectedEmailId);
        const response = this.responses[responseIdx];
        const toEmail = email.from.match(/[\w.-]+@[\w.-]+\.\w+/)?.[0] || "cliente@example.com";
        
        const mailtoUrl = `https://mail.google.com/mail/?ui=2&view=cm&to=${encodeURIComponent(toEmail)}&subject=${encodeURIComponent("RE: " + email.subject)}&body=${encodeURIComponent(response)}`;
        
        window.open(mailtoUrl, '_blank');
        this.approvedResponseIdx = responseIdx;
        this.render();
      }

      reject(idx) {
        this.responses.splice(idx, 1);
        this.render();
      }

      goBack() {
        this.selectedEmailId = null;
        this.category = null;
        this.tone = null;
        this.responses = [];
        this.approvedResponseIdx = null;
        this.error = null;
        this.view = 'dashboard';
        this.render();
      }

      renderLogin() {
        return `
          <div class="login-screen">
            <h2>🔐 Accedi a Gmail</h2>
            <p>
              Clicca il bottone sotto per autorizzare BAYS Inbox Manager a leggere le tue email.<br>
              Non condivideremo mai i tuoi dati.
            </p>
            <button onclick="app.loginWithGmail()">
              📧 Accedi con Gmail
            </button>
          </div>
        `;
      }

      renderDashboard() {
        if (this.emails.length === 0) {
          return `
            <div class="loader">
              <p>Nessuna email nel tuo inbox.</p>
            </div>
          `;
        }

        let html = `
          <div style="font-size: 14px; font-weight: 600; margin-bottom: 1rem;">
            ${this.emails.length} Email
          </div>
          <div class="dashboard">
        `;

        this.emails.forEach(email => {
          html += `
            <div class="email-item" onclick="app.selectEmail('${email.id}')">
              <div class="email-from">${email.from}</div>
              <div class="email-subject">${email.subject}</div>
              <div class="email-preview">${email.body}</div>
            </div>
          `;
        });

        html += `</div>`;
        return html;
      }

      renderAnalyzing() {
        return `
          <div class="loader">
            <div class="spinner"></div>
            <p>Claude sta analizzando l'email...</p>
          </div>
        `;
      }

      renderDetail() {
        const email = this.emails.find(e => e.id === this.selectedEmailId);
        if (!email) return '';

        let html = `
          <button class="back-btn" onclick="app.goBack()">← Torna alla lista</button>
          
          <div class="email-detail">
            <div class="meta-row">
              <span class="meta-label">Da:</span> ${email.from}
            </div>
            <div class="meta-row">
              <span class="meta-label">Oggetto:</span> ${email.subject}
            </div>
            <div style="margin-top: 12px;">
              <span class="badge">${this.category}</span>
              <span class="badge">${this.tone}</span>
            </div>
          </div>
          
          <div style="font-size: 14px; font-weight: 600; margin-bottom: 1rem;">
            3 Risposte consigliate
          </div>
        `;

        this.responses.forEach((resp, idx) => {
          const isApproved = this.approvedResponseIdx === idx;
          html += `
            <div class="response-option">
              <div class="response-label">Opzione ${idx + 1}</div>
              <div class="response-text">${resp}</div>
              <div class="button-group">
                <button class="approve" onclick="app.openGmailCompose(${idx})">
                  ✓ Approva e apri Gmail
                </button>
                <button class="reject" onclick="app.reject(${idx})">
                  ✗ Rifiuta
                </button>
              </div>
              ${isApproved ? '<div class="status-approved">✓ Mail aperta in Gmail</div>' : ''}
            </div>
          `;
        });

        return html;
      }

      render() {
        const app = document.getElementById('app');
        let html = '';

        if (this.error) {
          html = `<div class="error">⚠️ ${this.error}</div>`;
        }

        if (this.view === 'loading') {
          html += `<div class="loader"><div class="spinner"></div><p>Caricamento...</p></div>`;
        } else if (this.view === 'login') {
          html += this.renderLogin();
        } else if (this.view === 'dashboard') {
          html += this.renderDashboard();
        } else if (this.view === 'analyzing') {
          html += this.renderAnalyzing();
        } else if (this.view === 'detail') {
          html += this.renderDetail();
        }

        app.innerHTML = html;
      }
    }

    const app = new BAYSManager();
    app.init();
  </script>
</body>
</html>

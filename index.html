<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACME</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a6ebd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ACME">
<link rel="apple-touch-icon" href="/icon-180.png?v=2">
<style>
  :root {
    --bg: #f6f4f0;
    --card: #ffffff;
    --text: #1c1c1e;
    --text-secondary: #8a8a8e;
    --accent: #0a6ebd;
    --green: #34c759;
    --red: #ff3b30;
    --orange: #ff9500;
    --border: rgba(60,60,67,0.1);
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; min-height: 100vh; }

  .topbar { padding: 8px 4px 24px; }
  .topbar .eyebrow { font-size: 13px; color: var(--text-secondary); font-weight: 500; margin-bottom: 2px; }
  .topbar h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }

  /* Dashboard grid - the heart */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .card {
    background: var(--card);
    border: 1px solid rgba(60,60,67,0.06);
    border-radius: var(--radius-lg);
    padding: 18px;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s ease;
    cursor: pointer;
  }
  .card:active { transform: scale(0.97); }
  .card .icon {
    width: 40px; height: 40px;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    margin-bottom: 14px;
  }
  .card .name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .card .count { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  .card .count.zero { color: var(--text-secondary); }

  .hero-card {
    background: rgba(255,59,48,0.08);
    border-radius: var(--radius-lg);
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: transform 0.15s ease;
    box-shadow: 0 4px 16px rgba(255,59,48,0.08);
  }
  .hero-card:active { transform: scale(0.98); }
  .hero-card .hero-icon {
    width: 52px; height: 52px; flex-shrink: 0;
    border-radius: var(--radius-sm);
    background: rgba(255,59,48,0.14);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .hero-card .hero-text { flex: 1; }
  .hero-card .name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .hero-card .count { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; color: var(--red); }
  .hero-card .count.zero { color: var(--text-secondary); }

  .icon.red { background: rgba(255,59,48,0.12); }
  .icon.blue { background: rgba(10,110,189,0.12); }
  .icon.orange { background: rgba(255,149,0,0.12); }
  .icon.purple { background: rgba(175,82,222,0.12); }
  .icon.teal { background: rgba(90,200,250,0.12); }
  .icon.green { background: rgba(52,199,89,0.12); }
  .icon.gray { background: rgba(142,142,147,0.12); }

  .refresh-row { display: flex; justify-content: space-between; align-items: center; margin: 24px 0 4px; padding: 0 4px; }
  .refresh-row .status { font-size: 13px; color: var(--text-secondary); }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--card); border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; cursor: pointer;
  }

  /* List views */
  .list-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .back { font-size: 17px; color: var(--accent); font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .list-title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }

  .email-row {
    background: var(--card);
    border-radius: var(--radius-md);
    padding: 14px 44px 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: transform 0.15s ease;
    position: relative;
  }
  .email-row:active { transform: scale(0.98); }
  .email-row .from { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .email-date { font-size: 12px; color: var(--text-secondary); white-space: nowrap; flex-shrink: 0; }
  .email-row .subject { font-size: 14px; color: var(--text); margin-bottom: 4px; opacity: 0.85; }
  .email-row .preview { font-size: 13px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .email-row .ready-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--green); font-weight: 600; margin-top: 6px; }
  .dismiss-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: rgba(60,60,67,0.08);
    color: var(--text-secondary);
    border: none;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .dismiss-btn:active { background: rgba(60,60,67,0.16); }

  /* Detail view */
  .detail-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 16px;
  }
  .detail-row { font-size: 14px; margin-bottom: 6px; }
  .detail-row .label { color: var(--text-secondary); margin-right: 6px; }
  .pill-row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .pill {
    background: rgba(10,110,189,0.1); color: var(--accent);
    font-size: 12px; font-weight: 600;
    padding: 5px 10px; border-radius: 100px;
  }
  .pill.tone-urgente, .pill.tone-arrabbiato { background: rgba(255,59,48,0.1); color: var(--red); }

  .section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.02em; margin: 20px 0 10px 4px; }
  .original-text {
    font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    color: var(--text); opacity: 0.85;
  }

  .response-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 12px;
  }
  .response-card .opt-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .opt-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .opt-dot.green { background: var(--green); }
  .opt-dot.orange { background: var(--orange); }
  .opt-dot.red { background: var(--red); }
  .opt-dot.gray { background: var(--text-secondary); }
  .discrepancy-banner {
    background: rgba(255,149,0,0.12); color: var(--orange);
    padding: 12px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px; line-height: 1.45;
  }
  .discrepancy-banner b { font-weight: 700; }
  .response-card .body-text {
    width: 100%;
    font-family: inherit;
    font-size: 14px; line-height: 1.5; white-space: pre-wrap;
    text-align: left;
    background: var(--bg); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 12px;
    border: 1px solid transparent;
    resize: vertical;
    min-height: 110px;
    color: var(--text);
  }
  .response-card .body-text:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--card);
  }
  .response-card .body-text:disabled {
    opacity: 0.7;
  }
  .sent-confirm {
    background: rgba(52,199,89,0.12); color: var(--green);
    padding: 12px; border-radius: var(--radius-sm); font-size: 13px; margin-top: 10px;
  }
  .sent-confirm a { color: var(--green); font-weight: 600; text-decoration: underline; }
  .sent-confirm .pending { color: var(--text-secondary); font-weight: 500; }

  .confirm-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .confirm-overlay.hidden { display: none; }
  .confirm-box {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 28px 24px;
    max-width: 320px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  .confirm-box .icon { font-size: 42px; margin-bottom: 12px; }
  .confirm-box h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .confirm-box p { font-size: 14px; color: var(--text-secondary); margin-bottom: 22px; line-height: 1.45; }
  .btn-row { display: flex; gap: 8px; }
  .btn {
    flex: 1; border: none; border-radius: var(--radius-sm); padding: 11px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.7; }
  .btn:disabled { opacity: 0.4; }
  .btn-send { background: var(--green); color: white; }
  .btn-send.sent { background: rgba(52,199,89,0.15); color: var(--green); }
  .btn-reject { background: rgba(255,59,48,0.1); color: var(--red); }

  .empty, .loading, .login-box {
    text-align: center; padding: 60px 20px; color: var(--text-secondary);
  }
  .spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid rgba(0,0,0,0.08); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .login-box h2 { color: var(--text); font-size: 20px; margin-bottom: 8px; }
  .login-box p { font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
  .btn-primary {
    background: var(--accent); color: white; border: none;
    padding: 14px; border-radius: var(--radius-md); font-size: 16px; font-weight: 600;
    width: 100%; cursor: pointer;
  }

  input.key-input {
    width: 100%; padding: 14px; border-radius: var(--radius-md); border: 1px solid var(--border);
    font-size: 15px; font-family: monospace; margin-bottom: 12px; background: var(--card);
  }

  .error-banner {
    background: rgba(255,59,48,0.1); color: var(--red);
    padding: 12px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px;
  }

  .settings-link { text-align: center; margin-top: 28px; }
  .settings-link a { font-size: 13px; color: var(--text-secondary); text-decoration: none; }
</style>
</head>
<body>
  <div class="container" id="app"></div>
  <div id="confirmOverlay" class="confirm-overlay hidden"></div>

<script>
const CATEGORY_META = {
  'Lamentela':               { icon: '⚠️', color: 'red' },
  'Prenotazione':            { icon: '📅', color: 'blue' },
  'Problema tecnico':        { icon: '🔧', color: 'orange' },
  'Fatturazione':            { icon: '💳', color: 'purple' },
  'Richiesta informazioni':  { icon: '❓', color: 'teal' },
  'Complimento':             { icon: '⭐', color: 'green' },
  'Cancellazione':           { icon: '❌', color: 'gray' }
};

class ACME {
  constructor() {
    this.view = 'init';
    this.byCategory = {};
    this.selectedCategory = null;
    this.selectedEmail = null;
    this.error = null;
    this.lastUpdated = null;
    this.resolvedIds = new Set(JSON.parse(localStorage.getItem('acme_resolved_ids') || '[]'));
    this.sendingIdx = null;
  }

  saveResolvedIds() {
    localStorage.setItem('acme_resolved_ids', JSON.stringify([...this.resolvedIds]));
  }

  unresolvedCount(cat) {
    const emails = this.byCategory[cat] || [];
    return emails.filter(e => !this.resolvedIds.has(e.id) && !e.resolved).length;
  }

  async init() {
    const params = new URLSearchParams(window.location.search);
    const debugScope = params.get('debug_scope');
    if (debugScope) {
      window.history.replaceState({}, '', window.location.pathname);
    }
    const key = localStorage.getItem('claude_api_key');
    if (!key) { this.view = 'setup'; this.render(); return; }
    await this.loadEmails();
    if (debugScope) {
      this.error = 'DEBUG scope ricevuto da Google: ' + decodeURIComponent(debugScope);
      this.render();
    }
  }

  saveKey() {
    const val = document.getElementById('keyInput').value.trim();
    if (!val) { alert('Inserisci una API Key valida'); return; }
    localStorage.setItem('claude_api_key', val);
    this.loadEmails();
  }

  async loadEmails() {
    this.view = 'loading';
    this.error = null;
    this.render();
    try {
      const res = await fetch('/api/emails-analyzed', {
        headers: { 'x-claude-key': localStorage.getItem('claude_api_key') }
      });
      if (res.status === 401) { this.view = 'login'; this.render(); return; }
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error || 'Errore nel caricamento');
      }
      const data = await res.json();
      this.byCategory = data.byCategory || {};
      this.lastUpdated = new Date();
      this.view = 'dashboard';
    } catch (e) {
      this.error = e.message;
      this.view = 'dashboard';
    }
    this.render();
  }

  async loginWithGmail() {
    const res = await fetch('/api/auth');
    const data = await res.json();
    window.location.href = data.authUrl;
  }

  openCategory(cat) {
    this.selectedCategory = cat;
    this.view = 'emails';
    this.render();
  }

  openEmail(email) {
    this.selectedEmail = email;
    this.view = 'detail';
    this.render();
  }

  async sendResponse(idx) {
    const email = this.selectedEmail;
    const respItem = email.responses[idx];
    const resp = (respItem && typeof respItem === 'object') ? respItem.text : respItem;
    const to = (email.from.match(/[\w.-]+@[\w.-]+\.\w+/) || [])[0] || '';
    const subject = 'RE: ' + email.subject;
    this.sendingIdx = idx;
    this.error = null;
    this.render();
    try {
      const res = await fetch('/api/send-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ to, subject, body: resp })
      });
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error || ('Invio fallito (status ' + res.status + ')'));
      }
      const data = await res.json();
      email.sentIdx = idx;
      email.sentThreadId = data.threadId || null;
      email.sentConfirmed = !!data.confirmed;
      this.resolvedIds.add(email.id);
      this.saveResolvedIds();
      this.showSendConfirmation(data.confirmed);
      fetch('/api/mark-resolved', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ emailId: email.id })
      }).catch(() => {});
    } catch (e) {
      this.error = e.message;
    }
    this.sendingIdx = null;
    this.render();
  }

  showSendConfirmation(confirmed) {
    const overlay = document.getElementById('confirmOverlay');
    const icon = confirmed ? '✅' : '⚠️';
    const title = confirmed ? 'Email inviata e confermata' : 'Email inviata';
    const desc = confirmed
      ? 'Verificato direttamente su Gmail: il messaggio risulta davvero nella posta inviata.'
      : 'Il messaggio è stato inviato, ma la verifica automatica su Gmail non è riuscita in questo momento. Puoi controllare manualmente se vuoi esserne certo.';
    overlay.innerHTML = `
      <div class="confirm-box">
        <div class="icon">${icon}</div>
        <h3>${title}</h3>
        <p>${desc}</p>
        <button class="btn btn-primary" onclick="app.closeConfirmModal()">OK</button>
      </div>`;
    overlay.classList.remove('hidden');
  }

  closeConfirmModal() {
    document.getElementById('confirmOverlay').classList.add('hidden');
  }

  updateResponseText(idx, value) {
    const r = this.selectedEmail.responses[idx];
    if (r && typeof r === 'object') {
      r.text = value;
    } else {
      this.selectedEmail.responses[idx] = value;
    }
  }

  dismissEmail(email) {
    this.resolvedIds.add(email.id);
    this.saveResolvedIds();
    fetch('/api/mark-resolved', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ emailId: email.id })
    }).catch(() => {});
    this.render();
  }

  async reanalyzeEmail() {
    const email = this.selectedEmail;
    this.view = 'analyzing';
    this.error = null;
    this.render();
    try {
      const res = await fetch('/api/analyze-single', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-claude-key': localStorage.getItem('claude_api_key')
        },
        body: JSON.stringify({ from: email.from, subject: email.subject, body: email.body })
      });
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error || 'Rianalisi fallita');
      }
      const data = await res.json();
      email.category = data.category;
      email.tone = data.tone;
      email.discrepancy = data.discrepancy || null;
      email.responses = data.responses;
      email.analysisError = false;
      Object.keys(this.byCategory).forEach(cat => {
        const idx = (this.byCategory[cat] || []).findIndex(e => e.id === email.id);
        if (idx !== -1) this.byCategory[cat][idx] = email;
      });
    } catch (e) {
      this.error = e.message;
    }
    this.view = 'detail';
    this.render();
  }

  rejectResponse(idx) {
    this.selectedEmail.responses.splice(idx, 1);
    this.render();
  }

  goBack() {
    if (this.view === 'detail') { this.view = 'emails'; this.selectedEmail = null; }
    else if (this.view === 'emails') { this.view = 'dashboard'; this.selectedCategory = null; }
    this.render();
  }

  async reconnectGmail() {
    await fetch('/api/logout');
    this.loginWithGmail();
  }

  resetKey() {
    localStorage.removeItem('claude_api_key');
    this.view = 'setup';
    this.render();
  }

  // ---------- RENDER ----------

  renderSetup() {
    return `
      <div class="topbar"><div class="eyebrow">Configurazione</div><h1>ACME</h1></div>
      <div class="login-box" style="text-align:left; padding: 20px 4px;">
        <h2>Chiave Claude API</h2>
        <p>Serve una sola volta. Resta salvata sul dispositivo.</p>
        <input class="key-input" id="keyInput" type="password" placeholder="sk-ant-...">
        <button class="btn-primary" onclick="app.saveKey()">Continua</button>
      </div>`;
  }

  renderLogin() {
    return `
      <div class="topbar"><div class="eyebrow">Domus 106</div><h1>ACME</h1></div>
      <div class="login-box">
        <h2>Accedi con Gmail</h2>
        <p>Autorizza ACME a leggere la posta in arrivo.</p>
        <button class="btn-primary" onclick="app.loginWithGmail()">Accedi con Gmail</button>
      </div>`;
  }

  renderLoading() {
    const messages = [
      "Analisi della posta in corso…",
      "Le trappole ACME stanno smistando la posta…",
      "Un attimo, come Willy il Coyote aspettiamo che il piano funzioni…",
      "Ordinando un nuovo kit ACME per organizzare l'inbox…",
      "Beep beep… quasi pronto…"
    ];
    const msg = messages[Math.floor(Math.random() * messages.length)];
    return `
      <div class="topbar"><div class="eyebrow">Domus 106</div><h1>ACME</h1></div>
      <div class="loading"><div class="spinner"></div>${msg}</div>`;
  }

  renderDashboard() {
    const entries = Object.entries(CATEGORY_META);
    const [heroCat, heroMeta] = entries.find(([cat]) => cat === 'Lamentela');
    const gridEntries = entries.filter(([cat]) => cat !== 'Lamentela');

    const heroCount = this.unresolvedCount(heroCat);
    const hero = `
      <div class="hero-card" onclick="app.openCategory('${heroCat}')">
        <div class="hero-icon">${heroMeta.icon}</div>
        <div class="hero-text">
          <div class="name">${heroCat}</div>
          <div class="count ${heroCount === 0 ? 'zero' : ''}">${heroCount}</div>
        </div>
      </div>`;

    const cards = gridEntries.map(([cat, meta]) => {
      const count = this.unresolvedCount(cat);
      return `
        <div class="card" onclick="app.openCategory('${cat}')">
          <div class="icon ${meta.color}">${meta.icon}</div>
          <div class="name">${cat}</div>
          <div class="count ${count === 0 ? 'zero' : ''}">${count}</div>
        </div>`;
    }).join('');

    const updatedText = this.lastUpdated
      ? 'Aggiornato ' + this.lastUpdated.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })
      : '';

    return `
      <div class="topbar"><div class="eyebrow">Domus 106</div><h1>ACME</h1></div>
      ${this.error ? `<div class="error-banner">${this.error}</div>` : ''}
      ${hero}
      <div class="grid">${cards}</div>
      <div class="refresh-row">
        <div class="status">${updatedText}</div>
        <button class="icon-btn" onclick="app.loadEmails()">↻</button>
      </div>
      <div class="settings-link"><a onclick="app.resetKey()">Cambia chiave API</a> &nbsp;·&nbsp; <a onclick="app.reconnectGmail()">Riconnetti Gmail</a></div>`;
  }

  renderEmails() {
    const allEmails = this.byCategory[this.selectedCategory] || [];
    const emails = allEmails.filter(e => !this.resolvedIds.has(e.id) && !e.resolved);
    const meta = CATEGORY_META[this.selectedCategory];
    const rows = emails.length ? emails.map(e => {
      const safeEmail = JSON.stringify(e).replace(/'/g, "&#39;");
      return `
        <div class="email-row" onclick='app.openEmail(${safeEmail})'>
          <button class="dismiss-btn" onclick='event.stopPropagation(); app.dismissEmail(${safeEmail})'>✕</button>
          <div class="row-top">
            <div class="from">${this.escape(e.from)}</div>
            <div class="email-date">${this.formatDate(e.date)}</div>
          </div>
          <div class="subject">${this.escape(e.subject)}</div>
          <div class="preview">${this.escape(e.body)}</div>
          <div class="ready-badge">● Risposte pronte</div>
        </div>`;
    }).join('')
      : `<div class="empty">Nessuna email qui — persino Willy il Coyote ogni tanto si ferma a riprendere fiato</div>`;

    return `
      <div class="list-header">
        <div class="back" onclick="app.goBack()">‹ Categorie</div>
      </div>
      <div class="list-title" style="margin-bottom:16px;">${meta.icon} ${this.selectedCategory}</div>
      ${rows}`;
  }

  renderDetail() {
    const e = this.selectedEmail;
    const toneClass = (e.tone || '').toLowerCase();
    const responses = (e.responses || []).map((r, idx) => {
      const isObj = r && typeof r === 'object';
      const text = isObj ? r.text : r;
      const label = isObj ? r.label : ('Opzione ' + (idx + 1));
      const color = isObj ? r.color : 'gray';
      const sent = e.sentIdx === idx;
      const sending = this.sendingIdx === idx;
      return `
        <div class="response-card">
          <div class="opt-label"><span class="opt-dot ${color}"></span>${label}</div>
          <textarea class="body-text" ${sent || sending ? 'disabled' : ''} oninput="app.updateResponseText(${idx}, this.value)">${this.escape(text)}</textarea>
          <div class="btn-row">
            <button class="btn btn-send ${sent ? 'sent' : ''}" ${sending ? 'disabled' : ''} onclick="app.sendResponse(${idx})">${sending ? 'Invio…' : (sent ? '✓ Inviata' : 'Invia')}</button>
            <button class="btn btn-reject" ${sending ? 'disabled' : ''} onclick="app.rejectResponse(${idx})">Scarta</button>
          </div>
        </div>`;
    }).join('');

    return `
      <div class="list-header">
        <div class="back" onclick="app.goBack()">‹ ${this.selectedCategory}</div>
      </div>
      ${this.error ? `<div class="error-banner">${this.escape(this.error)}</div>` : ''}
      ${e.discrepancy ? `<div class="discrepancy-banner">⚠️ <b>Possibile incongruenza:</b> ${this.escape(e.discrepancy)}</div>` : ''}
      ${e.analysisError ? `<div class="error-banner">Analisi non riuscita per questa email.<br><button class="btn btn-primary" style="margin-top:10px;" onclick="app.reanalyzeEmail()">↻ Rianalizza</button></div>` : ''}
      <div class="detail-card">
        <div class="detail-row"><span class="label">Da</span>${this.escape(e.from)}</div>
        <div class="detail-row"><span class="label">Oggetto</span>${this.escape(e.subject)}</div>
        <div class="detail-row"><span class="label">Ricevuta</span>${this.formatDate(e.date, true)}</div>
        <div class="pill-row">
          <span class="pill">${e.category}</span>
          <span class="pill tone-${toneClass}">${e.tone}</span>
        </div>
      </div>
      <div class="section-title">Messaggio originale</div>
      <div class="detail-card">
        <div class="original-text">${this.escape(e.body)}</div>
      </div>
      <div class="section-title">Risposte suggerite</div>
      ${responses}`;
  }

  formatDate(dateStr, full) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return '';
    if (full) {
      return d.toLocaleString('it-IT', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    return d.toLocaleString('it-IT', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  escape(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  render() {
    const el = document.getElementById('app');
    if (this.view === 'setup') el.innerHTML = this.renderSetup();
    else if (this.view === 'login') el.innerHTML = this.renderLogin();
    else if (this.view === 'loading' || this.view === 'init') el.innerHTML = this.renderLoading();
    else if (this.view === 'dashboard') el.innerHTML = this.renderDashboard();
    else if (this.view === 'emails') el.innerHTML = this.renderEmails();
    else if (this.view === 'detail') el.innerHTML = this.renderDetail();
  }
}

const app = new ACME();
app.init();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>

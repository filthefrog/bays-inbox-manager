  openReminders() {
    this.view = 'reminders';
    this.render();
  }

  async openReminderBooking(code) {
    try {
      const res = await fetch('/api/booking?code=' + encodeURIComponent(code));
      const data = await res.json().catch(() => ({}));
      const full = (data.bookings || [])[0];
      if (full) this.openBookingDetail(full);
    } catch (e) {}
  }

  async confirmCleaner(id) {
    try {
      await fetch('/api/booking', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, cleanerConfirmed: true })
      });
    } catch (e) {}
    this.reminders.cleanerPending = this.reminders.cleanerPending.filter(b => b.id !== id);
    this.render();
  }

  renderReminders() {
    const { cleanerPending, paymentPending } = this.reminders;
    const verifyCount = this.unresolvedCount('Da verificare');

    const cleanerRows = cleanerPending.map(b => {
      const nextInfo = b.next_check_in
        ? `Prossimo check-in: <b>${this.escape(b.next_guest_name)}</b> il <b>${this.formatQuoteDate(b.next_check_in)}</b> — ${this.formatHoursCountdown(this.hoursUntilNextCheckin(b.check_out, b.next_check_in))}`
        : `Nessuna prenotazione in arrivo al momento`;
      return `
      <div class="booking-row">
        <div class="name">${this.escape(b.guest_name)}</div>
        <div class="dates">Check-out del <b>${this.formatQuoteDate(b.check_out)}</b>${b.code ? ' · ' + this.escape(b.code) : ''}</div>
        <div class="rate-info" style="margin-top:4px;">${nextInfo}</div>
        <div class="btn-row" style="margin-top:10px;">
          <button class="btn btn-send" onclick="app.confirmCleaner(${b.id})">Confermato con lei</button>
        </div>
      </div>`;
    }).join('');

    const paymentRows = paymentPending.map(b => {
      // Giorni di calendario, non ore/24: alle 20 della sera prima risultava
      // "check-in oggi stesso" invece di "tra 1 giorno".
      const today0 = new Date(); today0.setHours(0, 0, 0, 0);
      const diffDays = Math.round((new Date(b.check_in + 'T00:00:00') - today0) / 86400000);
      const urgency = diffDays < 0
        ? `Check-in già passato da ${Math.abs(diffDays)} giorn${Math.abs(diffDays) === 1 ? 'o' : 'i'}`
        : diffDays === 0 ? 'Check-in oggi stesso'
        : `check-in tra ${diffDays} giorn${diffDays === 1 ? 'o' : 'i'}`;
      return `
      <div class="booking-row" ${b.code ? `onclick="app.openReminderBooking('${b.code}')"` : ''}>
        <div class="name">${this.escape(b.guest_name)}</div>
        <div class="dates">Check-in <b>${this.formatQuoteDate(b.check_in)}</b>${b.code ? ' · ' + this.escape(b.code) : ''}</div>
        <div class="rate-info" style="margin-top:4px;">${urgency} — ${b.total ? `da incassare <b>${EUR(this.dueOf(b))}</b>` : 'ancora da saldare'}</div>
      </div>`;
    }).join('');

    return `
      <div class="list-header">
        <div class="back" onclick="app.goBack()">‹ ACME</div>
      </div>
      <div class="topbar"><div class="eyebrow">Domus 106</div><h1>Promemoria</h1></div>

      <div class="section-title">Pulizie da confermare</div>
      ${cleanerRows || `<div class="empty" style="padding:24px;">Niente in sospeso</div>`}

      <div class="section-title">Pagamenti da sollecitare</div>
      ${paymentRows || `<div class="empty" style="padding:24px;">Niente in sospeso</div>`}

      <div class="section-title">Mail da verificare</div>
      ${verifyCount > 0
        ? `<div class="booking-row" onclick="app.openCategory('Da verificare')"><div class="name">${verifyCount} mail non classificate con sicurezza</div><div class="dates">Tocca per aprirle</div></div>`
        : `<div class="empty" style="padding:24px;">Niente in sospeso</div>`}`;
  }

  updateBookingSearch(value) {
    this.bookingSearchQuery = value;
    const area = document.getElementById('bookingResultsArea');
    if (area) {
      area.innerHTML = this.renderBookingRows();
    } else {
      this.render();
    }
  }

  filteredBookings(isHistory) {
    const q = this.bookingSearchQuery.trim().toLowerCase();
    let list = this.bookings.filter(b => {
      const status = b.status || 'confermata';
      const isConcluded = status === 'conclusa' || status === 'cancellata';
      return isHistory ? isConcluded : !isConcluded;
    });
    if (q) {
      list = list.filter(b =>
        (b.code || '').toLowerCase().includes(q) ||
        (b.guest_name || '').toLowerCase().includes(q)
      );
    }
    return list;
  }

  // Importi di una prenotazione. Per quelle salvate prima della colonna
  // amount_paid si ricava l'incassato dallo stato del pagamento.
  bookingRooms(b) { return Number(b.rooms) || (Number(b.guests) >= 3 ? 2 : 1); }
  paidOf(b) {
    if (b.amount_paid != null && Number(b.amount_paid) > 0) return Number(b.amount_paid);
    return b.payment_status === 'saldata' ? Number(b.total) || 0 : 0;
  }
  dueOf(b) { return Math.max(0, Math.round(((Number(b.total) || 0) - this.paidOf(b)) * 100) / 100); }

  setPaidDraft(value) {
    this.bookingPaidDraft = value;
    this.bookingPaidTouched = true;
    const b = this.selectedBooking;
    const paid = parseFloat(value) || 0, total = Number(b.total) || 0;
    // Lo stato segue l'importo: tutto → saldata, qualcosa → acconto, niente → da saldare
    this.bookingPaymentDraft = total > 0 && paid >= total ? 'saldata' : (paid > 0 ? 'acconto versato' : 'da saldare');
    const sel = document.getElementById('paymentSelect');
    if (sel) sel.value = this.bookingPaymentDraft;
    const due = document.getElementById('dueAmount');
    if (due) due.textContent = EUR(Math.max(0, total - paid));
  }

  quickPaid(kind) {
    const b = this.selectedBooking, total = Number(b.total) || 0;
    const pct = PR ? PR.PRICING.depositPercent : 30;
    const v = kind === 'all' ? total : Math.ceil(total * pct / 100);
    const input = document.getElementById('paidInput');
    if (input) input.value = v;
    this.setPaidDraft(String(v));
  }

  openBookingDetail(booking) {
    this.bookingDetailOrigin = this.view;
    this.bookingPaidDraft = String(this.paidOf(booking) || '');
    this.bookingPaidTouched = false;
    this.selectedBooking = booking;
    this.bookingNotesDraft = booking.notes || '';
    this.bookingStatusDraft = booking.status || 'confermata';
    this.bookingPaymentDraft = booking.payment_status || 'da saldare';
    this.view = 'bookingDetail';
    this.render();
  }

  async saveBookingDetail() {
    const b = this.selectedBooking;
    this.bookingSaving = true;
    this.error = null;
    this.render();
    try {
      const wasActive = (b.status || 'confermata') !== 'conclusa' && (b.status || 'confermata') !== 'cancellata';
      const nowConcluded = this.bookingStatusDraft === 'conclusa' || this.bookingStatusDraft === 'cancellata';
      const concludedAt = (wasActive && nowConcluded) ? new Date().toISOString() : undefined;
      const payload = { id: b.id, notes: this.bookingNotesDraft, status: this.bookingStatusDraft, paymentStatus: this.bookingPaymentDraft };
      if (this.bookingPaidTouched) payload.amountPaid = parseFloat(this.bookingPaidDraft) || 0;
      if (concludedAt) payload.concludedAt = concludedAt;
      const res = await fetch('/api/booking', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Salvataggio fallito');
      if (data.schemaMissing) this.error = 'Salvato, ma l\'importo incassato non è stato registrato: va prima aggiornato il database (Impostazioni → Calendari e listino).';
      this.selectedBooking = data.booking;
      this.bookingPaidTouched = false;
      const idx = this.bookings.findIndex(x => x.id === b.id);
      if (idx !== -1) this.bookings[idx] = data.booking;
      if (wasActive && this.bookingStatusDraft === 'conclusa') {
        this.notifyCleaningLady(data.booking);
        this.showNextBookingInfo(data.booking);
      }
    } catch (e) {
      this.error = e.message;
    }
    this.bookingSaving = false;
    this.render();
  }

  copyBookingCode(btn, code) {
    const original = btn.textContent;
    navigator.clipboard.writeText(code).then(() => {
      btn.textContent = 'Copiato';
      setTimeout(() => { btn.textContent = original; }, 1500);
    }).catch(() => {});
  }

  dismissBooking(id) {
    const booking = this.bookings.find(b => b.id === id) || this.selectedBooking;
    const name = booking ? booking.guest_name : 'questa prenotazione';
    this.showConfirmDialog({
      title: 'Eliminare la prenotazione?',
      desc: `${this.escape(name)} verrà rimossa definitivamente dall'archivio${booking && booking.code ? ' (codice ' + booking.code + ')' : ''}. Non è recuperabile.`,
      confirmLabel: 'Elimina',
      onConfirm: async () => {
        try {
          await fetch('/api/booking', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
          });
        } catch (e) {}
        this.bookings = this.bookings.filter(b => b.id !== id);
        if (this.view === 'bookingDetail' && this.selectedBooking && this.selectedBooking.id === id) {
          this.view = this.bookingDetailOrigin || 'bookingsList';
          this.selectedBooking = null;
        }
        this.render();
      }
    });
  }

  // Una prenotazione conclusa da più di 48 ore non può più tornare "in corso":
  // diventa solo consultabile, per sicurezza (evita di riaprire per sbaglio
  // soggiorni ormai chiusi da tempo). Le prenotazioni senza concluded_at
  // (salvate prima di questo aggiornamento) non vengono bloccate a ritroso.
  isBookingLocked(b) {
    if (!b.concluded_at) return false;
    const elapsedMs = Date.now() - new Date(b.concluded_at).getTime();
    return elapsedMs > 48 * 60 * 60 * 1000;
  }

  restoreBookingToActive(id) {
    const booking = this.bookings.find(b => b.id === id);
    if (!booking) return;
    if (this.isBookingLocked(booking)) {
      this.error = 'Sono passate più di 48 ore dalla chiusura: questa prenotazione è ormai solo consultabile.';
      this.render();
      return;
    }
    this.showConfirmDialog({
      title: 'Riportarla tra le prenotazioni in corso?',
      desc: `${this.escape(booking.guest_name)} tornerà tra le prenotazioni attive.`,
      confirmLabel: 'Riporta in corso',
      confirmColor: 'var(--accent)',
      icon: 'undo',
      onConfirm: async () => {
        try {
          const res = await fetch('/api/booking', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, status: 'confermata', checkoutReviewed: false, concludedAt: null })
          });
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'Ripristino non riuscito');
        } catch (e) {
          // Prima l'errore veniva ignorato: l'app mostrava la prenotazione
          // "in corso" anche se sul server era rimasta conclusa.
          this.error = e.message || 'Ripristino non riuscito';
          this.render();
          return;
        }
        const idx = this.bookings.findIndex(x => x.id === id);
        if (idx !== -1) { this.bookings[idx].status = 'confermata'; this.bookings[idx].checkout_reviewed = false; this.bookings[idx].concluded_at = null; }
        const area = document.getElementById('bookingResultsArea');
        if (area) area.innerHTML = this.renderBookingRows(); else this.render();
      }
    });
  }

  saveResolvedIds() {
    localStorage.setItem('acme_resolved_ids', JSON.stringify([...this.resolvedIds]));
  }

  unresolvedCount(cat) {
    const emails = this.byCategory[cat] || [];
    return emails.filter(e => !this.resolvedIds.has(e.id) && !e.resolved).length;
  }

  async init() {
    const params = new URLSearchParams(window.location.search);
    // Vecchi link di login con ?debug_scope=…: si ripulisce solo l'indirizzo
    const debugScope = params.get('debug_scope');
    if (debugScope) {
      window.history.replaceState({}, '', window.location.pathname);
    }
    await PR_READY;
    const key = localStorage.getItem('claude_api_key');
    if (!key) { this.view = 'setup'; this.render(); return; }
    await this.loadEmails();
    if (!PR) { this.error = 'Listino prezzi non caricato: ricarica la pagina prima di fare preventivi.'; this.render(); }
    setInterval(() => this.silentRefresh(), 5 * 60 * 1000);
  }

  async silentRefresh() {
    if (this.view !== 'dashboard') return;
    try {
      const res = await fetch('/api/emails-analyzed', {
        headers: { 'x-claude-key': localStorage.getItem('claude_api_key') }
      });
      if (!res.ok) return;
      const data = await res.json();
      this.byCategory = data.byCategory || {};
      this.lastUpdated = new Date();
      this.reportCampaignSeen();
      if (this.view === 'dashboard') this.render();
    } catch (e) {}
    this.loadReminders();
  }

  saveKey() {
    const val = document.getElementById('keyInput').value.trim();
    if (!val) { alert('Inserisci una API Key valida'); return; }
    localStorage.setItem('claude_api_key', val);
    this.loadEmails();
  }

  async loadEmails() {
    this.view = 'loading';
    this.error = null;
    this.render();
    try {
      const res = await fetch('/api/emails-analyzed', {
        headers: { 'x-claude-key': localStorage.getItem('claude_api_key') }
      });
      if (res.status === 401) { this.view = 'login'; this.render(); return; }
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error || 'Errore nel caricamento');
      }
      const data = await res.json();
      this.byCategory = data.byCategory || {};
      this.lastUpdated = new Date();
      this.view = 'dashboard';
      this.reportCampaignSeen();
    } catch (e) {
      this.error = e.message;
      this.view = 'dashboard';
    }
    this.render();
    this.checkPendingCheckoutReviews();
    this.loadReminders();
  }

  async loginWithGmail() {
    const res = await fetch('/api/auth');
    const data = await res.json();
    window.location.href = data.authUrl;
  }

  openCategory(cat) {
    this.selectedCategory = cat;
    this.view = 'emails';
    this.render();
  }

  openEmail(email) {
    this.selectedEmail = email;
    this.quoteState = this.emptyQuoteState();
    this.emailBookingState = this.emptyQuoteState();
    this.emailBookingState.guestName = this.extractGuestName(email.from);
    this.activeResponseTab = 0;
    this.regenerateBoxOpen = false;
    this.regenerateText = '';
    this.regenerating = false;
    this.view = 'detail';
    this.render();
    const guestEmail = this.extractEmailAddress(email.from);
    if (guestEmail) {
      this.checkGuestHistory('emailBookingState', guestEmail);
      this.checkPendingQuote(guestEmail);
    }
  }

  // Se per questo cliente c'è un preventivo già inviato in precedenza,
  // precompila la sezione Prenotazione con tariffa/sconto/date/ospiti già
  // decisi — evita di doverli ridigitare quando il cliente risponde per confermare.
  async checkPendingQuote(email) {
    try {
      const res = await fetch('/api/booking?pendingQuoteEmail=' + encodeURIComponent(email));
      const data = await res.json().catch(() => ({}));
      const pq = data.pendingQuote;
      if (!pq) return;
      // Solo se siamo ancora sulla stessa mail/cliente (evita race condition
      // se l'utente ha già cambiato schermata quando la risposta arriva)
      if (!this.selectedEmail || this.extractEmailAddress(this.selectedEmail.from) !== email) return;
      const bs = this.emailBookingState;
      if (pq.check_in) bs.checkIn = pq.check_in;
      if (pq.check_out) bs.checkOut = pq.check_out;
      if (pq.rate_per_night != null) { bs.ratePerNight = String(pq.rate_per_night); bs.rateTouched = true; }
      if (pq.discount_percent != null) { bs.discountPercent = String(pq.discount_percent); bs.discountTouched = true; }
      if (pq.guests) bs.guests = pq.guests;
      if (pq.rooms) { bs.rooms = pq.rooms; bs.roomsTouched = true; }
      bs.prefilledFromQuote = true;
      this.checkAvailability('emailBookingState');
      bs.quoteSentAt = pq.created_at;
      this.render();
    } catch (e) {}
  }

  async sendResponse(idx) {
    const email = this.selectedEmail;
    const respItem = email.responses[idx];
    const resp = (respItem && typeof respItem === 'object') ? respItem.text : respItem;
    const to = (email.from.match(/[\w.+-]+@[\w.-]+\.\w+/) || [])[0] || '';
    // "Re:" una volta sola, anche se l'oggetto ce l'ha già (prima: "RE: Re: …")
    let subject = /^\s*re\s*:/i.test(email.subject || '') ? email.subject : 'Re: ' + (email.subject || '');
    let deliverTo;
    try {
      deliverTo = this.redirectIfTest(to);
    } catch (e) {
      this.error = e.message;
      this.render();
      return;
    }
    if (deliverTo !== to) subject = `[TEST per ${to}] ` + subject;
    this.sendingIdx = idx;
    this.error = null;
    this.render();
    try {
      const res = await fetch('/api/send-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        // Le risposte di test (deviate alla tua casella) non entrano nel thread dell'ospite finto
        body: JSON.stringify(deliverTo === to
          ? { to: deliverTo, subject, body: resp, threadId: email.threadId || null, inReplyTo: email.messageId || null }
          : { to: deliverTo, subject, body: resp })
      });
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error || ('Invio fallito (status ' + res.status + ')'));
      }
      const data = await res.json();
      email.sentIdx = idx;
      email.sentThreadId = data.threadId || null;
      email.sentConfirmed = !!data.confirmed;
      this.resolvedIds.add(email.id);
      this.saveResolvedIds();
      this.showSendConfirmation(data.confirmed);
      fetch('/api/mark-resolved', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ emailId: email.id })
      }).catch(() => {});
    } catch (e) {
      this.error = e.message;
    }
    this.sendingIdx = null;
    this.render();
  }

  showSendConfirmation(confirmed) {
    const overlay = document.getElementById('confirmOverlay');
    const icon = confirmed ? DLG('check', 'green') : DLG('alert', 'amber');
    const title = confirmed ? 'Email inviata e confermata' : 'Email inviata';
    const desc = confirmed
      ? 'Verificato direttamente su Gmail: il messaggio risulta davvero nella posta inviata.'
      : 'Il messaggio è stato inviato, ma la verifica automatica su Gmail non è riuscita in questo momento. Puoi controllare manualmente se vuoi esserne certo.';
    overlay.innerHTML = `
      <div class="confirm-box">
        ${icon}
        <h3>${title}</h3>
        <p>${desc}</p>
        <button class="btn btn-primary" onclick="app.closeConfirmModal()">OK</button>
      </div>`;
    overlay.classList.remove('hidden');
  }

  closeConfirmModal() {
    document.getElementById('confirmOverlay').classList.add('hidden');
  }

  // Dialog di conferma generico usato prima di ogni cancellazione (✕): mostra
  // Annulla + un bottone d'azione rosso, ed esegue onConfirm solo se confermato.
  showConfirmDialog({ title, desc, confirmLabel = 'Elimina', confirmColor = 'var(--red)', icon = 'trash', onConfirm }) {
    this._pendingConfirmAction = onConfirm;
    const overlay = document.getElementById('confirmOverlay');
    overlay.innerHTML = `
      <div class="confirm-box">
        ${DLG(icon, confirmColor === 'var(--red)' ? 'red' : 'neutral')}
        <h3>${title}</h3>
        <p>${desc}</p>
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="app.cancelConfirmDialog()">Annulla</button>
          <button class="btn" style="background:${confirmColor}; color:white;" onclick="app.runConfirmedAction()">${confirmLabel}</button>
        </div>
      </div>`;
    overlay.classList.remove('hidden');
  }

  cancelConfirmDialog() {
    this._pendingConfirmAction = null;
    document.getElementById('confirmOverlay').classList.add('hidden');
  }

  runConfirmedAction() {
    const action = this._pendingConfirmAction;
    this._pendingConfirmAction = null;
    document.getElementById('confirmOverlay').classList.add('hidden');
    if (action) action();
  }

  extractEmailAddress(fromStr) {
    return (fromStr.match(/[\w.+-]+@[\w.-]+\.\w+/) || [])[0] || '';
  }

  extractGuestName(fromStr) {
    const match = fromStr.match(/^"?([^"<]+)"?\s*<[^>]+>/);
    if (match) return match[1].trim();
    return this.extractEmailAddress(fromStr).split('@')[0] || fromStr;
  }

  toggleQuoteForm() {
    if (!this.quoteState.open && !this.quoteState.guestName) {
      this.quoteState.guestName = this.extractGuestName(this.selectedEmail.from);
    }
    const opening = !this.quoteState.open;
    this.quoteState.open = opening;
    this.render();
    if (opening && !this.quoteState.guestHistory.length) {
      const guestEmail = this.extractEmailAddress(this.selectedEmail.from);
      if (guestEmail) this.checkGuestHistory('quoteState', guestEmail);
    }
  }

  selectGuests(stateKey, n) {
    this.updateQuoteField(stateKey, 'guests', n);
    this.render();
  }

  // Camere aperte: con 3+ ospiti sempre 2; altrimenti la scelta a mano, o 1
  roomsFor(qs) {
    if (!PR) return qs.guests >= 3 ? 2 : (qs.rooms || 1);
    if (Number(qs.guests) >= PR.PRICING.secondRoomFromGuests) return 2;
    return qs.roomsTouched && qs.rooms ? qs.rooms : PR.suggestedRooms(qs.guests);
  }

  selectRooms(stateKey, n) {
    const qs = this[stateKey];
    qs.rooms = n; qs.roomsTouched = true;
    this.updateQuoteField(stateKey, 'rooms', n);
    this.render();
  }

  toggleSecurityDeposit(stateKey) {
    this.updateQuoteField(stateKey, 'withSecurityDeposit', !this[stateKey].withSecurityDeposit);
    this.render();
  }

  // Parametri per il listino unico (stessi nomi usati dal server)
  quoteParams(stateKey) {
    const qs = this[stateKey];
    return {
      checkIn: qs.checkIn, checkOut: qs.checkOut,
      guests: qs.guests, rooms: this.roomsFor(qs),
      rateOverride: qs.rateTouched && qs.ratePerNight !== '' ? parseFloat(qs.ratePerNight) : undefined,
      discountPercent: qs.discountPercent === '' ? undefined : parseFloat(qs.discountPercent),
      withSecurityDeposit: stateKey !== 'emailBookingState' && !!qs.withSecurityDeposit
    };
  }

  computeLocalQuote(stateKey) {
    if (!PR) throw new Error('Listino prezzi non caricato: ricarica la pagina');
    return PR.computeQuote(this.quoteParams(stateKey));
  }

  renderPricingFields(stateKey, isQuote) {
    const qs = this[stateKey];
    const rooms = this.roomsFor(qs);
    const forced = PR && Number(qs.guests) >= PR.PRICING.secondRoomFromGuests;
    const P = PR ? PR.PRICING : null;
    const previewId = { quoteState: 'quotePreview', standaloneQuoteState: 'standaloneQuotePreview', emailBookingState: 'emailBookingPreview' }[stateKey];
    return `
      ${this.renderGuestSelector(stateKey, qs.guests)}
      <span class="form-label">Camere</span>
      <div class="guest-selector">
        <div class="pay-btn ${rooms === 1 ? 'active-dark' : ''} ${forced ? 'disabled' : ''}" onclick="${forced ? '' : `app.selectRooms('${stateKey}', 1)`}">Solo padronale</div>
        <div class="pay-btn ${rooms === 2 ? 'active-dark' : ''}" onclick="app.selectRooms('${stateKey}', 2)">Due camere</div>
      </div>
      <div class="field-hint">${forced ? `Con ${qs.guests} ospiti serve anche la seconda camera.` : (P ? `Seconda camera: +${EUR(P.seasons[1].secondRoomPerNight)}/+${EUR(P.seasons[0].secondRoomPerNight)} a notte (bassa/alta) e ${EUR(P.secondRoomOneOff)} di biancheria.` : '')}</div>
      <div style="display:flex; gap:10px;">
        <div style="flex:1; min-width:0;">
          <span class="form-label">Tariffa/notte (€)</span>
          <input type="number" step="0.01" class="form-input" placeholder="da listino" value="${qs.rateTouched ? qs.ratePerNight : ''}" oninput="app.updateQuoteField('${stateKey}','ratePerNight', this.value)">
        </div>
        <div style="flex:1; min-width:0;">
          <span class="form-label">Sconto (%)</span>
          <input type="number" step="1" min="0" max="100" class="form-input" value="${qs.discountPercent}" oninput="app.updateQuoteField('${stateKey}','discountPercent', this.value)">
        </div>
      </div>
      <div class="field-hint">Tariffa vuota = listino, notte per notte secondo la stagione. Sconto suggerito: 15% da 7 notti, 30% da 30.</div>
      ${isQuote && P ? `
      <div class="switch-row" onclick="app.toggleSecurityDeposit('${stateKey}')">
        <span><b>Cauzione ${EUR(P.securityDeposit)}</b><small>Bonifico prima dell'arrivo, restituita dopo il check-out</small></span>
        <span class="switch ${qs.withSecurityDeposit ? 'on' : ''}"><i></i></span>
      </div>` : ''}
      <div class="quote-preview" id="${previewId}"></div>`;
  }

  renderGuestSelector(stateKey, current) {
    const opts = [1, 2, 3, 4];
    return `
      <span class="form-label">Numero ospiti</span>
      <div class="guest-selector">
        ${opts.map(n => `<div class="guest-btn ${current === n ? 'active' : ''}" onclick="app.selectGuests('${stateKey}', ${n})">${n}</div>`).join('')}
      </div>`;
  }

  selectPaymentStatus(stateKey, value) {
    this[stateKey].paymentStatus = value;
    this.render();
  }

  renderPaymentSelector(stateKey, current) {
    const opts = [
      { value: 'da saldare', label: 'Da saldare' },
      { value: 'acconto versato', label: 'Acconto' },
      { value: 'saldata', label: 'Saldata' }
    ];
    return `
      <span class="form-label">Pagamento</span>
      <div class="pay-selector">
        ${opts.map(o => `<div class="pay-btn pay-${o.value.replace(/\s+/g, '-')} ${current === o.value ? 'active' : ''}" onclick="app.selectPaymentStatus('${stateKey}', '${o.value}')">${o.label}</div>`).join('')}
      </div>`;
  }

  // ---------- Storico ospite: avvisa se chi sta prenotando ha già avuto
  // problemi in soggiorni precedenti (vedi note salvate al check-out) ----------
  async checkGuestHistory(stateKey, email) {
    if (!email) { this[stateKey].guestHistory = []; return; }
    try {
      const res = await fetch('/api/booking?guestEmail=' + encodeURIComponent(email));
      const data = await res.json().catch(() => ({}));
      const withNotes = (data.bookings || []).filter(b => b.notes);
      // Deduplica per data+testo: se ci sono più prenotazioni con la stessa
      // identica nota (es. da un doppio tap durante un test), mostrala una volta sola.
      const seen = new Set();
      this[stateKey].guestHistory = withNotes.filter(b => {
        const key = (b.check_out || '') + '|' + b.notes;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    } catch (e) {
      this[stateKey].guestHistory = [];
    }
    this.render();
  }

  renderGuestHistoryBanner(guestHistory) {
    if (!guestHistory || !guestHistory.length) return '';
    const items = guestHistory.map(h =>
      `<div>${this.formatQuoteDate(h.check_out)}: ${this.escape(h.notes)}</div>`
    ).join('');
    return `<div class="discrepancy-banner"><b>Questo ospite ha già soggiornato — note dai check-out precedenti:</b>${items}</div>`;
  }

  // ---------- Pop-up di revisione check-out: appare da solo quando una
  // prenotazione ha raggiunto la data di check-out e non è ancora stata
  // confermata come "andata bene" o "andata male" ----------
  async checkPendingCheckoutReviews() {
    try {
      const res = await fetch('/api/booking?needsReview=true');
      const data = await res.json().catch(() => ({}));
      this.checkoutReviewQueue = data.bookings || [];
    } catch (e) {
      this.checkoutReviewQueue = [];
    }
    this.showNextCheckoutReview();
  }

  showNextCheckoutReview() {
    if (!this.checkoutReviewQueue.length) return;
    this.currentCheckoutReview = this.checkoutReviewQueue[0];
    this.checkoutNoteDraft = '';
    this.renderCheckoutReviewModal();
  }

  renderCheckoutReviewModal() {
    const b = this.currentCheckoutReview;
    const overlay = document.getElementById('confirmOverlay');
    const checkOutFmt = this.formatQuoteDate(b.check_out);
    overlay.innerHTML = `
      <div class="confirm-box">
        ${DLG('flag')}
        <h3>Com'è andato il soggiorno?</h3>
        <p>${this.escape(b.guest_name)} — check-out del ${checkOutFmt}${b.code ? ' · ' + this.escape(b.code) : ''}</p>
        <div class="btn-row">
          <button class="btn btn-send" onclick="app.reviewCheckoutOk()">Tutto ok</button>
          <button class="btn btn-warn" onclick="app.reviewCheckoutProblem()">Problemi</button>
        </div>
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="app.skipCheckoutReview()">Chiedimelo più tardi</button>
        </div>
      </div>`;
    overlay.classList.remove('hidden');
  }

  async reviewCheckoutOk() {
    const b = this.currentCheckoutReview;
    await this.saveCheckoutReview(b, true, null);
    this.showNextBookingInfo(b, () => this.advanceCheckoutQueue());
  }

  reviewCheckoutProblem() {
    const b = this.currentCheckoutReview;
    const overlay = document.getElementById('confirmOverlay');
    overlay.innerHTML = `
      <div class="confirm-box">
        ${DLG('alert', 'amber')}
        <h3>Cosa è successo?</h3>
        <p>Questa nota resta legata a ${this.escape(b.guest_name)} — utile se dovesse riprenotare in futuro.</p>
        <textarea class="form-input" style="min-height:90px; resize:vertical; text-align:left;" placeholder="Es. rumoroso, lamentele dai vicini, danni…" oninput="app.checkoutNoteDraft = this.value"></textarea>
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="app.skipCheckoutReview()">Salta per ora</button>
          <button class="btn btn-send" onclick="app.saveCheckoutProblemNote()">Salva nota</button>
        </div>
      </div>`;
    overlay.classList.remove('hidden');
  }

  async saveCheckoutProblemNote() {
    const b = this.currentCheckoutReview;
    await this.saveCheckoutReview(b, true, this.checkoutNoteDraft || null);
    this.showNextBookingInfo(b, () => this.advanceCheckoutQueue());
  }

  skipCheckoutReview() {
    // non segna come rivisto: ricomparirà al prossimo avvio dell'app
    this.closeConfirmModal();
    this.checkoutReviewQueue.shift();
    this.currentCheckoutReview = null;
    setTimeout(() => this.showNextCheckoutReview(), 400);
  }

  async saveCheckoutReview(booking, reviewed, note) {
    try {
      const existingNotes = booking.notes ? booking.notes + '\n' : '';
      const combinedNotes = note ? existingNotes + note : (booking.notes || null);
      const concludedAt = new Date().toISOString();
      await fetch('/api/booking', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: booking.id, status: 'conclusa', checkoutReviewed: reviewed, notes: combinedNotes, concludedAt })
      });
      const idx = this.bookings.findIndex(x => x.id === booking.id);
      if (idx !== -1) { this.bookings[idx].status = 'conclusa'; this.bookings[idx].notes = combinedNotes; this.bookings[idx].concluded_at = concludedAt; }
      this.notifyCleaningLady(booking);
    } catch (e) {}
  }

  // Orari fissi di check-out/check-in — modificabili qui se la regola cambia.
  // Check-out entro le 11:00; check-in del prossimo ospite non prima delle
  // 12:00 (un giorno libero per le pulizie, come da regola di Filippo).
  get checkoutHour() { return 11; }
  get checkinHour() { return 12; }

  hoursUntilNextCheckin(checkOutDate, nextCheckInDate) {
    const checkoutMoment = new Date(`${checkOutDate}T${String(this.checkoutHour).padStart(2, '0')}:00:00`);
    const nextCheckinMoment = new Date(`${nextCheckInDate}T${String(this.checkinHour).padStart(2, '0')}:00:00`);
    return Math.round((nextCheckinMoment - checkoutMoment) / 3600000);
  }

  formatHoursCountdown(hours) {
    if (hours <= 0) return 'check-in già iniziato o imminente';
    if (hours < 48) return `mancano ${hours} or${hours === 1 ? 'a' : 'e'}`;
    const days = Math.floor(hours / 24);
    const remHours = hours % 24;
    return `mancano ${days} giorn${days === 1 ? 'o' : 'i'}${remHours > 0 ? ` e ${remHours} or${remHours === 1 ? 'a' : 'e'}` : ''}`;
  }

  // Avvisa la persona delle pulizie che un soggiorno è terminato, incrociando
  // il calendario per dirle quanto tempo ha prima della prossima prenotazione
  // (nota: le prenotazioni non sono legate a una camera specifica, quindi se
  // ci sono più camere questo guarda la prossima in assoluto, non per forza
  // la stessa stanza appena liberata).
  async notifyCleaningLady(booking) {
    try {
      // Prenotazioni di test (indirizzo acmetest): la mail NON va alla colf vera,
      // ma alla tua casella, così vedi cosa riceverebbe senza disturbare nessuno.
      const isTest = this.isTestAddr(booking.guest_email);
      const settingsRes = await fetch('/api/auth?action=get-cleaner-email');
      const settingsData = await settingsRes.json().catch(() => ({}));
      const cleanerEmail = settingsData.cleanerEmail;
      if (!cleanerEmail && !isTest) return;
      const recipient = isTest ? this.testReplyTarget() : cleanerEmail;
      if (!recipient) return;   // per i test senza indirizzo di deviazione: meglio non inviare niente che scrivere alla colf vera

      const nextRes = await fetch('/api/booking?nextCheckinAfter=' + encodeURIComponent(booking.check_out));
      const nextData = await nextRes.json().catch(() => ({}));
      const next = nextData.nextBooking;

      const checkOutFmt = this.formatQuoteDate(booking.check_out);
      let body;
      if (!next) {
        body = `Ciao! Il soggiorno di ${booking.guest_name} a Domus 106 è terminato oggi (check-out del ${checkOutFmt}). Puoi andare a fare le pulizie quando preferisci — al momento non risultano altre prenotazioni in arrivo.`;
      } else {
        const nextCheckInFmt = this.formatQuoteDate(next.check_in);
        const hoursLeft = this.hoursUntilNextCheckin(booking.check_out, next.check_in);
        const countdown = this.formatHoursCountdown(hoursLeft);
        if (hoursLeft <= 24) {
          body = `Ciao! Il soggiorno di ${booking.guest_name} a Domus 106 è terminato oggi (check-out del ${checkOutFmt}). ⚠️ Attenzione: il prossimo ospite (${next.guest_name}) arriva il ${nextCheckInFmt} — ${countdown}, servirebbero le pulizie il prima possibile.`;
        } else {
          body = `Ciao! Il soggiorno di ${booking.guest_name} a Domus 106 è terminato oggi (check-out del ${checkOutFmt}). Puoi andare a fare le pulizie con calma: la prossima prenotazione (${next.guest_name}) arriva il ${nextCheckInFmt} — ${countdown}.`;
        }
      }

      await fetch('/api/send-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          to: recipient,
          subject: (isTest ? '[TEST] ' : '') + 'Domus 106 — check-out completato',
          body: isTest ? `(Simulazione: questa mail sarebbe andata a ${cleanerEmail || 'la persona delle pulizie'})\n\n${body}` : body
        })
      });

      // Segna che la mail è partita: da qui in poi compare il promemoria
      // "conferma che gliel'hai detto" finché non lo chiudi tu a mano.
      await fetch('/api/booking', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: booking.id, cleanerNotified: true, cleanerConfirmed: false })
      }).catch(() => {});
      const idx = this.bookings.findIndex(x => x.id === booking.id);
      if (idx !== -1) { this.bookings[idx].cleaner_notified = true; this.bookings[idx].cleaner_confirmed = false; }
      this.loadReminders();
    } catch (e) {
      // avviso best-effort: un problema qui non deve mai bloccare la chiusura della prenotazione
    }
  }

  advanceCheckoutQueue() {
    this.checkoutReviewQueue.shift();
    this.currentCheckoutReview = null;
    this.closeConfirmModal();
    setTimeout(() => this.showNextCheckoutReview(), 400);
  }

  // Dopo aver chiuso un soggiorno, mostra a Filippo (non alla colf) la
  // prossima prenotazione con un countdown in giorni. Niente orario: il
  // check-in di Domus 106 è autonomo e senza fascia oraria fissa, quindi
  // quel dato semplicemente non esiste da nessuna parte nei dati salvati.
  async showNextBookingInfo(booking, onDismiss) {
    this._nextInfoDismiss = onDismiss || null;
    let next = null;
    try {
      const nextRes = await fetch('/api/booking?nextCheckinAfter=' + encodeURIComponent(booking.check_out));
      const nextData = await nextRes.json().catch(() => ({}));
      next = nextData.nextBooking;
    } catch (e) {}

    let desc;
    if (!next) {
      desc = 'Nessuna prenotazione in arrivo al momento.';
    } else {
      const nextCheckInFmt = this.formatQuoteDate(next.check_in);
      const hoursLeft = this.hoursUntilNextCheckin(booking.check_out, next.check_in);
      const countdown = this.formatHoursCountdown(hoursLeft);
      desc = `${next.guest_name} — check-in il ${nextCheckInFmt}. ${countdown} al prossimo check-in (check-out entro le ${this.checkoutHour}:00, check-in non prima delle ${this.checkinHour}:00).`;
    }

    const overlay = document.getElementById('confirmOverlay');
    overlay.innerHTML = `
      <div class="confirm-box">
        ${DLG('calendar', 'blue')}
        <h3>Prossima prenotazione</h3>
        <p>${this.escape(desc)}</p>
        <button class="btn btn-primary" onclick="app.dismissNextBookingInfo()">OK</button>
      </div>`;
    overlay.classList.remove('hidden');
  }

  dismissNextBookingInfo() {
    document.getElementById('confirmOverlay').classList.add('hidden');
    const cb = this._nextInfoDismiss;
    this._nextInfoDismiss = null;
    if (cb) cb();
  }

  updateQuoteField(stateKey, field, value) {
    const qs = this[stateKey];
    qs[field] = value;
    if (field === 'ratePerNight') qs.rateTouched = value !== '';
    if (field === 'discountPercent') qs.discountTouched = true;
    if (field === 'emailMessage') qs.messageTouched = true;
    if (field === 'checkIn' || field === 'checkOut') { this.applySuggestedDefaults(stateKey); this.checkAvailability(stateKey); }
    // emailBookingState non ha un messaggio email da rigenerare (non invia mail,
    // serve solo a confermare una prenotazione diretta con tariffa/totale)
    const messageElIds = { quoteState: 'quoteMessage', standaloneQuoteState: 'standaloneQuoteMessage' };
    if (messageElIds[stateKey] && field !== 'emailMessage' && !qs.messageTouched) {
      qs.emailMessage = this.buildDefaultQuoteMessage(stateKey);
      const msgEl = document.getElementById(messageElIds[stateKey]);
      if (msgEl) msgEl.value = qs.emailMessage;
    }
    this.refreshQuotePreview(stateKey);
  }

  formatQuoteDate(isoDateStr) {
    if (!isoDateStr) return '';
    const d = new Date(isoDateStr + 'T00:00:00');
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('it-IT', { day: '2-digit', month: 'long', year: 'numeric' });
  }

  buildDefaultQuoteMessage(stateKey) {
    const qs = this[stateKey];
    const { guestName, checkIn, checkOut } = qs;
    if (!checkIn || !checkOut || !guestName) return '';
    let q;
    try { q = this.computeLocalQuote(stateKey); } catch (e) { return ''; }
    const checkInFmt = this.formatQuoteDate(checkIn);
    const checkOutFmt = this.formatQuoteDate(checkOut);
    return `Gentile ${guestName},

in allegato trova il preventivo richiesto per il Suo soggiorno presso Domus 106 dal ${checkInFmt} al ${checkOutFmt} (${q.nights} nott${q.nights === 1 ? 'e' : 'i'}, ${q.guests} ospit${q.guests === 1 ? 'e' : 'i'}).

Totale soggiorno: ${EUR(q.total)}${q.discountPercent > 0 ? ` (sconto ${q.discountPercent}% per soggiorni lunghi già applicato)` : ''}
Per confermare: acconto di ${EUR(q.depositAmount)} (${q.depositPercent}%).${q.securityDeposit ? `
Cauzione: ${EUR(q.securityDeposit)} con bonifico prima dell'arrivo, restituita dopo il check-out.` : ''}

Resto a disposizione per qualsiasi chiarimento.

Cordiali saluti,
Domus 106`;
  }

  computeNightsPreview(checkInStr, checkOutStr) {
    const checkIn = new Date(checkInStr + 'T00:00:00');
    const checkOut = new Date(checkOutStr + 'T00:00:00');
    const nights = Math.round((checkOut - checkIn) / 86400000);
    if (!(nights > 0)) throw new Error('Il check-out deve essere dopo il check-in');
    return nights;
  }

  suggestRatePreview(checkInStr) {
    return PR ? PR.seasonOf(checkInStr).rate : null;
  }

  applySuggestedDefaults(stateKey) {
    const qs = this[stateKey];
    const { checkIn, checkOut } = qs;
    if (!checkIn || !checkOut || !PR) return;
    try {
      const nights = PR.countNights(checkIn, checkOut);
      if (!qs.discountTouched) qs.discountPercent = String(PR.suggestedDiscount(nights));
    } catch (e) {}
  }

  // Soggiorni già presenti (ACME, Booking, Airbnb) nelle stesse date
  async checkAvailability(stateKey) {
    const qs = this[stateKey];
    const { checkIn, checkOut } = qs;
    qs.conflicts = null; qs.availabilityErrors = [];
    if (!checkIn || !checkOut || checkOut <= checkIn) return;
    const key = checkIn + checkOut;
    qs._availKey = key;
    try {
      const res = await fetch('/api/booking?' + new URLSearchParams({ availability: '1', checkIn, checkOut }));
      const data = await res.json().catch(() => ({}));
      if (qs._availKey !== key || !res.ok) return;
      qs.conflicts = data.conflicts || [];
      qs.availabilityErrors = data.errors || [];
      this.refreshQuotePreview(stateKey);
    } catch (e) {}
  }

  renderConflicts(qs) {
    if (qs.conflicts && qs.conflicts.length) {
      const items = qs.conflicts.map(c => `<li><b>${this.escape(c.source)}</b> · ${this.formatQuoteDate(c.start)} → ${this.formatQuoteDate(c.end)}${c.source === 'ACME' ? ' · ' + this.escape(c.label) : ''}</li>`).join('');
      return `<div class="error-banner" style="margin-bottom:12px;"><b>Date già occupate</b><ul class="conflict-list">${items}</ul></div>`;
    }
    const errs = qs.availabilityErrors && qs.availabilityErrors.length
      ? `<div class="discrepancy-banner" style="margin-bottom:12px;">Disponibilità non verificata del tutto: ${this.escape(qs.availabilityErrors.join('; '))}</div>` : '';
    return errs || (qs.conflicts ? `<div class="avail-ok">${ICON('check')} Date libere su ACME${qs.availabilityErrors && qs.availabilityErrors.length ? '' : ', Booking e Airbnb collegati'}</div>` : '');
  }

  refreshQuotePreview(stateKey) {
    const previewElIds = { quoteState: 'quotePreview', standaloneQuoteState: 'standaloneQuotePreview', emailBookingState: 'emailBookingPreview' };
    const previewEl = document.getElementById(previewElIds[stateKey]);
    if (!previewEl) return;
    const qs = this[stateKey];
    if (!qs.checkIn || !qs.checkOut) { previewEl.innerHTML = ''; return; }
    try {
      const q = this.computeLocalQuote(stateKey);
      const misto = q.groups.length > 1;

  buildICS({ guestName, checkIn, checkOut, guestEmail, total, guests, paymentStatus, notes, code }) {
    const fmtDate = (d) => d.replace(/-/g, '');
    const uid = `acme-${checkIn}-${guestName.replace(/\s+/g, '')}-${Date.now()}@domus106`;
    const dtstamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
    const paymentLabel = paymentStatus === 'saldata' ? 'Saldata'
      : paymentStatus === 'acconto versato' ? 'Acconto versato' : 'DA SALDARE';
    const paymentBadge = paymentStatus === 'saldata' ? '✅' : (paymentStatus === 'acconto versato' ? '💶' : '⚠️');
    const descParts = [];
    descParts.push('Pagamento: ' + paymentLabel);
    if (guests) descParts.push('Ospiti: ' + guests);
    if (guestEmail) descParts.push('Email ospite: ' + guestEmail);
    if (total) descParts.push('Totale: ' + EUR(total));
    if (code) descParts.push('Codice: ' + code);
    if (notes) descParts.push('Note: ' + notes);
    descParts.push('Creato da ACME Inbox Manager');
    const lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Domus 106//ACME//IT',
      'CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      `UID:${uid}`,
      `DTSTAMP:${dtstamp}`,
      `DTSTART;VALUE=DATE:${fmtDate(checkIn)}`,
      `DTEND;VALUE=DATE:${fmtDate(checkOut)}`,
      `SUMMARY:${paymentBadge} ${guestName} — Domus 106 (${paymentLabel})`,
      `DESCRIPTION:${descParts.join('\\n')}`,
      'END:VEVENT',
      'END:VCALENDAR'
    ];
    return lines.join('\r\n');
  }

  async confirmBooking(stateKey, force = false) {
    const qs = this[stateKey];
    const { guestName, checkIn, checkOut } = qs;
    if (!guestName || !checkIn || !checkOut) {
      this.error = 'Compila nome ospite, check-in e check-out prima di confermare';
      this.render();
      return;
    }
    let q;
    try { q = this.computeLocalQuote(stateKey); } catch (e) { this.error = e.message; this.render(); return; }
    const total = q.total;

    // Controllo doppie prenotazioni: sempre aggiornato al momento della conferma
    if (!force) {
      qs.confirming = true; this.render();
      await this.checkAvailability(stateKey);
      qs.confirming = false;
      if (qs.conflicts && qs.conflicts.length) {
        this.render();
        const list = qs.conflicts.map(c => `${this.escape(c.source)}: ${this.formatQuoteDate(c.start)} → ${this.formatQuoteDate(c.end)}`).join('<br>');
        this.showConfirmDialog({
          title: 'Date già occupate',
          desc: `Queste notti risultano già prese:<br>${list}<br><br>Salvare lo stesso?`,
          confirmLabel: 'Salva lo stesso',
          icon: 'alert',
          onConfirm: () => this.confirmBooking(stateKey, true)
        });
        return;
      }
    }
    // Incassato iniziale coerente con lo stato del pagamento scelto
    const pay = qs.paymentStatus || 'da saldare';
    const amountPaid = pay === 'saldata' ? total : (pay === 'acconto versato' ? q.depositAmount : 0);

    const hasSourceEmail = (stateKey === 'quoteState' || stateKey === 'emailBookingState') && this.selectedEmail;
    const guestEmail = hasSourceEmail
      ? this.extractEmailAddress(this.selectedEmail.from)
      : (qs.recipientEmail || '').trim();

    qs.confirming = true;
    this.error = null;
    this.render();

    // 1) Salva PRIMA sul server, mentre la pagina è ancora sicuramente in
    // primo piano — evita che l'apertura del foglio "Aggiungi a Calendario"
    // metta in pausa la pagina proprio mentre la richiesta è in volo (causa
    // del blocco su "Un attimo…"). Un timeout di sicurezza a 12s impedisce
    // comunque che il bottone resti bloccato all'infinito in caso di rete
    // lenta o assente.
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 12000);
    let savedBooking = null;
    try {
      const res = await fetch('/api/booking', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        signal: controller.signal,
        body: JSON.stringify({
          guestName, guestEmail, checkIn, checkOut, total,
          notes: qs.notes || null,
          guests: qs.guests || null,
          paymentStatus: qs.paymentStatus || 'da saldare',
          ratePerNight: q.ratePerNight,
          discountPercent: q.discountPercent || null,
          rooms: q.rooms,
          amountPaid,
          sourceFrom: hasSourceEmail ? this.selectedEmail.from : null,
          sourceSubject: hasSourceEmail ? this.selectedEmail.subject : null,
          sourceBody: hasSourceEmail ? (this.selectedEmail.body || '').slice(0, 300) : null
        })
      });
      clearTimeout(timeoutId);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Salvataggio prenotazione fallito');
      savedBooking = data.booking || null;
    } catch (e) {
      clearTimeout(timeoutId);
      const msg = e.name === 'AbortError'
        ? 'Il salvataggio sta impiegando troppo tempo. Controlla la connessione e riprova.'
        : e.message;
      this.error = msg;
      qs.confirming = false;
      this.showBookingSavedConfirmation(false, null, msg);
      this.render();
      return;
    }

    // 2) Solo ORA, con il salvataggio già confermato, apriamo il foglio
    // "Aggiungi a Calendario" — se la pagina va in pausa da qui in poi non
    // ha più conseguenze, il dato è già al sicuro sul server.
    //
    // IMPORTANTE: niente più Blob generato lato client — su iOS, quando l'app
    // gira come PWA installata (aggiunta alla Home), i download via Blob
    // spesso non arrivano mai al foglio nativo "Aggiungi a Calendario" e
    // sembrano "non succedere niente". Una vera richiesta di rete verso un
    // endpoint che risponde con Content-Type: text/calendar viene invece
    // sempre riconosciuta correttamente da iOS.
    const icsParams = new URLSearchParams({
      ics: '1',
      guestName, checkIn, checkOut,
      guestEmail: guestEmail || '',
      total: total != null ? String(total) : '',
      guests: qs.guests || '',
      paymentStatus: qs.paymentStatus || 'da saldare',
      notes: qs.notes || '',
      code: (savedBooking && savedBooking.code) || ''
    });
    window.location.href = '/api/booking?' + icsParams.toString();

    qs.confirmed = true;
    qs.confirmedCode = (savedBooking && savedBooking.code) || null;
    qs.confirming = false;
    this.showBookingSavedConfirmation(true, qs.confirmedCode);
    // La mail di origine è "gestita": sparisce dal box Richieste prenotazioni,
    // esattamente come quando si invia una risposta o si scarta manualmente.
    if (hasSourceEmail) {
      this.resolvedIds.add(this.selectedEmail.id);
      this.saveResolvedIds();
      fetch('/api/mark-resolved', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ emailId: this.selectedEmail.id })
      }).catch(() => {});
      if (guestEmail) {
        fetch('/api/booking', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ deletePendingQuoteEmail: guestEmail })
        }).catch(() => {});
      }
    }
    this.render();
  }

  async sendQuote(stateKey) {
    const qs = this[stateKey];
    const { checkIn, checkOut, guestName, emailMessage } = qs;
    if (!checkIn || !checkOut || !guestName.trim()) {
      this.error = 'Compila nome ospite e date prima di inviare';
      this.render();
      return;
    }
    let q;
    try { q = this.computeLocalQuote(stateKey); } catch (e) { this.error = e.message; this.render(); return; }
    const to = stateKey === 'quoteState'
      ? this.extractEmailAddress(this.selectedEmail.from)
      : (qs.recipientEmail || '').trim();
    if (!to) {
      this.error = 'Inserisci l\'indirizzo email del destinatario';
      this.render();
      return;
    }
    let deliverTo;
    try {
      deliverTo = this.redirectIfTest(to);
    } catch (e) {
      this.error = e.message;
      this.render();
      return;
    }
    qs.sending = true;
    this.error = null;
    this.render();
    try {
      const res = await fetch('/api/quote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'send', to: deliverTo, guestName, emailMessage, ...this.quoteParams(stateKey) })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.error || ('Invio fallito (status ' + res.status + ')'));
      }
      qs.sending = false;
      qs.sent = true;
      this.showQuoteConfirmation(data.confirmed, data.total);
      // Salva il preventivo come "in sospeso" per questo cliente, così quando
      // risponde per confermare non serve ridigitare tariffa/sconto/date.
      fetch('/api/booking', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          savePendingQuote: true,
          guestEmail: to, guestName, checkIn, checkOut,
          // tariffa salvata solo se forzata a mano: altrimenti vale il listino
          ratePerNight: qs.rateTouched ? (parseFloat(qs.ratePerNight) || null) : null,
          discountPercent: q.discountPercent || null,
          guests: qs.guests || null,
          rooms: q.rooms,
          total: data.total,
          sourceSubject: this.selectedEmail ? this.selectedEmail.subject : null
        })
      }).catch(() => {});
    } catch (e) {
      qs.sending = false;
      this.error = e.message;
    }
    this.render();
  }

  urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  async checkPushStatus() {
    try {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      this.pushEnabled = !!sub;
    } catch (e) {}
  }

  async togglePushNotifications() {
    if (this.pushEnabled) { await this.disablePush(); } else { await this.enablePush(); }
  }

  async enablePush() {
    this.error = null;
    try {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        this.error = 'Le notifiche push non sono supportate su questo browser/dispositivo';
        this.render();
        return;
      }
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        this.error = 'Permesso notifiche negato dal telefono';
        this.render();
        return;
      }
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: this.urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
      await fetch('/api/push-subscription', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'save', subscription: sub })
      });
      this.pushEnabled = true;
    } catch (e) {
      this.error = 'Attivazione notifiche fallita: ' + e.message;
    }
    this.render();
  }

  async disablePush() {
    this.error = null;
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (sub) {
        await fetch('/api/push-subscription', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'delete', endpoint: sub.endpoint })
        });
        await sub.unsubscribe();
      }
      this.pushEnabled = false;
    } catch (e) {
      this.error = 'Disattivazione fallita: ' + e.message;
    }
    this.render();
  }

      const res = await fetch('/api/auth?action=get-cleaner-email');
      const data = await res.json().catch(() => ({}));
      current = data.cleanerEmail || '';
    } catch (e) {}
    const val = window.prompt('Email della persona che fa le pulizie:', current);
    if (val === null) return; // annullato
    try {
      await fetch('/api/auth?action=save-cleaner-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cleanerEmail: val.trim() })
      });
    } catch (e) {}
  }

  renderDashboard() {
    const entries = Object.entries(CATEGORY_META);
    const totalOpen = entries.reduce((n, [cat]) => n + this.unresolvedCount(cat), 0);

    // Tre anelli in stile Whoop: il riempimento è la quota sul totale da gestire
    const ringCats = ['Lamentela', 'Da verificare', 'Prenotazione'];
    const ringLabel = { 'Lamentela': 'Urgenti', 'Da verificare': 'Verifica', 'Prenotazione': 'Richieste' };
    const C = 2 * Math.PI * 38;
    const rings = ringCats.map(cat => {
      const meta = CATEGORY_META[cat];
      const count = this.unresolvedCount(cat);
      const frac = totalOpen > 0 ? Math.max(count / totalOpen, count > 0 ? 0.06 : 0) : 0;
      return `
        <div class="ring ${count === 0 ? 'zero' : ''}" onclick="app.openCategory('${cat}')">
          <div class="ring-svg">
            <svg viewBox="0 0 84 84"><circle class="track" cx="42" cy="42" r="38"/>
              <circle class="arc" cx="42" cy="42" r="38" style="stroke:var(--${meta.color}); stroke-dasharray:${(frac * C).toFixed(1)} ${C.toFixed(1)}"/></svg>
            <div class="val">${count}</div>
          </div>
          <div class="lbl">${ringLabel[cat]}</div>
        </div>`;
    }).join('');

    const metrics = entries.filter(([cat]) => !ringCats.includes(cat)).map(([cat, meta]) => {
      const count = this.unresolvedCount(cat);
      return `
        <div class="metric ${count === 0 ? 'zero' : ''}" onclick="app.openCategory('${cat}')">
          <span class="bar bg-${meta.color}"></span>
          <span class="m-label">${meta.label || cat}</span>
          <span class="m-count">${count}</span>
          <span class="m-chev">${this.icon('chev')}</span>
        </div>`;
    }).join('');

    const updatedText = this.lastUpdated
      ? 'Aggiornato ' + this.lastUpdated.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })
      : '';
    const today = this.capitalize(new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' }));

    const reminderCount = this.reminderCount();
    const row = (onclick, icon, label, badge) => `
        <div class="settings-row" onclick="${onclick}">
          <span class="${badge ? 'settings-icon-badge' : 'settings-icon'}">${this.icon(icon)}</span>
          <span class="settings-label">${label}</span>
          <span class="settings-chevron">${this.icon('chev')}</span>
        </div>`;

    return `
      <div class="topbar" style="display:flex; align-items:flex-start; justify-content:space-between;">
        <div><div class="eyebrow">Domus 106 · ${today}</div><h1>ACME</h1></div>
        <button class="reminder-badge" onclick="app.openReminders()" title="Promemoria">
          ${this.icon('bell')}${reminderCount > 0 ? `<span class="reminder-count">${reminderCount}</span>` : ''}
        </button>
      </div>
      ${this.error ? `<div class="error-banner">${this.escape(this.error)}</div>` : ''}
      <div class="rings">${rings}</div>
      <div class="metrics">${metrics}</div>

      <div class="section-title">Gestione</div>
      <div class="settings-card">
        ${row('app.openStandaloneQuote()', 'doc', 'Genera preventivo', true)}
        ${row('app.openBookingsList()', 'calendar', 'Prenotazioni confermate', true)}
        ${row('app.openBookingHistory()', 'archive', 'Storico prenotazioni', true)}
        ${row('app.openStatistics()', 'chart', 'Statistiche', true)}
        ${row('app.openCalendarSettings()', 'calendar', 'Calendari Booking e Airbnb', true)}
      </div>

      <div class="refresh-row">
        <div class="status">${updatedText}</div>
        <button class="icon-btn" onclick="app.loadEmails()" title="Aggiorna">${this.icon('refresh')}</button>
      </div>
      <div class="settings-card">
        ${row('app.resetKey()', 'key', 'Cambia chiave API')}
        ${row('app.reconnectGmail()', 'mail', 'Riconnetti Gmail')}
        ${row('app.togglePushNotifications()', this.pushEnabled ? 'bellOff' : 'bell', this.pushEnabled ? 'Disattiva notifiche' : 'Attiva notifiche')}
        ${row('app.setCleanerEmail()', 'broom', 'Email colf/pulizie')}
        ${row('app.reportProblem()', 'bug', 'Segnala un problema')}
        ${row('app.openTestLab()', 'flask', 'Laboratorio di test')}
      </div>`;
  }

    const showQuickConclude = !isHistory && status !== 'conclusa' && status !== 'cancellata';

              : `<button class="dismiss-btn" title="Riporta tra le prenotazioni in corso" onclick='event.stopPropagation(); app.restoreBookingToActive(${b.id})'>${ICON('undo')}</button>`)
          : ''}

          ${b.total ? `<div class="total">${EUR(b.total)}</div>` : ''}
        </div>
        ${b.rate_per_night ? `<div class="rate-info">${EUR(b.rate_per_night)}/notte${b.discount_percent ? ' · sconto ' + b.discount_percent + '%' : ''} · ${this.bookingRooms(b) === 2 ? '2 camere' : '1 camera'}</div>` : ''}
        <div class="dates"><b>${checkInFmt}</b> → <b>${checkOutFmt}</b></div>
        <div class="chip-row">
          <span class="chip ${statusClass}">${this.escape(status)}</span>
          <span class="chip ${paymentClass}">${paymentLabel}</span>
          ${b.total && this.dueOf(b) > 0 && status !== 'cancellata' && payment !== 'saldata' ? `<span class="chip chip-due">da incassare ${EUR(this.dueOf(b))}</span>` : ''}
          ${b.guests ? `<span class="chip chip-guests">${ICON('user')} ${b.guests}</span>` : ''}
          ${this.isTestAddr(b.guest_email) ? `<span class="chip chip-code">${ICON('flask')} test</span>` : ''}
          <span class="chip chip-code">${b.code ? this.escape(b.code) : 'senza codice'}</span>
        </div>
      </div>`;
  }

  // Raggruppa le prenotazioni dello storico per mese di check-in (più recente
  // prima), così lo storico non è un'unica lista infinita da scorrere.
  groupBookingsByMonth(list) {
    const groups = new Map();
    list.forEach(b => {
      const d = b.check_in ? new Date(b.check_in + 'T00:00:00') : null;
      const key = d && !isNaN(d) ? d.getFullYear() * 12 + d.getMonth() : -1;
      const label = d && !isNaN(d)
        ? d.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' }).replace(/^./, c => c.toUpperCase())
        : 'Senza data';
      if (!groups.has(key)) groups.set(key, { label, items: [] });
      groups.get(key).items.push(b);
    });
    return [...groups.entries()]
      .sort((a, z) => z[0] - a[0])
      .map(([, g]) => {
        g.items.sort((a, z) => (z.check_in || '').localeCompare(a.check_in || ''));
        return g;
      });
  }

  renderBookingRows() {
    const isHistory = this.view === 'bookingHistory';
    const list = this.filteredBookings(isHistory);
    if (this.bookingsLoading) {
      return `<div class="loading"><div class="spinner"></div>Carico le prenotazioni…</div>`;
    }
    if (!list.length) {
      return `<div class="empty">${this.bookingSearchQuery ? 'Nessuna prenotazione trovata' : (isHistory ? 'Nessuna prenotazione conclusa ancora' : 'Nessuna prenotazione confermata ancora')}</div>`;
    }
    if (!isHistory) {
      return list.map(b => this.renderBookingRow(b, false)).join('');
    }
    return this.groupBookingsByMonth(list).map(g => `
      <div class="section-title">${this.escape(g.label)} · ${g.items.length}</div>
      ${g.items.map(b => this.renderBookingRow(b, true)).join('')}
    `).join('');
  }

  quickConcludeBooking(id) {
    const booking = this.bookings.find(b => b.id === id);
    if (!booking) return;
    this.pendingConcludeBooking = booking;
    this.checkoutNoteDraft = '';
    const overlay = document.getElementById('confirmOverlay');
    overlay.innerHTML = `
      <div class="confirm-box">
        ${DLG('flag')}
        <h3>Sei sicuro di voler chiudere questa prenotazione?</h3>
        <p>${this.escape(booking.guest_name)} passerà nello storico.</p>
        <div class="review-tab">Il soggiorno è andato bene?</div>
        <div class="btn-row">
          <button class="btn btn-send" onclick="app.quickConcludeGood()">Sì</button>
          <button class="btn btn-warn" onclick="app.quickConcludeBad()">No</button>
        </div>
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="app.cancelConfirmDialog()">Annulla</button>
        </div>
      </div>`;
    overlay.classList.remove('hidden');
  }

  async quickConcludeGood() {
    const booking = this.pendingConcludeBooking;
    this.closeConfirmModal();
    await this.finalizeBookingConclusion(booking, null);
  }

  quickConcludeBad() {
    const booking = this.pendingConcludeBooking;
    const overlay = document.getElementById('confirmOverlay');
    overlay.innerHTML = `
      <div class="confirm-box">
        ${DLG('alert', 'amber')}
        <h3>Cosa è successo?</h3>
        <p>Questa nota resta legata a ${this.escape(booking.guest_name)} — utile se dovesse riprenotare in futuro.</p>
        <textarea class="form-input" style="min-height:90px; resize:vertical; text-align:left;" placeholder="Es. rumoroso, lamentele dai vicini, danni…" oninput="app.checkoutNoteDraft = this.value"></textarea>
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="app.cancelConfirmDialog()">Annulla</button>
          <button class="btn btn-send" onclick="app.quickConcludeBadSave()">Salva e concludi</button>
        </div>
      </div>`;
    overlay.classList.remove('hidden');
  }

  async quickConcludeBadSave() {
    const booking = this.pendingConcludeBooking;
    this.closeConfirmModal();
    await this.finalizeBookingConclusion(booking, this.checkoutNoteDraft || null);
  }

  async finalizeBookingConclusion(booking, note) {
    const combinedNotes = note ? (booking.notes ? booking.notes + '\n' + note : note) : (booking.notes || null);
    const concludedAt = new Date().toISOString();
    try {
      await fetch('/api/booking', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: booking.id, status: 'conclusa', checkoutReviewed: true, notes: combinedNotes, concludedAt })
      });
    } catch (e) {}
    const idx = this.bookings.findIndex(x => x.id === booking.id);
    if (idx !== -1) {
      this.bookings[idx].status = 'conclusa';
      this.bookings[idx].checkout_reviewed = true;
      this.bookings[idx].notes = combinedNotes;
      this.bookings[idx].concluded_at = concludedAt;
    }
    this.pendingConcludeBooking = null;
    const area = document.getElementById('bookingResultsArea');
    if (area) area.innerHTML = this.renderBookingRows(); else this.render();
    this.notifyCleaningLady(booking);
    this.showNextBookingInfo(booking);
  }

  renderBookingsList() {
    return this.renderBookingListView(false, 'Prenotazioni confermate', 'Cerca per codice o nome ospite…');
  }

  renderBookingHistory() {
    return this.renderBookingListView(true, 'Storico prenotazioni', 'Cerca nello storico…');
  }

  renderBookingListView(isHistory, title, placeholder) {
    return `
      <div class="list-header">
        <div class="back" onclick="app.goBack()">‹ ACME</div>
      </div>
      ${this.error ? `<div class="error-banner">${this.escape(this.error)}</div>` : ''}
      <div class="topbar"><div class="eyebrow">Domus 106</div><h1>${title}</h1></div>
      <div class="search-bar">
        <input type="text" id="bookingSearchInput" placeholder="${placeholder}" value="${this.escape(this.bookingSearchQuery)}" oninput="app.updateBookingSearch(this.value)">
      </div>
      <div id="bookingResultsArea">${this.renderBookingRows()}</div>`;
  }

  renderBookingDetail() {
    const b = this.selectedBooking;
    const checkInFmt = this.formatQuoteDate(b.check_in);
    const checkOutFmt = this.formatQuoteDate(b.check_out);
    const hasSource = b.source_subject || b.source_from || b.source_body;
    const locked = this.isBookingLocked(b);
    const statusOptions = BOOKING_STATUSES.map(s =>
      `<option value="${s}" ${this.bookingStatusDraft === s ? 'selected' : ''}>${s.charAt(0).toUpperCase() + s.slice(1)}</option>`
    ).join('');
    const paymentOptions = [
      ['da saldare', 'Da saldare'], ['acconto versato', 'Acconto versato'], ['saldata', 'Saldata']
    ].map(([v, l]) => `<option value="${v}" ${this.bookingPaymentDraft === v ? 'selected' : ''}>${l}</option>`).join('');

    return `
      <div class="list-header">
        <div class="back" onclick="app.goBack()">‹ Prenotazioni</div>
      </div>
      ${this.error ? `<div class="error-banner">${this.escape(this.error)}</div>` : ''}
      <div class="detail-card">
        <div class="code-hero">
          <div class="form-label" style="margin-bottom:0;">Codice prenotazione</div>
          <div class="code-value">${this.escape(b.code || '—')}</div>
          <div style="margin-top:8px;">
            <button class="btn btn-secondary" style="width:auto; padding:8px 16px; flex:none;" onclick="app.copyBookingCode(this, '${b.code || ''}')">Copia codice</button>
          </div>
        </div>
      </div>
      <div class="detail-card">
        <div class="detail-row"><span class="label">Ospite</span>${this.escape(b.guest_name)}</div>
        ${b.guest_email ? `<div class="detail-row"><span class="label">Email</span>${this.escape(b.guest_email)}</div>` : ''}
        <div class="detail-row"><span class="label">Check-in</span><b>${checkInFmt}</b></div>
        <div class="detail-row"><span class="label">Check-out</span><b>${checkOutFmt}</b></div>
        ${b.guests ? `<div class="detail-row"><span class="label">Ospiti</span>${b.guests}</div>` : ''}
        <div class="detail-row"><span class="label">Camere</span>${this.bookingRooms(b) === 2 ? 'Due camere' : 'Solo padronale'}</div>
        ${b.total ? `<div class="detail-row"><span class="label">Totale</span>${EUR(b.total)}</div>` : ''}
        ${b.rate_per_night ? `<div class="detail-row"><span class="label">Tariffa media</span>${EUR(b.rate_per_night)}/notte</div>` : ''}
        ${b.discount_percent ? `<div class="detail-row"><span class="label">Sconto</span>${b.discount_percent}%</div>` : ''}
      </div>
      ${hasSource ? `
      <div class="section-title">Nata da questa mail</div>
      <div class="detail-card">
        <div class="source-email-box">
          ${b.source_from ? `<div>${this.escape(b.source_from)}</div>` : ''}
          ${b.source_subject ? `<div class="src-subject">${this.escape(b.source_subject)}</div>` : ''}
          ${b.source_body ? `<div class="src-body">${this.escape(b.source_body)}</div>` : ''}
        </div>
      </div>` : ''}
      <div class="section-title">Stato, pagamento e note</div>
      <div class="detail-card">
        ${locked ? `
          <div class="discrepancy-banner">Conclusa da più di 48 ore: ora è solo consultabile, non più modificabile né ripristinabile tra le prenotazioni in corso.</div>
          <div class="detail-row"><span class="label">Stato soggiorno</span>${this.escape(b.status || 'confermata')}</div>
          <div class="detail-row"><span class="label">Stato pagamento</span>${this.escape(b.payment_status || 'da saldare')}</div>
          ${b.total ? `<div class="detail-row"><span class="label">Incassato</span>${EUR(this.paidOf(b))}${this.dueOf(b) > 0 ? ` · da incassare ${EUR(this.dueOf(b))}` : ''}</div>` : ''}
          ${b.notes ? `<div class="detail-row"><span class="label">Note</span></div><div class="original-text">${this.escape(b.notes)}</div>` : ''}
        ` : `
          <span class="form-label">Stato soggiorno</span>
          <select class="form-input" onchange="app.bookingStatusDraft = this.value">${statusOptions}</select>
          ${b.total ? `
          <span class="form-label">Incassato (€)</span>
          <div class="copy-field" style="margin-bottom:8px;">
            <input id="paidInput" type="number" step="0.01" min="0" class="form-input" value="${this.escape(this.bookingPaidDraft || '')}" placeholder="0" oninput="app.setPaidDraft(this.value)">
            <button class="btn btn-secondary" style="flex:none; padding:10px 12px;" onclick="app.quickPaid('deposit')">Acconto</button>
            <button class="btn btn-secondary" style="flex:none; padding:10px 12px;" onclick="app.quickPaid('all')">Tutto</button>
          </div>
          <div class="money-row"><span class="form-label" style="margin:0;">Da incassare</span><b id="dueAmount">${EUR(Math.max(0, (Number(b.total) || 0) - (parseFloat(this.bookingPaidDraft) || 0)))}</b></div>` : ''}
          <span class="form-label">Stato pagamento</span>
          <select id="paymentSelect" class="form-input" onchange="app.bookingPaymentDraft = this.value">${paymentOptions}</select>
          <span class="form-label">Note</span>
          <textarea class="form-input" style="min-height:90px; resize:vertical;" placeholder="Es. arriva in ritardo, ha chiesto una culla…" oninput="app.bookingNotesDraft = this.value">${this.escape(this.bookingNotesDraft)}</textarea>
          <button class="btn btn-primary" ${this.bookingSaving ? 'disabled' : ''} onclick="app.saveBookingDetail()">${this.bookingSaving ? 'Salvataggio…' : 'Salva modifiche'}</button>
        `}
      </div>
      ${this.bookingDetailOrigin === 'bookingHistory' ? `
      <div class="detail-card">
        <button class="btn btn-reject" style="width:100%;" onclick="app.dismissBooking(${b.id})">Elimina prenotazione</button>
      </div>` : ''}`;
  }

  formatDate(dateStr, full) {
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return '';
    if (full) {
      return d.toLocaleString('it-IT', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    return d.toLocaleString('it-IT', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  escape(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  render() {
    if (this._lastView !== this.view) {
      this._lastView = this.view;
      this.viewTrail.push(this.view);
      if (this.viewTrail.length > 8) this.viewTrail.shift();
    }
    const el = document.getElementById('app');
    if (this.view === 'setup') el.innerHTML = this.renderSetup();
    else if (this.view === 'login') el.innerHTML = this.renderLogin();
    else if (this.view === 'loading' || this.view === 'init') el.innerHTML = this.renderLoading();
    // Prima "analyzing" non aveva una schermata: durante la rianalisi restava
    // quella vecchia, senza nessun segno che stesse succedendo qualcosa.
    else if (this.view === 'analyzing') el.innerHTML = `<div class="loading" style="padding-top:120px;"><div class="spinner"></div>Rianalizzo l'email…</div>`;
    else if (this.view === 'dashboard') el.innerHTML = this.renderDashboard();
    else if (this.view === 'emails') el.innerHTML = this.renderEmails();
    else if (this.view === 'detail') el.innerHTML = this.renderDetail();
    else if (this.view === 'quoteStandalone') el.innerHTML = this.renderStandaloneQuote();
    else if (this.view === 'bookingsList') el.innerHTML = this.renderBookingsList();
    else if (this.view === 'bookingHistory') el.innerHTML = this.renderBookingHistory();
    else if (this.view === 'statistics') el.innerHTML = this.renderStatistics();
    else if (this.view === 'statisticsMonth') el.innerHTML = this.renderStatisticsMonth();
    else if (this.view === 'reminders') el.innerHTML = this.renderReminders();
    else if (this.view === 'testLab') el.innerHTML = this.renderTestLab();
    else if (this.view === 'bookingDetail') el.innerHTML = this.renderBookingDetail();
    else if (this.view === 'calendarSettings') el.innerHTML = this.renderCalendarSettings();
    this.updateAppBadge();
  }

  updateAppBadge() {
    if (!('setAppBadge' in navigator)) return;
    try {
      const total = Object.keys(CATEGORY_META).reduce((sum, cat) => sum + this.unresolvedCount(cat), 0);
      if (total > 0) navigator.setAppBadge(total).catch(() => {});
      else if ('clearAppBadge' in navigator) navigator.clearAppBadge().catch(() => {});
    } catch (e) {}
  }
}

// Niente zoom con il pizzico: iPhone ignora user-scalable=no del viewport,
// quindi il gesto va bloccato anche qui.
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.scale !== undefined && e.scale !== 1) e.preventDefault(); }, { passive: false });

const app = new ACME();
window.__acme = app;
app.init();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(() => app.checkPushStatus())
      .then(() => app.render())
      .catch(() => {});
  });
}
</script>
</body>
</html>
